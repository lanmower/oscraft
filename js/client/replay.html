<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>oscraft replay</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1d252c; color: #d8e0e6; font: 13px system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100vw; height: calc(100vh - 56px); }
    #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: rgba(0, 0, 0, 0.6); box-sizing: border-box; }
    #seek { flex: 1; }
    #status { position: fixed; left: 8px; top: 8px; padding: 6px 8px; background: rgba(0, 0, 0, 0.5); border-radius: 4px; white-space: pre; }
    #load { position: fixed; right: 8px; top: 8px; padding: 6px 8px; background: rgba(0, 0, 0, 0.5); border-radius: 4px; }
  </style>
</head>
<body data-pkg="pkg/web.js" data-map="map.bin">
  <canvas id="view"></canvas>
  <div id="status">loading</div>
  <div id="load">
    <input id="file" type="file" accept=".replay,text/plain">
    <a href="play.html" style="color:#9cf">play</a>
  </div>
  <div id="bar">
    <button id="play" disabled>play</button>
    <button id="pause" disabled>pause</button>
    <label>speed <select id="speed"><option>1</option><option>2</option><option>4</option><option>8</option><option>16</option><option>32</option><option>64</option></select></label>
    <input id="seek" type="range" min="0" max="0" value="0" disabled>
    <span id="tick">0 / 0</span>
    <button id="fit">fit</button>
    <button id="free">free camera</button>
  </div>
  <script type="module" src="replay.js"></script>
</body>
</html>
