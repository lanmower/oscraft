  <!-- The page's whole module graph and the sim binary. Without these the browser discovers the
       imports one level at a time and reaches the wasm last, after every script has run; with them
       every module and the wasm start with the document's first byte. The wasm needs crossorigin:
       the glue fetches it with fetch(), whose default mode is cors, and a preload without the
       attribute is a no-cors request that the fetch cannot reuse.
       The import map's entries are vendored under ./vendor by scripts/vendor-cdn.mjs, so nothing on
       this page comes from another origin: no second DNS lookup or TLS handshake, and the modules
       are hinted here with the rest instead of being discovered after play.js is parsed.
       scripts/check-modulepreload.mjs keeps this list equal to the graph play.js and rooms.js reach. -->

  <style>
    /* Shared tokens for every HUD panel: one palette, one type scale, one set of states. */
    :root {
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --t-label: 11px;
      --t-body: 12px;
      --t-title: 14px;
      --t-head: 18px;
      --panel: rgba(14, 18, 23, 0.92);
      --panel-strong: rgba(12, 15, 19, 0.96);
      --well: #1b222a;
      --well-hi: #242e38;
      --well-dim: #161c22;
      --edge: #33404b;
      --line: #252e37;
      --hover-edge: #6b7d8c;
      --sel: #ffffff;
      --shade: rgba(6, 8, 10, 0.68);
      --text: #e6ecf1;
      --muted: #9aa7b2;
      --faint: #5f6c77;
      --accent: #f2c14e;
      --gold: #f2c14e;
      --hp: #4caf50;
      --mp: #3d7bff;
      --ok: #3f7d4a;
      --ok-bg: #22392a;
      --bad: #ff7a6b;
      --warn: #ff9b7a;
      --team0: #6aa6ff;
      --team1: #ff7566;
      --me-bg: rgba(242, 193, 78, 0.12);
    }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: #1d252c; color: var(--text); font: var(--t-body) / 1.3 var(--font); overflow: hidden; }
    canvas#view { display: block; width: 100vw; height: 100vh; }
    /* The lobby is appended after the 100vh canvas, so it is placed as a centred overlay above the HUD frames. */
    #lobby { position: fixed; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(960px, 96vw); max-height: 96vh; overflow: auto; box-sizing: border-box; padding: 12px; background: var(--panel-strong); border: 1px solid var(--edge); border-radius: 6px; }
    /* Top-left column: status, hud line, editor link, then the skill panel. */
    #ui-left { position: fixed; z-index: 2; left: 8px; top: 8px; width: 240px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
    #ui-left > * { pointer-events: auto; }
    #status { padding: 5px 8px; background: var(--panel); border: 1px solid var(--edge); border-radius: 4px; white-space: pre; font-size: var(--t-label); color: var(--muted); }
    #hud { padding: 5px 8px; background: var(--panel); border: 1px solid var(--edge); border-radius: 4px; font-variant-numeric: tabular-nums; color: var(--text); font-size: var(--t-body); }
    #ui-left a { color: #8fc4ff; font-size: var(--t-label); padding: 0 2px; }
    /* Top-right column: room picker, then the shop. */
    #ui-right { position: fixed; z-index: 2; right: 8px; top: 8px; width: 360px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none; }
    #ui-right > * { pointer-events: auto; }
    #rooms { box-sizing: border-box; width: 200px; padding: 6px 8px; background: var(--panel); border: 1px solid var(--edge); border-radius: 4px; font-size: var(--t-body); }
    #rooms ul { list-style: none; margin: 4px 0; padding: 0; max-height: 96px; overflow: auto; }
    #rooms button { width: 100%; text-align: left; margin: 2px 0; background: var(--well); color: var(--text); border: 1px solid var(--edge); border-radius: 3px; padding: 3px 6px; font: var(--t-label) var(--font); cursor: pointer; }
    #rooms input { box-sizing: border-box; width: 100%; background: var(--well); border: 1px solid var(--edge); border-radius: 3px; color: var(--text); font: var(--t-label) var(--font); padding: 3px 6px; }
    #rooms #room-join { margin-top: 4px; }
    /* Bottom bar: selection | inventory | minimap, one frame at every size. */
    #ui-bar { position: fixed; z-index: 2; left: 0; right: 0; bottom: 0; height: 160px; box-sizing: border-box; padding: 8px 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto 200px; gap: 12px; align-items: stretch; background: var(--panel-strong); border-top: 1px solid var(--edge); }
    #ui-bar-left, #ui-bar-mid, #ui-bar-right { min-width: 0; min-height: 0; }
    #ui-bar-right { display: flex; align-items: flex-start; justify-content: flex-end; }
    #minimap { display: block; border-radius: 3px; cursor: crosshair; background: #1a2129; }
    #win { position: fixed; z-index: 3; left: 50%; top: 40%; transform: translate(-50%, -50%); padding: 16px 24px; background: var(--panel-strong); border: 1px solid var(--edge); border-radius: 6px; font-size: var(--t-head); font-weight: 700; color: var(--accent); }

    <div id="ui-bar-mid"></div>
