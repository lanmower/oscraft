<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>oscraft net client</title>
  <script type="importmap">
  {
    "imports": {
      "wireweave": "https://cdn.jsdelivr.net/gh/AnEntrypoint/wireweave@a71f179cc5352964bc014deea166969938705e61/src/index.js",
      "nostr-tools": "https://cdn.jsdelivr.net/npm/nostr-tools@2.10.0/+esm",
      "xstate": "https://cdn.jsdelivr.net/npm/xstate@5.19.0/+esm"
    }
  }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #1d252c; color: #d8e0e6; font: 13px system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #status { position: fixed; left: 8px; top: 8px; padding: 6px 8px; background: rgba(0, 0, 0, 0.5); border-radius: 4px; white-space: pre; }
    #rooms { position: fixed; right: 8px; top: 8px; min-width: 160px; padding: 6px 8px; background: rgba(0, 0, 0, 0.5); border-radius: 4px; }
    #rooms ul { list-style: none; margin: 4px 0; padding: 0; }
    #rooms button { width: 100%; text-align: left; margin: 2px 0; }
    #hud { position: fixed; left: 8px; bottom: 8px; padding: 6px 8px; background: rgba(0, 0, 0, 0.5); border-radius: 4px; }
    #win { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); padding: 16px 24px; background: rgba(0, 0, 0, 0.7); border-radius: 6px; font-size: 28px; }
  </style>
</head>
<body data-pkg="pkg/web.js" data-map="map.bin">
  <canvas id="view"></canvas>
  <div id="status">connecting</div>
  <div id="hud"></div>
  <div id="win" hidden></div>
  <form id="rooms" data-ready="0" autocomplete="off">
    <div>room <span id="room-current"></span></div>
    <ul id="room-list"></ul>
    <input id="room-name" maxlength="64" placeholder="room name">
    <button id="room-join" type="submit">join</button>
  </form>
  <script type="module" src="rooms.js"></script>
  <script type="module" src="play.js"></script>
</body>
</html>
