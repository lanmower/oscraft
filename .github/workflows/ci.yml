          -- Spawns one skirmisher on tick 1, then orders its handle to one of two points every 40 ticks.
          function on_tick(state)
            state.ticks = (state.ticks or 0) + 1
            if state.ticks == 1 then
              state.handle = game.cmd_spawn("skirmisher", 3 * 65536, 3 * 65536)
            elseif state.handle then
              local x = ((state.ticks // 40) % 2 == 0) and 4 or 8
              game.cmd_order_handle(state.handle, x * 65536, 4 * 65536)
            end
          end
          LUA
          addr=127.0.0.1:18445
          log="$work/server.log"
          ./target/debug/oscraftd --addr "$addr" --room kindchange --data "$work/data" --mod "$work/mod.lua" > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          wait_for() {
            for i in $(seq 1 $(( ${2:-60} * 4 ))); do
              grep -q "$1" "$log" && return 0
              kill -0 "$pid" 2>/dev/null || { cat "$log"; echo "server exited before: $1"; exit 1; }
              sleep 0.25
            done
            cat "$log"
            echo "timed out waiting for: $1"
            exit 1
          }
          wait_for 'ev=mod_unit_bound'
          bound=$(grep -o 'ev=mod_unit_bound handle=[0-9]* unit=[0-9]*' "$log" | head -n 1)
          handle=$(echo "$bound" | sed 's/.*handle=\([0-9]*\).*/\1/')
          unit=$(echo "$bound" | sed 's/.*unit=//')
          [[ -n "$handle" && -n "$unit" ]] || { echo "no mod unit bound"; cat "$log"; exit 1; }
          # The map places units 0 to 7, so the mod's skirmisher holds index 8. Appending a tender places a different kind at that index.
          printf '\nspawn("tender", 0, 2500, 21500)\n' >> "$work/data/map.osd"
          wait_for 'ev=data_reloaded'
          expect="ev=mod_unit_refused handle=$handle unit=$unit reason=kind_changed"
          if [[ "$(grep -cF "$expect" "$log")" -ne 1 ]]; then
            cat "$log"
            echo "expected exactly one line: $expect"
            exit 1
          fi
          kill "$pid"; wait "$pid" 2>/dev/null || true; trap - EXIT
          echo "mod handle dropped on kind change ok handle=$handle unit=$unit reason=kind_changed"

  page-edit-rejected:
    name: a broken main.js edit leaves the served page running with one client_error line, and a good edit reloads it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: rust-workspace

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Export the map image and build the wasm module into the page
        run: |
          cargo run -p mapexport -- crates/web/site/map.bin
          wasm-pack build crates/web --target web --out-dir site/pkg --no-opt

      - name: Install headless Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: Serve a job-owned copy of the site, break its main.js, and check the page rejects the edit
        run: |
          set -euo pipefail
          cargo build -p server --bin oscraftd
          work="$RUNNER_TEMP/edit-rejected"
          mkdir -p "$work"
          cp -r crates/web/site "$work/site"
          cat > "$RUNNER_TEMP/pw/edit-rejected.mjs" <<'JS'
          import { chromium } from "playwright";
          import { spawn } from "child_process";
          import { openSync, readFileSync, writeFileSync } from "fs";
          const [bin, site, addr, log] = process.argv.slice(2);
          const base = "http://" + addr;
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const server = spawn(bin, ["--addr", addr, "--room", "ci-edit-rejected", "--site", site], { stdio: ["ignore", openSync(log, "a"), openSync(log, "a")] });
          const stamp = async () => (await (await fetch(base + "/site/version", { cache: "no-store" })).json()).page;
          async function until(what, fn, ms) {
            const end = Date.now() + ms;
            for (;;) {
              try { const v = await fn(); if (v) return v; } catch {}
              if (Date.now() > end) throw new Error("timed out: " + what);
              await sleep(250);
            }
          }
          const rejectLines = () => readFileSync(log, "utf8").split("\n").filter((l) => l.startsWith("ev=client_error ") && l.includes('message="page edit rejected: '));
          await until("server answers /site/version", stamp, 60000);
          const browser = await chromium.launch({ args: ["--use-angle=swiftshader", "--enable-unsafe-swiftshader"] });
          const page = await browser.newPage({ viewport: { width: 1024, height: 768 } });
          const errors = [];
          page.on("pageerror", (e) => errors.push(String(e)));
          await page.goto(base + "/site/");
          await page.waitForSelector("body[data-ready='1'], body[data-error]", { timeout: 60000 });
          const pageError = await page.getAttribute("body", "data-error");
          if (pageError) throw new Error("page error: " + pageError);
          const before = await until("page stamp", () => page.getAttribute("body", "data-page-version"), 15000);
          await page.evaluate(() => { window.__sameDocument = "yes"; });
          const file = site + "/main.js";
          const good = readFileSync(file, "utf8");
          writeFileSync(file, good + "\nfunction ci_broken( {\n");
          await until("server stamps the broken main.js", async () => (await stamp()) !== before, 15000);
          await until("server relays the rejection to the log", async () => rejectLines().length >= 1, 30000);
          await sleep(4000);
          if (await page.getAttribute("body", "data-page-version") !== before) throw new Error("page moved to a new stamp on a broken main.js");
          if (await page.evaluate(() => window.__sameDocument) !== "yes") throw new Error("page reloaded on a broken main.js");
          if (rejectLines().length !== 1) throw new Error("expected one client_error line, got " + rejectLines().length + ": " + rejectLines().join("\n"));
          if (server.exitCode !== null) throw new Error("server exited during the rejected edit");
          writeFileSync(file, good + `\n// ci edit rejected restore ${Date.now()}\n`);
          const after = await until("page reloads after the good edit", async () => {
            const v = await page.getAttribute("body", "data-page-version");
            return v && v !== before ? v : null;
          }, 30000);
          if (await page.evaluate(() => window.__sameDocument) !== undefined) throw new Error("page kept its document after the good edit; no reload happened");
          await page.waitForSelector("body[data-ready='1']", { timeout: 60000 });
          await sleep(3000);
          if (await page.getAttribute("body", "data-page-version") !== after) throw new Error("page reloaded more than once");
          if (rejectLines().length !== 1) throw new Error("client_error line count changed after the fix: " + rejectLines().length);
          if (errors.length) throw new Error("page errors: " + errors.join("\n"));
          console.log("browser broken edit rejected page_version=" + before + " reloaded_after_fix=true");
          await browser.close();
          server.kill();
          JS
          node "$RUNNER_TEMP/pw/edit-rejected.mjs" "$PWD/target/debug/oscraftd" "$work/site" 127.0.0.1:8009 "$work/server.log"

  carry-drop-branch-exercised:
    name: a reload that renames a unit kind during a running match drops that unit and the drop is printed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: rust-workspace

      - name: Build the server
        run: cargo build -p server --bin oscraftd

      - name: Rename the gunship kind in the catalog and map under a running match; the carry drop is printed and the unit count falls by exactly that many
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/carry-drop"
          rm -rf "$work"
          mkdir -p "$work"
          cp data/*.osd "$work/"
          addr=127.0.0.1:18446
          log="$work/server.log"
          ./target/debug/oscraftd --addr "$addr" --room drop --data "$work" > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          state() { curl -sf "http://$addr/state"; }
          for i in $(seq 1 60); do state >/dev/null 2>&1 && break; sleep 0.5; done
          before=$(state | jq -r .units)
          test "$before" -gt 0
          sed -i 's/"gunship"/"gunship_renamed"/g' "$work"/*.osd
          for i in $(seq 1 60); do grep -q '^ev=data_reloaded room=drop ' "$log" && break; sleep 0.5; done
          grep -q '^ev=data_reloaded room=drop ' "$log"
          line=$(grep '^ev=data_reloaded room=drop ' "$log" | head -n 1)
          dropped=$(sed -n 's/.* refused=\([0-9]*\).*/\1/p' <<<"$line")
          test -n "$dropped"
          test "$dropped" -ge 1
          after=$(state | jq -r .units)
          test "$after" -eq $(( before - dropped ))
          kill "$pid"; wait "$pid" 2>/dev/null || true; trap - EXIT
          echo "carry drop exercised dropped=$dropped before=$before after=$after"

  late-join-snapshot:
    name: a late joiner's /state snapshot plus /delta since its tick matches a fresh /state
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: rust-workspace

      - name: Snapshot at tick t, order, advance, then /delta since t applied to the snapshot matches a fresh /state at the same tick
        run: |
          set -euo pipefail
          cargo build -p server --bin oscraftd
          work="$RUNNER_TEMP/late-join"
          rm -rf "$work"
          mkdir -p "$work"
          cp data/*.osd "$work/"
          addr=127.0.0.1:18447
          log="$work/server.log"
          target/debug/oscraftd --addr "$addr" --room ci --data "$work" --ticks 100000000 --tick-budget-us 20000 > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; echo "server log:"; tail -n 40 "$log" || true' EXIT
          state() { curl -sf "http://$addr/state"; }
          for i in $(seq 1 60); do state >/dev/null 2>&1 && break; sleep 0.5; done
          wait_tick() {
            for i in $(seq 1 240); do
              now=$(state | jq -r .tick)
              test "$now" -ge "$1" && return 0
              sleep 0.1
            done
            return 1
          }
          token=$(sed -n 's/^ev=order_token room=ci token=//p' "$log")
          test -n "$token"
          wait_tick 8
          snap=$(state)
          t=$(jq -r .tick <<<"$snap")
          test "$(jq -r '.records | length' <<<"$snap")" = "$(jq -r .units <<<"$snap")"
          test "$(jq -r .units <<<"$snap")" -gt 0
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $token" "http://$addr/order?map=ci" --data '{"player":0,"x":5,"y":5}')
          test "$code" = 200
          wait_tick $((t + 8))
          ok=""
          for i in $(seq 1 50); do
            delta=$(curl -sf "http://$addr/delta?since=$t")
            D=$(jq -r .tick <<<"$delta")
            fresh=$(state)
            if [ "$(jq -r .tick <<<"$fresh")" = "$D" ]; then ok=1; break; fi
            sleep 0.05
          done
          test -n "$ok"
          test "$(jq -r '.records | length' <<<"$delta")" = "$(jq -r .changed <<<"$delta")"
          test "$(jq -r '.records | length' <<<"$fresh")" = "$(jq -r .units <<<"$fresh")"
          applied=$(jq -c -n --argjson s "$snap" --argjson d "$delta" '
            ($d.records | map(select(.alive == false) | .id)) as $dead
            | ([$s.records[] | select(.id as $i | $dead | contains([$i]) | not)]
               + [$d.records[] | select(.alive == true) | del(.alive)])
            | group_by(.id) | map(last) | map({id,x,y,hp}) | sort_by(.id)')
          fresh_set=$(jq -c '[.records[] | {id,x,y,hp}] | sort_by(.id)' <<<"$fresh")
          if [ "$applied" != "$fresh_set" ]; then
            echo "late join mismatch tick=$D"
            echo "applied=$applied"
            echo "fresh=$fresh_set"
            exit 1
          fi
          n=$(jq -r .units <<<"$fresh")
          echo "late join ok ticks=$t units=$n"
          kill "$pid"; wait "$pid" 2>/dev/null || true
          trap - EXIT

  wire:
    name: wire frame codec round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: js/wire
    steps:
      - uses: actions/checkout@v4

      - name: Round-trip and reject tests
        run: node test.js

  net-client-bundle:
    name: net client bundle builds with esbuild and play.html references it
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: js/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install client dependencies and bundle play.js
        run: |
          npm install
          npm run build

      - name: Assert the bundle is produced and play.html references it
        run: |
          test -s dist/play.js || { echo "net client bundle missing: js/client/dist/play.js"; exit 1; }
          grep -q 'dist/play.js' play.html || { echo "play.html does not reference dist/play.js"; exit 1; }
          echo "net client bundle ok bytes=$(wc -c < dist/play.js)"

  net-host-usage:
    name: net host --help exits 0 and prints its usage line
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: node js/host/server.js --help
        run: |
          node js/host/server.js --help > /tmp/net-host-help.txt
          code=$?
          cat /tmp/net-host-help.txt
          test "$code" = 0
          grep -q '^usage: node js/host/server.js --wasm' /tmp/net-host-help.txt
          echo "net host usage ok"

  net-host-persistent:
    name: net host keeps one wasip1 guest across 50 ticks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/crates/wasip1 -> target
          shared-key: rust-wasip1

      - name: Build the sim as a wasip1 guest
        working-directory: rust/crates/wasip1
        run: cargo build --release --target wasm32-wasip1 --bin oscraft_wasip1

      - name: Write the OSDT image
        working-directory: rust
        run: cargo run -q -p osdt-data -- data "$RUNNER_TEMP/catalog.osdt"

      - name: One persistent guest, 50 ticks and one order, tick count and tick cost asserted
        env:
          GUEST_JS: ${{ github.workspace }}/js/host/guest.js
          GUEST_WASM: ${{ github.workspace }}/rust/crates/wasip1/target/wasm32-wasip1/release/oscraft_wasip1.wasm
          GUEST_IMAGE: ${{ runner.temp }}/catalog.osdt
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          import { performance } from 'node:perf_hooks';

          const { openGuest, readTick, replyValue } = await import(pathToFileURL(process.env.GUEST_JS).href);
          const fail = (why) => { console.error(`net host persistent FAIL ${why}`); process.exit(1); };
          const expect = (reply, prefix) => (reply.startsWith(prefix) ? reply : fail(`reply "${reply}"`));

          const guest = await openGuest(process.env.GUEST_WASM, readFileSync(process.env.GUEST_IMAGE));
          const first = await readTick(guest);
          const start = Number(replyValue(expect(await guest.command('ticks'), 'ok ticks '), 'ok ticks '));
          if (!(first.count > 0)) fail(`unit-count ${first.count}`);
          expect(await guest.command('order 0 0 0'), 'ok order');

          const times = [];
          for (let i = 0; i < 50; i++) {
            const t0 = performance.now();
            await readTick(guest);
            times.push(performance.now() - t0);
          }
          const end = Number(replyValue(expect(await guest.command('ticks'), 'ok ticks '), 'ok ticks '));
          await guest.close();

          if (end - start !== 50) fail(`ticks advanced ${end - start}, want 50`);
          const sum = (xs) => xs.reduce((a, b) => a + b, 0);
          const ratio = sum(times.slice(40)) / sum(times.slice(0, 10));
          if (!(ratio <= 3)) fail(`last-10 over first-10 ratio ${ratio.toFixed(2)} > 3`);
          console.log(`net host persistent ok ticks=50 ratio=${ratio.toFixed(2)}`);
          process.exit(0);
          JS

  net-e2e-two-peers:
    name: "two headless peers join room ci through the relay; an order moves a unit"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"
          shared-key: rust-net-e2e
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the wasip1 guest, the image, the map and the page wasm
        run: |
          set -euo pipefail
          (cd rust/crates/wasip1 && cargo build --release --target wasm32-wasip1 --bin oscraft_wasip1)
          (cd rust && cargo build -p osdt-data && ./target/debug/osdt-data data "$RUNNER_TEMP/catalog.osdt" && cargo run -p mapexport -- ../js/client/map.bin)
          (cd rust && wasm-pack build crates/web --target web --out-dir ../../../js/client/pkg --no-opt)
      - name: Bundle the client and install the host
        run: |
          set -euo pipefail
          (cd js/client && npm install && npm run build)
          (cd js/host && npm install)
          test -s js/client/dist/play.js
          test -s js/client/pkg/web.js
          test -s js/client/map.bin
      - name: Install headless Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright@1.47.0
          npx playwright install --with-deps chromium
      - name: "Relay, host and two peers: an order from peer A moves the unit both peers see"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/net-e2e"
          mkdir -p "$work"
          node js/host/test-relay.js 7447 > "$work/relay.log" 2>&1 &
          relay=$!
          python3 -m http.server 8090 --bind 127.0.0.1 --directory js/client > "$work/static.log" 2>&1 &
          static=$!
          OSCRAFT_RELAYS=ws://127.0.0.1:7447 OSCRAFT_NAMESPACE=oscraft-ci node js/host/server.js --wasm rust/crates/wasip1/target/wasm32-wasip1/release/oscraft_wasip1.wasm --data "$RUNNER_TEMP/catalog.osdt" --room ci --tick-ms 100 > "$work/host.log" 2>&1 &
          host=$!
          trap 'kill $host $relay $static 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do grep -q '^ev=host_started ' "$work/host.log" && break; sleep 1; done
          grep -q '^ev=host_started ' "$work/host.log"
          cat > "$RUNNER_TEMP/pw/check.mjs" <<'EOF'
          import { chromium } from "playwright";
          import { readFileSync } from "fs";
          const url = "http://127.0.0.1:8090/play.html?ci=1&relay=ws://127.0.0.1:7447&ns=oscraft-ci#ci";
          const hostLog = process.env.NET_E2E_HOST_LOG;
          const browser = await chromium.launch({ args: ["--use-angle=swiftshader", "--enable-unsafe-swiftshader", "--disable-features=WebRtcHideLocalIpsWithMdns"] });
          const pageErrors = [];
          const pages = [];
          const openPeer = async (name) => {
            const page = await (await browser.newContext()).newPage();
            page.on("pageerror", (e) => pageErrors.push(`${name} pageerror: ${e}`));
            page.on("console", (m) => { if (m.type() !== "debug") pages.push(`${name} console ${m.type()}: ${m.text()}`); });
            await page.goto(url);
            return page;
          };
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const diagnose = async (named) => {
            for (const [name, p] of named) {
              console.log(`DIAG ${name} pcs: ${await p.evaluate(() => (window.__ciDebug ? JSON.stringify(window.__ciDebug()) : 'no debug hook')).catch((e) => 'evaluate failed: ' + e)}`);
              const status = await p.evaluate(() => document.getElementById("status")?.textContent ?? "").catch((e) => "evaluate failed: " + e);
              console.log(`DIAG ${name} status: ${JSON.stringify(status)}`);
              console.log(`DIAG ${name} peers: ${await p.evaluate(() => (window.__ciPeers ? window.__ciPeers() : "no hook")).catch((e) => "evaluate failed: " + e)}`);
            }
            console.log("DIAG page logs:\n" + pages.slice(0, 80).join("\n"));
            console.log("DIAG page errors: " + JSON.stringify(pageErrors));
            console.log("DIAG host log tail:\n" + readFileSync(hostLog, "utf8").split("\n").filter((l) => !l.startsWith("ev=tick ")).slice(-40).join("\n"));
          };
          let a = null;
          let b = null;
          try {
            a = await openPeer("A");
            b = await openPeer("B");
            for (const [name, p] of [["A", a], ["B", b]]) {
              await p.waitForFunction(() => window.__ciUnits && window.__ciUnits().length > 0, null, { timeout: 120000 }).catch(async (err) => {
                await diagnose([["A", a], ["B", b]]);
                throw new Error(`peer ${name} never received a state frame with units: ${err.message}`);
              });
            }
            const before = await b.evaluate(() => window.__ciUnits()[0]);
            const target = { x: Math.round(before.x) + 4, y: Math.round(before.z) };
            const moved = (s) => !!s && (Math.abs(s.x - before.x) > 0.01 || Math.abs(s.z - before.z) > 0.01);
            const deadline = Date.now() + 90000;
            let sa = null;
            let sb = null;
            while (Date.now() < deadline) {
              await a.evaluate(([id, x, y]) => window.__ciOrder(id, x, y), [before.id, target.x, target.y]);
              await sleep(1500);
              sa = await a.evaluate(() => window.__ciUnits().find((u) => u.id === 0) || null);
              sb = await b.evaluate(() => window.__ciUnits().find((u) => u.id === 0) || null);
              if (moved(sa) && moved(sb)) break;
            }
            if (!(moved(sa) && moved(sb))) {
              await diagnose([["A", a], ["B", b]]);
              throw new Error(`no state change seen: before=${before.x},${before.z} peerA=${JSON.stringify(sa)} peerB=${JSON.stringify(sb)}`);
            }
            if (pageErrors.length) throw new Error("page errors: " + pageErrors.join(" | "));
            const peerOpens = new Set(readFileSync(hostLog, "utf8").split("\n").filter((l) => l.startsWith("ev=peer_open ")).map((l) => l.match(/peer=(\S+)/)?.[1])).size;
            if (peerOpens < 2) throw new Error(`host logged ${peerOpens} peer_open events, need 2`);
            console.log(`net e2e ok peers=${peerOpens} unit=${before.id} before=${before.x},${before.z} after=${sb.x},${sb.z}`);
          } finally {
            await browser.close();
          }
          EOF
          NET_E2E_HOST_LOG="$work/host.log" node "$RUNNER_TEMP/pw/check.mjs" | tee "$work/e2e.txt"
          grep -q '^net e2e ok peers=2 ' "$work/e2e.txt"
      - name: Upload the relay, host and static logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: net-e2e-logs
          path: ${{ runner.temp }}/net-e2e
          if-no-files-found: ignore

  duel-routes:
    name: duel-routes scenario loads and runs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: rust-workspace

      - name: Compile the scenario, run 200 ticks, check sides, routes and an objective's hit points
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/duel-routes"
          mkdir -p "$work"
          addr=127.0.0.1:8106
          pid=0
          on_exit() {
            rc=$?
            [ "$pid" -ne 0 ] && kill "$pid" 2>/dev/null || true
            if [ "$rc" -ne 0 ]; then echo "--- server log tail"; tail -n 120 "$work/server.log" 2>/dev/null || echo "(no server log)"; fi
            exit "$rc"
          }
          trap on_exit EXIT
          cd rust
          cargo build -p server --bin oscraftd
          cargo build -p osdt-data
          ./target/debug/osdt-data ../scenarios/duel-routes "$work/catalog.osdt"
          target/debug/oscraftd --addr "$addr" --room ci --data "$work/catalog.osdt" --ticks 100000000 > "$work/server.log" 2>&1 &
          pid=$!
          for i in $(seq 1 60); do curl -s -o /dev/null "http://$addr/" && break; sleep 0.5; done
          echo "state http=$(curl -s -o "$work/s0.json" -w '%{http_code}' "http://$addr/state?map=ci")"
          cat "$work/s0.json" | head -c 600; echo
          tick=0
          for i in $(seq 1 240); do
            curl -sf "http://$addr/state?map=ci" > "$work/s1.json" || true
            tick=$(jq -r '.tick // 0' "$work/s1.json" 2>/dev/null || echo 0)
            test "$tick" -ge 200 && break
            sleep 0.5
          done
          test "$tick" -ge 200
          sides=$(jq '[.records[].player | select(. >= 0)] | unique | length' "$work/s1.json")
          routes=$(jq '[.records[] | select(.kind == 3) | .y] | unique | length' "$work/s1.json")
          objectives=$(jq '[.records[] | select(.kind == 3)] | length' "$work/s1.json")
          hp_changed=$(jq -n --slurpfile a "$work/s0.json" --slurpfile b "$work/s1.json" '[ $b[0].records[] | select(.kind == 3) as $r | ($a[0].records[] | select(.id == $r.id and .kind == 3)) as $o | select($o.hp != $r.hp) ] | length > 0')
          test "$sides" -eq 2
          test "$routes" -eq 3
          test "$objectives" -ge 1
          test "$hp_changed" = true
          echo "scenario ok sides=$sides routes=$routes objectives=$objectives hp_changed=$hp_changed"

  order-peer-ownership:
    name: order ownership refuses a peer's order on a foreign unit and leaves it in place
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/crates/wasip1 -> target
          shared-key: rust-wasip1

      - name: Build the sim as a wasip1 guest
        working-directory: rust/crates/wasip1
        run: cargo build --release --target wasm32-wasip1 --bin oscraft_wasip1

      - name: Write the OSDT image
        working-directory: rust
        run: cargo run -q -p osdt-data -- data "$RUNNER_TEMP/catalog.osdt"

      - name: A peer's order on a unit it does not own is refused and leaves the state unchanged
        env:
          HOST_JS: ${{ github.workspace }}/js/host/server.js
          GUEST_JS: ${{ github.workspace }}/js/host/guest.js
          GUEST_WASM: ${{ github.workspace }}/rust/crates/wasip1/target/wasm32-wasip1/release/oscraft_wasip1.wasm
          GUEST_IMAGE: ${{ runner.temp }}/catalog.osdt
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';

          const { applyOrder, assignPlayer } = await import(pathToFileURL(process.env.HOST_JS).href);
          const { openGuest, readTick } = await import(pathToFileURL(process.env.GUEST_JS).href);
          const fail = (why) => { console.error(`order ownership FAIL ${why}`); process.exit(1); };

          const image = readFileSync(process.env.GUEST_IMAGE);
          const players = new Map();
          const owner = 'aa'.repeat(32);
          const other = 'bb'.repeat(32);
          const ownerPlayer = assignPlayer(players, owner);
          const otherPlayer = assignPlayer(players, other);
          if (ownerPlayer === null || otherPlayer === null || ownerPlayer === otherPlayer) fail('players not distinct');

          // Three guests run the same deterministic sim: a baseline with no order, one that gets a refused
          // foreign order, and one that gets the owner's order (the control that proves the check can fail).
          const baseline = await openGuest(process.env.GUEST_WASM, image);
          const refusedGuest = await openGuest(process.env.GUEST_WASM, image);
          const ownGuest = await openGuest(process.env.GUEST_WASM, image);
          const first = await readTick(baseline);
          await readTick(refusedGuest);
          await readTick(ownGuest);
          const unit = first.units.find((u) => u.player === ownerPlayer) ?? fail(`no unit owned by player ${ownerPlayer}`);
          const position = (r) => {
            const u = r.units.find((v) => v.id === unit.id);
            return u ? `${u.x},${u.y}` : fail(`unit ${unit.id} missing`);
          };

          const refused = await applyOrder({ guest: refusedGuest, players, peerPubkey: other, unitId: unit.id, x: unit.x + 4, y: unit.y });
          const applied = await applyOrder({ guest: ownGuest, players, peerPubkey: owner, unitId: unit.id, x: unit.x + 4, y: unit.y });
          if (refused !== 'refused') fail(`foreign order was ${refused}`);
          if (applied !== 'applied') fail(`own order was ${applied}`);

          let changed = false;
          for (let i = 0; i < 5; i++) {
            const a = await readTick(refusedGuest);
            const b = await readTick(baseline);
            const c = await readTick(ownGuest);
            if (a.hash !== b.hash || position(a) !== position(b)) fail(`refused order changed state at tick ${i + 2}: unit ${unit.id} ${position(a)} vs baseline ${position(b)}`);
            changed = changed || c.hash !== b.hash;
          }
          await baseline.close();
          await refusedGuest.close();
          await ownGuest.close();
          if (!changed) fail('owner order left no state change: the control cannot detect a move');
          console.log('order ownership ok refused=1 moved=false');
          process.exit(0);
          JS

  lobby-room-select:
    name: lobby room panel lists two announced rooms and joins the chosen one
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install headless Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: Announce two rooms, join one from the panel, confirm the reload joined it
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/lobby"
          mkdir -p "$work"
          python3 -m http.server 8091 --bind 127.0.0.1 --directory js/client > "$work/static.log" 2>&1 &
          static=$!
          trap 'kill $static 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8091/play.html > /dev/null && break; sleep 1; done
          cat > "$RUNNER_TEMP/pw/lobby.mjs" <<'EOF'
          import { chromium } from "playwright";
          const browser = await chromium.launch();
          const errors = [];
          try {
            const page = await browser.newPage();
            page.on("pageerror", (e) => errors.push(e.message));
            await page.goto("http://127.0.0.1:8091/play.html#lobby");
            await page.waitForSelector('#rooms[data-ready="1"]', { state: "attached", timeout: 60000 });
            await page.evaluate(() => window.dispatchEvent(new CustomEvent("oscraft:rooms", { detail: { rooms: ["alpha", "beta"] } })));
            const names = await page.$$eval("#room-list button", (bs) => bs.map((b) => b.dataset.room));
            if (names.length !== 2 || !names.includes("alpha") || !names.includes("beta")) throw new Error(`panel lists ${JSON.stringify(names)}`);
            await Promise.all([page.waitForEvent("load"), page.click('#room-list button[data-room="beta"]')]);
            await page.waitForSelector('#rooms[data-ready="1"]', { state: "attached", timeout: 60000 });
            const joined = await page.textContent("#room-current");
            if (joined !== "beta") throw new Error(`joined ${joined}, want beta`);
            console.log(`lobby room select ok rooms=${names.length} joined=${joined}`);
          } catch (err) {
            console.error(`page errors: ${errors.join(" | ")}`);
            throw err;
          } finally {
            await browser.close();
          }
          EOF
          node "$RUNNER_TEMP/pw/lobby.mjs" | tee "$work/lobby.txt"
          grep -q '^lobby room select ok rooms=2 joined=beta$' "$work/lobby.txt"
  friends-guide:
    name: docs/FRIENDS.md names only archive members for every node or ./ command
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: package-install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: oscraft-package
          path: ${{ runner.temp }}/package

      - name: Check each command in docs/FRIENDS.md against the archive manifest
        run: |
          set -euo pipefail
          archive=$(ls "$RUNNER_TEMP"/package/oscraft-*.tar.gz)
          unpacked="$RUNNER_TEMP/unpacked"
          mkdir -p "$unpacked"
          tar -C "$unpacked" -xzf "$archive"
          manifest="$unpacked/MANIFEST.sha256"
          test -s "$manifest"
          n=0
          while IFS= read -r line; do
            cmd=$(printf '%s' "$line" | sed 's/^[[:space:]]*//')
            case "$cmd" in
              "node "*) path=$(printf '%s' "$cmd" | awk '{print $2}') ;;
              "./"*) path=$(printf '%s' "$cmd" | awk '{print $1}'); path=${path#./} ;;
              *) continue ;;
            esac
            n=$((n + 1))
            awk -v p="$path" '$2 == p { found = 1 } END { exit !found }' "$manifest" \
              || { echo "docs/FRIENDS.md names a file missing from the archive manifest: $path"; exit 1; }
          done < docs/FRIENDS.md
          [ "$n" -gt 0 ] || { echo "docs/FRIENDS.md names no commands"; exit 1; }
          echo "friends guide ok commands=$n"

      - name: Show the server log when the scenario check fails
        if: failure()
        run: tail -n 120 "$RUNNER_TEMP/duel-routes/server.log" || true

  resource-names:
    name: resource and capacity names are generic in rust and js
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Count the retired resource names under rust and js
        run: |
          count() { grep -rhoi "$1" rust js | wc -l; }
          m=$(count minerals); v=$(count vespene); s=$(count supply)
          test "$m$v$s" = 000 || { echo "resource names found minerals=$m vespene=$v supply=$s"; exit 1; }
          echo "resource names ok minerals=$m vespene=$v supply=$s"

  wasip3:
    name: sim as wasip3 guest on nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust/crates/wasip3
    steps:
      - uses: actions/checkout@v4

      - name: Install the nightly toolchain with the wasm32-wasip3 target
        run: rustup toolchain install nightly --profile minimal --target wasm32-wasip3 && rustup default nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/crates/wasip3 -> target
          shared-key: rust-wasip3

      - name: Build the sim as a wasip3 guest
        run: cargo build --target wasm32-wasip3 -p wasip3-guest --release

      - name: Run the native host on the built guest
        run: cargo run --release --bin oscraft_wasip3 -- target/wasm32-wasip3/release/oscraft_wasip3.wasm

  ice-config:
    name: ICE config reads OSCRAFT_ICE as a TURN-capable list and defaults to STUN
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: ICE config with OSCRAFT_ICE set, then unset
        env:
          ICE_JS: ${{ github.workspace }}/js/client/ice.js
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ice-check.mjs" <<'JS'
          import { pathToFileURL } from 'node:url';
          const { iceServersFrom } = await import(pathToFileURL(process.env.ICE_JS).href);
          const fail = (why) => { console.error(`ice config FAIL ${why}`); process.exit(1); };
          const raw = process.env.OSCRAFT_ICE;
          const config = iceServersFrom(raw ?? null);
          const hasTurn = config.servers.some((s) => [s.urls].flat().some((u) => /^turns?:/.test(u)));
          if (raw === undefined) {
            if (!config.default || config.servers.length !== 2) fail('unset OSCRAFT_ICE must give the default STUN list');
            console.log('ice config ok default=true');
          } else {
            if (config.default) fail('OSCRAFT_ICE set but the default list was used');
            if (!hasTurn) fail('OSCRAFT_ICE set without a TURN entry');
            console.log(`ice config ok servers=${config.servers.length}`);
          }
          let refused = false;
          try { iceServersFrom('not json'); } catch { refused = true; }
          if (!refused) fail('malformed ICE config was accepted');
          process.exit(0);
          JS
          OSCRAFT_ICE='[{"urls":"turn:turn.example.org:3478","username":"u","credential":"p"},{"urls":"stun:stun.example.org:3478"}]' node "$RUNNER_TEMP/ice-check.mjs" | tee "$RUNNER_TEMP/ice-set.txt"
          grep -q '^ice config ok servers=2$' "$RUNNER_TEMP/ice-set.txt"
          env -u OSCRAFT_ICE node "$RUNNER_TEMP/ice-check.mjs" | tee "$RUNNER_TEMP/ice-unset.txt"
          grep -q '^ice config ok default=true$' "$RUNNER_TEMP/ice-unset.txt"
