name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per sha, and no run cancels another, so every sha gets a verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_NET_RETRY: "3"

jobs:
  check:
    name: build, spike and gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: rust-workspace

      - name: Build workspace (one compile for spike and gate)
        run: cargo build --workspace

      - name: Run Lua mod spike
        run: cargo run -p oscraft-spike

      - name: Run parity gate
        run: cargo run -p oscraft-gate > gate.txt 2>&1 || echo "gate exited nonzero" >> gate.txt

      - name: MPQ round-trip
        run: cargo run -p oscraft-gate -- mpq

      - name: Show gate output
        if: always()
        run: cat gate.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-output-${{ matrix.os }}
          path: rust/gate.txt

  gate-compare:
    name: compare gate output across OSes
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gate-output-*
          path: outputs
