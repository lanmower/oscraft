          if [ "$ceiling" = "unmeasured" ]; then
            echo "SKIP browser load ceiling is unmeasured in $baseline: set load_ms_ceiling from one measured run"
            exit 0
          fi
          check_load() {
            local n=$1 c=$2
            if [ "$n" -le "$c" ]; then
              echo "browser load ms=$n ceiling=$c ok"
            else
              echo "browser load ms=$n ceiling=$c FAIL"
              return 1
            fi
