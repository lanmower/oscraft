name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. A newer push cancels the older run of the same ref, so the tip
# gets a full verdict and superseded shas do not.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_NET_RETRY: "3"

jobs:
  changes:
    name: decide which jobs a change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "decide: $EVENT runs every job"
            exit 0
          fi
          code=false
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in docs/*|*.md) ;; *) code=true ;; esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "decide: pull_request code=$code changed=$(printf '%s\n' "$files" | grep -c .)"

  build:
    name: build once - workspace, test binaries, page wasm and map image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: rust-workspace

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0

      - name: Build every workspace binary
        run: cargo build --workspace

      - name: Build the page wasm and export the map image
        run: |
          set -euo pipefail
          wasm-pack build crates/web --target web --out-dir site/pkg
          target/debug/mapexport crates/web/site/map.bin
          target/debug/mapexport crates/web/site/moba.bin ../scenarios/moba

      - name: Stage the page for committing
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf js/client/pkg && cp -r rust/crates/web/site/pkg js/client/pkg && rm -f js/client/pkg/.gitignore
          cp rust/crates/web/site/map.bin js/client/map.bin
          cp rust/crates/web/site/moba.bin js/client/moba.bin
          ls -la js/client/pkg js/client/map.bin js/client/moba.bin

      - uses: actions/upload-artifact@v4
        with:
          name: ci-build
          retention-days: 1
          if-no-files-found: error
          path: |
            rust/target/debug/oscraftd
            rust/target/debug/osdt-data
            rust/target/debug/oscraft-lsp
            rust/target/debug/oscraft-spike
            rust/target/debug/oscraft-gate
            rust/target/debug/mapexport
            rust/target/debug/oscraft-relay
            rust/target/debug/reload_harness
            rust/target/debug/mod_check
            rust/crates/web/site/pkg
            rust/crates/web/site/map.bin
            rust/crates/web/site/moba.bin

      - uses: actions/upload-artifact@v4
        with:
          name: web-artifacts
          if-no-files-found: error
          path: |
            js/client/pkg
            js/client/map.bin
            js/client/moba.bin

  check:
    name: build, spike and gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: rust-workspace

      - name: Build workspace (one compile for spike and gate)
        run: cargo build --workspace

      - name: Definition extension and rejection
        shell: bash
        run: |
          osd=$(git -C "$GITHUB_WORKSPACE" ls-files | awk -F. '$NF=="osd"' | wc -l | tr -d ' ')
          star=$(git -C "$GITHUB_WORKSPACE" ls-files | awk -F. '$NF=="star"' | wc -l | tr -d ' ')
          test "$star" = 0
          d=$(mktemp -d)
          ext=star
          printf 'x = 1\n' > "$d/bad.$ext"
          if cargo run -q -p osdt-data -- "$d" "$d/out.osdt" 2> "$d/err.txt"; then echo "loader accepted a retired definition file"; exit 1; fi
          grep -q '\.osd' "$d/err.txt"
          echo "definition extension ok osd=$osd star=$star"

      - name: Run Lua mod spike
        run: cargo run -p oscraft-spike

      - name: Run parity gate
        run: cargo run -p oscraft-gate > gate.txt 2>&1 || echo "gate exited nonzero" >> gate.txt

      - name: MPQ round-trip
        run: cargo run -p oscraft-gate -- mpq

      - name: Show gate output
        if: always()
        run: cat gate.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-output-${{ matrix.os }}
          path: rust/gate.txt

  check-linux:
    name: build, spike and gate (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ci-build
          path: rust

      - name: Mark the prebuilt binaries executable
        working-directory: ${{ github.workspace }}
        run: find rust/target/debug -maxdepth 1 -type f -exec chmod +x {} +

      - name: Definition extension and rejection
        shell: bash
        run: |
          osd=$(git -C "$GITHUB_WORKSPACE" ls-files | awk -F. '$NF=="osd"' | wc -l | tr -d ' ')
          star=$(git -C "$GITHUB_WORKSPACE" ls-files | awk -F. '$NF=="star"' | wc -l | tr -d ' ')
          test "$star" = 0
          d=$(mktemp -d)
          ext=star
          printf 'x = 1\n' > "$d/bad.$ext"
          if target/debug/osdt-data "$d" "$d/out.osdt" 2> "$d/err.txt"; then echo "loader accepted a retired definition file"; exit 1; fi
          grep -q '\.osd' "$d/err.txt"
          echo "definition extension ok osd=$osd star=$star"

      - name: Run Lua mod spike
        run: target/debug/oscraft-spike

      - name: Run parity gate
        run: target/debug/oscraft-gate > gate.txt 2>&1 || echo "gate exited nonzero" >> gate.txt

      - name: MPQ round-trip
        run: target/debug/oscraft-gate mpq

      - name: Show gate output
        if: always()
        run: cat gate.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-output-ubuntu-latest
          path: rust/gate.txt

  gate-compare:
    name: compare gate output across OSes
    needs: [changes, check, check-linux]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gate-output-*
          path: outputs

  server-caps-and-ticks:
    name: "server caps, ticks, supervisor and client error probes"
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ci-build
          path: rust

      - name: Mark the prebuilt binaries executable
        working-directory: ${{ github.workspace }}
        run: find rust/target/debug -maxdepth 1 -type f -exec chmod +x {} +

      - name: Run 200 ticks with a 1 us budget and check the percentile and overrun lines
        run: |
          set -euo pipefail
          target/debug/oscraftd --addr 127.0.0.1:8098 --room ci --ticks 200 --tick-budget-us 1 > tick.log 2>&1
          cat tick.log
          grep -Eq '^ev=tick_time ticks=[0-9]+ p50_us=[0-9]+ p90_us=[0-9]+ p99_us=[0-9]+ max_us=[0-9]+ queued=[0-9]+ overruns=[0-9]+$' tick.log
          last=$(grep '^ev=tick_time ' tick.log | tail -1 | sed 's/^ev=tick_time ticks=\([0-9]*\) .*/\1/')
          test "$last" -ge 200
          grep -Eq '^ev=tick_overrun room=ci tick=[0-9]+ cost_us=[0-9]+ budget_us=1$' tick.log

      - name: Shed queued work under a sustained 1 us overrun; a generous budget sheds nothing
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tick-shed"
          mkdir -p "$work"
          ./target/debug/osdt-data data "$work/catalog.osdt"
          addr=127.0.0.1:8096
          shed_log="$work/shed.log"
          target/debug/oscraftd --addr "$addr" --room ci --data "$work/catalog.osdt" --ticks 100000000 --tick-budget-us 1 > "$shed_log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -s -o /dev/null "http://$addr/" && break; sleep 0.5; done
          token=$(sed -n 's/^ev=order_token room=ci token=//p' "$shed_log")
          test -n "$token"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $token" "http://$addr/order?map=ci" --data '{"player":0,"x":1,"y":1}')
          test "$code" = 200
          for i in $(seq 1 120); do grep -q '^ev=tick_shed ' "$shed_log" && break; sleep 0.25; done
          grep -Eq '^ev=tick_shed room=ci tick=[0-9]+ shed=[0-9]+ cap=0$' "$shed_log"
          grep '^ev=tick_shed ' "$shed_log" | head -1
          kill "$pid"; wait "$pid" 2>/dev/null || true
          trap - EXIT
          target/debug/oscraftd --addr 127.0.0.1:8095 --room ci --ticks 200 --tick-budget-us 20000 > "$work/quiet.log" 2>&1
          test "$(grep -c '^ev=tick_shed ' "$work/quiet.log")" -eq 0
          grep -q '^ev=tick_time ' "$work/quiet.log"

      - name: Drain posted orders under a generous budget; the drain logs no tick-shed
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tick-drain"
          mkdir -p "$work"
          ./target/debug/osdt-data data "$work/catalog.osdt"
          addr=127.0.0.1:8094
          log="$work/drain.log"
          target/debug/oscraftd --addr "$addr" --room ci --data "$work/catalog.osdt" --ticks 100000000 --tick-budget-us 20000 > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -s -o /dev/null "http://$addr/" && break; sleep 0.5; done
          token=$(sed -n 's/^ev=order_token room=ci token=//p' "$log")
          test -n "$token"
          posted=5
          for i in $(seq 1 $posted); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $token" "http://$addr/order?map=ci" --data '{"player":0,"x":1,"y":1}')
            test "$code" = 200
          done
          drained=0
          for i in $(seq 1 120); do
            drained=$(curl -s "http://$addr/resources" | grep -o '"orders_drained":[0-9]*' | head -1 | cut -d: -f2 || true)
            test "${drained:-0}" -ge "$posted" && break
            sleep 0.25
          done
          test "${drained:-0}" -eq "$posted"
          test "$(grep -c '^ev=tick_shed ' "$log")" -eq 0
          grep '^ev=tick_time ' "$log" | tail -1 || true
          echo "drain-check posted=$posted orders_drained=$drained tick_shed_lines=0"
          kill "$pid"; wait "$pid" 2>/dev/null || true
          trap - EXIT

      - name: Run the fixed tick count and compare p99 with the stored ceiling
        run: |
          set -euo pipefail
          check_p99() {
            local n=$1 c=$2
            if [ "$n" -le "$c" ]; then
              echo "tick p99 us=$n ceiling=$c ok"
            else
              echo "tick p99 us=$n ceiling=$c FAIL"
              return 1
            fi
          }
          baseline="$GITHUB_WORKSPACE/.github/perf/tick-baseline.txt"
          ticks=$(awk -F= '/^ticks=/{print $2}' "$baseline")
          ceiling=$(awk -F= '/^p99_ceiling_us=/{print $2}' "$baseline")
          test -n "$ticks" && test -n "$ceiling"
          target/debug/oscraftd --addr 127.0.0.1:8091 --room ci --ticks "$ticks" --tick-budget-us 20000 > tick-latency.log 2>&1
          cat tick-latency.log
          p99=$(grep '^ev=tick_time ' tick-latency.log | tail -1 | sed 's/.* p99_us=\([0-9]*\) .*/\1/')
          test -n "$p99"
          check_p99 "$p99" 0 >/dev/null && { echo "self-check: a zero ceiling must fail"; exit 1; } || echo "self-check: a zero ceiling is refused ok"
          check_p99 "$p99" "$ceiling"

      - name: Run the fixed tick count and compare each system p99 with its ceiling
        run: |
          set -euo pipefail
          check_p99() {
            local n=$1 c=$2
            [ "$n" -le "$c" ]
          }
          baseline="$GITHUB_WORKSPACE/.github/perf/tick-systems.txt"
          ticks=$(awk -F= '/^ticks=/{print $2}' "$baseline")
          test -n "$ticks"
          target/debug/oscraftd --addr 127.0.0.1:8092 --room ci-systems --ticks "$ticks" --tick-budget-us 20000 > tick-systems.log 2>&1
          cat tick-systems.log
          first=""
          fail=0
          while read -r name ceiling; do
            first=${first:-$name}
            us=$(grep "^ev=tick_time system=$name " tick-systems.log | tail -1 | sed 's/.* p99_us=\([0-9]*\) .*/\1/')
            test -n "$us"
            if check_p99 "$us" "$ceiling"; then
              echo "tick system $name us=$us ceiling=$ceiling ok"
            else
              echo "tick system $name us=$us ceiling=$ceiling FAIL"
              fail=1
            fi
          done < <(awk '/^system=/{split($1,a,"="); split($2,b,"="); print a[2], b[2]}' "$baseline")
          check_p99 "$(grep "^ev=tick_time system=$first " tick-systems.log | tail -1 | sed 's/.* p99_us=\([0-9]*\) .*/\1/')" 0 && { echo "self-check: a zero ceiling must fail"; exit 1; } || echo "self-check: a zero ceiling is refused ok"
          test "$fail" -eq 0

      - name: Arm one ticker panic, check one death and one restart, and a tick that advances
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/supervisor-restart"
          mkdir -p "$work"
          addr=127.0.0.1:8093
          log="$work/panic.log"
          target/debug/oscraftd --addr "$addr" --room ci --tick-budget-us 20000 --test-panic-tick 20 > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; echo "server log:"; tail -n 40 "$log" || true' EXIT
          for i in $(seq 1 60); do curl -s -o /dev/null "http://$addr/" && break; sleep 0.5; done
          for i in $(seq 1 60); do grep -q '^ev=ticker_restarted ' "$log" && break; sleep 0.5; done
          test "$(grep -c '^ev=ticker_died ' "$log")" -eq 1
          test "$(grep -c '^ev=ticker_restarted ' "$log")" -eq 1
          before=$(curl -sf "http://$addr/state" | jq -r .tick)
          after=$before
          for i in $(seq 1 8); do sleep 0.25; after=$(curl -sf "http://$addr/state" | jq -r .tick); [ "$after" -gt "$before" ] && break; done
          test "$after" -gt "$before"
          kill "$pid"; wait "$pid" 2>/dev/null || true; trap - EXIT
          grep '^ev=ticker_' "$log"
          quiet="$work/quiet.log"
          target/debug/oscraftd --addr 127.0.0.1:8092 --room ci --tick-budget-us 20000 --ticks 40 > "$quiet" 2>&1
          test "$(grep -c '^ev=ticker_died ' "$quiet")" -eq 0
          echo "supervisor ok died=1 restarted=1 tick $before -> $after; unarmed run died=0"

      - name: Hold the cap in idle sockets, check one more gets 503 and one conn_refused line, and /state answers on a held socket
        run: |
          set -euo pipefail
          cap=$(sed -n 's/^pub const MAX_CONNECTIONS: usize = \([0-9]*\);/\1/p' crates/server/src/lib.rs)
          test -n "$cap"
          work="$RUNNER_TEMP/connection-cap"
          mkdir -p "$work"
          port=8094
          log="$work/cap.log"
          target/debug/oscraftd --addr 127.0.0.1:$port --room ci --tick-budget-us 20000 > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; echo "server log:"; tail -n 20 "$log" || true' EXIT
          for i in $(seq 1 60); do curl -s -o /dev/null "http://127.0.0.1:$port/" && break; sleep 0.5; done
          for i in $(seq 1 $cap); do eval "exec $((i+9))<>/dev/tcp/127.0.0.1/$port"; done
          exec 80<>/dev/tcp/127.0.0.1/$port
          timeout 5 cat <&80 > "$work/refused.txt" || true
          head -n1 "$work/refused.txt" | grep -q ' 503 '
          printf 'GET /state HTTP/1.1\r\nHost: check\r\nConnection: close\r\n\r\n' >&10
          timeout 5 cat <&10 > "$work/state.txt" || true
          head -n1 "$work/state.txt" | grep -q ' 200 '
          grep -q '"tick"' "$work/state.txt"
          test "$(grep -c '^ev=conn_refused ' "$log")" -eq 1
          kill "$pid"; wait "$pid" 2>/dev/null || true; trap - EXIT
          grep '^ev=conn_refused ' "$log"
          echo "connection cap ok: cap=$cap, 503 on connection $((cap+1)), /state 200 on a held socket, one conn_refused"

      - name: Open 1000 idle connections, count 503s and conn_refused lines, and check the server thread count against cap plus 80
        run: |
          set -euo pipefail
          ulimit -n 4096 || true
          cap=$(sed -n 's/^pub const MAX_CONNECTIONS: usize = \([0-9]*\);/\1/p' crates/server/src/lib.rs)
          test -n "$cap"
          slack=80
          work="$RUNNER_TEMP/connection-cap-threads"
          mkdir -p "$work"
          port=8097
          log="$work/cap.log"
          target/debug/oscraftd --addr 127.0.0.1:$port --room ci --tick-budget-us 20000 > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; echo "server log:"; tail -n 20 "$log" || true' EXIT
          for i in $(seq 1 60); do curl -s -o /dev/null "http://127.0.0.1:$port/" && break; sleep 0.5; done
          python3 - "$pid" "$cap" "$slack" "$port" "$log" <<'PY'
          import selectors
          import socket
          import sys
          import time
          
          pid, cap, slack, port, log = int(sys.argv[1]), int(sys.argv[2]), int(sys.argv[3]), int(sys.argv[4]), sys.argv[5]
          conns = 1000
          ceiling = cap + slack
          
          socks = [socket.create_connection(("127.0.0.1", port), timeout=10) for _ in range(conns)]
          
          threads = None
          with open(f"/proc/{pid}/status") as status:
              for line in status:
                  if line.startswith("Threads:"):
                      threads = int(line.split()[1])
          assert threads is not None, "no Threads line in /proc/<pid>/status"
          
          sel = selectors.DefaultSelector()
          for s in socks:
              sel.register(s, selectors.EVENT_READ)
          refused = eof = 0
          # The server holds exactly cap sockets. Drain until only cap are still registered, under a
          # deadline: a quiet window ends the loop too early when a 503 is late.
          deadline = time.monotonic() + 30
          while len(sel.get_map()) > cap and time.monotonic() < deadline:
              events = sel.select(timeout=1.0)
              for key, _ in events:
                  sel.unregister(key.fileobj)
                  data = key.fileobj.recv(256)
                  if data.startswith(b"HTTP/1.1 503"):
                      refused += 1
                  elif not data:
                      eof += 1
          alive = len(sel.get_map())
          
          with open(log) as f:
              conn_lines = sum(1 for line in f if line.startswith("ev=conn_refused "))
          
          assert refused + eof + alive == conns, f"unclassified sockets: {conns - refused - eof - alive}"
          assert alive <= cap, f"{alive} connections held open above cap {cap}"
          assert refused > 0, "no connection past the cap got 503"
          assert conn_lines >= refused, f"ev=conn_refused lines {conn_lines} below 503 responses {refused}"
          assert threads <= ceiling, f"threads {threads} above ceiling {ceiling}"
          print(f"connection cap threads ok conns={conns} refused={refused} threads={threads} ceiling={ceiling}")
          PY
          kill "$pid"; wait "$pid" 2>/dev/null || true; trap - EXIT

      - name: Raise the cap past the 1000 sockets opened; the open-socket assert must fail
        run: |
          set -euo pipefail
          ulimit -n 4096 || true
          cap=$(sed -n 's/^pub const MAX_CONNECTIONS: usize = \([0-9]*\);/\1/p' crates/server/src/lib.rs)
          test -n "$cap"
          work="$RUNNER_TEMP/connection-cap-control"
          mkdir -p "$work"
          port=8098
          OSCRAFT_CONNECTION_CAP_OVERRIDE=4096 target/debug/oscraftd --addr 127.0.0.1:$port --room ci --tick-budget-us 20000 > "$work/cap.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; echo "server log:"; tail -n 20 "$work/cap.log" || true' EXIT
          for i in $(seq 1 60); do curl -s -o /dev/null "http://127.0.0.1:$port/" && break; sleep 0.5; done
          python3 -I - "$port" "$cap" <<'PY'
          import selectors
          import socket
          import sys

          port, cap = int(sys.argv[1]), int(sys.argv[2])
          conns = 1000
          socks = [socket.create_connection(("127.0.0.1", port), timeout=10) for _ in range(conns)]
          sel = selectors.DefaultSelector()
          for s in socks:
              sel.register(s, selectors.EVENT_READ)
          refused = eof = 0
          while True:
              events = sel.select(timeout=2.0)
              if not events:
                  break
              for key, _ in events:
                  sel.unregister(key.fileobj)
                  data = key.fileobj.recv(256)
                  if data.startswith(b"HTTP/1.1 503"):
                      refused += 1
                  elif not data:
                      eof += 1
          alive = len(sel.get_map())
          assert refused + eof + alive == conns, f"unclassified sockets: {conns - refused - eof - alive}"
          try:
              assert alive <= cap, f"{alive} connections held open above cap {cap}"
          except AssertionError:
              print(f"connection cap control ok breached={alive} expected_cap={cap}")
              sys.exit(0)
          sys.exit(f"open-socket assert passed with {alive} held open above cap {cap}; the assert cannot fail")
          PY
          kill "$pid"; wait "$pid" 2>/dev/null || true; trap - EXIT

      - name: Cap at 2 through the override, read each refused response with one recv of 12 bytes, assert the status line
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/connection-cap-status-line"
          mkdir -p "$work"
          port=8099
          log="$work/cap.log"
          OSCRAFT_CONNECTION_CAP_OVERRIDE=2 target/debug/oscraftd --addr 127.0.0.1:$port --room ci --tick-budget-us 20000 > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; echo "server log:"; tail -n 20 "$log" || true' EXIT
          for i in $(seq 1 60); do curl -s -o /dev/null "http://127.0.0.1:$port/" && break; sleep 0.5; done
          python3 -I - "$port" 2 <<'PY'
          import socket
          import sys
          import time

          port, cap, extra = int(sys.argv[1]), int(sys.argv[2]), 8
          status = b"HTTP/1.1 503"
          held = [socket.create_connection(("127.0.0.1", port), timeout=10) for _ in range(cap)]
          time.sleep(0.5)
          refused = complete = 0
          bad = []
          for _ in range(extra):
              s = socket.create_connection(("127.0.0.1", port), timeout=10)
              first = s.recv(12)
              if first:
                  refused += 1
              if first == status:
                  complete += 1
              else:
                  bad.append(first)
              while s.recv(4096):
                  pass
              s.close()
          for s in held:
              s.close()
          if bad or refused != extra:
              sys.exit(f"status line not complete on a refused response: refused={refused} complete={complete} first_reads={bad}")
          print(f"http status line ok refused={refused} complete={complete}")
          PY
          kill "$pid"; wait "$pid" 2>/dev/null || true; trap - EXIT
          grep '^ev=conn_refused ' "$log"

      - name: Start the server, post one client error, check one structured log line
        run: |
          target/debug/oscraftd --addr 127.0.0.1:8099 --room ci > server.log 2>&1 &
          pid=$!
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8099/ && break; sleep 1; done
          curl -sf -X POST "http://127.0.0.1:8099/client-error?map=ci&session=ci-session&message=ci%20probe"
          kill $pid
          test "$(grep -c '^ev=client_error session=' server.log)" -eq 1
          line=$(grep '^ev=client_error session=' server.log)
          echo "$line" | grep -q 'session=ci-session '
          echo "$line" | grep -Eq ' tick=[0-9]+ '
          echo "$line" | grep -q 'message="ci probe"'
          cat server.log

      - name: Flood the relay with 25 errors and check the rate limit drops the rest
        run: |
          set -euo pipefail
          target/debug/oscraftd --addr 127.0.0.1:8100 --room ci > ratelimit.log 2>&1 &
          pid=$!
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8100/ && break; sleep 1; done
          for i in $(seq 1 25); do
            curl -s -o /dev/null -X POST "http://127.0.0.1:8100/client-error?map=ci&session=flood&message=flood%20$i"
          done
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:8100/client-error?map=ci&session=flood&message=after%20flood")
            [ "$code" = 202 ] && break
            sleep 1
          done
          test "$code" = 202
          kill $pid
          cat ratelimit.log
          count=$(grep -c '^ev=client_error session=.*message="flood ' ratelimit.log || true)
          test "$count" -le 20
          test "$count" -eq 20
          grep -q '^ev=client_error session=.*message="after flood"' ratelimit.log
          grep -Eq '^ev=client_error_dropped session=flood count=([5-9]|[1-9][0-9]+)$' ratelimit.log

      - name: Post, restart, post again; both lines in the log and the drained bucket stays drained
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/client-errors.log"
          export OSCRAFT_CLIENT_ERROR_LOG="$log"
          head -c 1100000 /dev/zero | tr '\0' 'x' > "$log"
          start() {
            target/debug/oscraftd --addr 127.0.0.1:8101 --room ci > "$RUNNER_TEMP/durable-$1.out" 2>&1 &
            pid=$!
            for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8101/ && break; sleep 1; done
          }
          post() {
            curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:8101/client-error?map=ci&session=durable&message=$1"
          }
          start first
          test "$(post before%20restart)" = 202
          for i in $(seq 1 24); do post "drain%20$i" > /dev/null; done
          kill $pid; wait $pid || true
          test "$(stat -c %s "$log.1")" -ge 1048576
          start second
          test "$(post after%20restart)" = 429
          code=000
          for i in $(seq 1 60); do code=$(post "after%20restart"); [ "$code" = 202 ] && break; sleep 1; done
          test "$code" = 202
          kill $pid; wait $pid || true
          test "$(grep -c -E '^client-error session="durable" tick=[0-9]+ tokens=[0-9]+ message="before restart"$' "$log")" -eq 1
          test "$(grep -c -E '^client-error session="durable" tick=[0-9]+ tokens=[0-9]+ message="after restart"$' "$log")" -eq 1
          cat "$log"

  server-mod-and-data:
    name: "server mod, data and order probes"
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ci-build
          path: rust

      - name: Mark the prebuilt binaries executable
        working-directory: ${{ github.workspace }}
        run: find rust/target/debug -maxdepth 1 -type f -exec chmod +x {} +

      - name: Drive a mod edit cycle, a client error and an overrun; check every server line against the grammar
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/server-grammar"
          mkdir -p "$work"
          ./target/debug/osdt-data data "$work/catalog.osdt"
          mod="$work/mod.lua"
          printf '%s\n' 'function on_tick(state)' '  state.ticks = state.ticks + 1' '  state.probe = "v1"' 'end' > "$mod"
          addr=127.0.0.1:8096
          log="$work/mod.log"
          target/debug/oscraftd --addr "$addr" --room ci --data "$work/catalog.osdt" --mod "$mod" --tick-budget-us 20000 > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -sf "http://$addr/mod-version" | grep -q '"version":1' && break; sleep 0.5; done
          printf '%s\n' 'function on_tick(state)' '  state.ticks = state.ticks + 1' '  state.probe = "v2"' 'end' > "$mod"
          for i in $(seq 1 40); do grep -q '^ev=mod_tick tick=[0-9]* version=2 probe=v2' "$log" && break; sleep 0.25; done
          printf '%s\n' 'function on_tick(state' '  state.ticks = state.ticks + 1' 'end' > "$mod"
          for i in $(seq 1 40); do grep -q '^ev=mod_reload_failed ' "$log" && break; sleep 0.25; done
          printf '%s\n' 'function on_tick(state)' '  local x = nil' '  state.probe = x.field' 'end' > "$mod"
          for i in $(seq 1 40); do grep -q '^ev=mod_error ' "$log" && break; sleep 0.25; done
          curl -sf -X POST "http://$addr/client-error?session=grammar&message=grammar%20probe" > /dev/null
          for i in $(seq 1 40); do grep -q '^ev=client_error ' "$log" && break; sleep 0.25; done
          for i in $(seq 1 40); do grep -q '^ev=tick_time ' "$log" && break; sleep 0.25; done
          kill "$pid"; wait "$pid" 2>/dev/null || true; trap - EXIT
          over="$work/overrun.log"
          target/debug/oscraftd --addr 127.0.0.1:8095 --room ci --data "$work/catalog.osdt" --ticks 200 --tick-budget-us 1 > "$over" 2>&1
          cat "$log" "$over" > "$work/all.log"
          for ev in serving mod_loaded order_token mod_tick mod_reload_failed mod_error client_error tick_time tick_overrun; do
            grep -q "^ev=$ev " "$work/all.log" || { echo "FAIL: no $ev line"; exit 1; }
          done
          events=$(sed -n 's/^ *Ev::[A-Za-z]* => "\([a-z_]*\)".*/\1/p' crates/server/src/log.rs | sort -u)
          test -n "$events"
          lines=0
          unknown=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            lines=$((lines + 1))
            name=$(printf '%s\n' "$line" | sed -n 's/^ev=\([a-z_]*\).*/\1/p')
            if ! grep -qx -- "$name" <<<"$events" || ! grep -Eq '^ev=[a-z_]+( [a-z_0-9]+=([^" ]+|"([^"\\]|\\.)*"))*$' <<<"$line"; then
              unknown=$((unknown + 1))
              echo "unknown: $line"
            fi
          done < "$work/all.log"
          test "$lines" -ge 20
          test "$unknown" -eq 0
          echo "log grammar ok lines=$lines unknown=$unknown"

      - name: Post one order over TCP and read the change back through /delta and /state
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/order-state"
          mkdir -p "$work"
          ./target/debug/osdt-data data "$work/catalog.osdt"
          addr=127.0.0.1:8090
          log="$work/order.log"
          target/debug/oscraftd --addr "$addr" --room ci --data "$work/catalog.osdt" --ticks 100000000 --tick-budget-us 20000 > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; echo "server log:"; tail -n 40 "$log" || true' EXIT
          for i in $(seq 1 60); do curl -s -o /dev/null "http://$addr/" && break; sleep 0.5; done
          token=$(sed -n 's/^ev=order_token room=ci token=//p' "$log")
          test -n "$token"
          before=$(curl -sf "http://$addr/state")
          before_tick=$(jq -r .tick <<<"$before")
          before_hash=$(jq -r .state_hash <<<"$before")
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $token" "http://$addr/order?map=ci" --data '{"player":0,"x":1,"y":1}')
          test "$code" = 200
          unit=""
          for i in $(seq 1 120); do
            unit=$(curl -sf "http://$addr/delta?since=$before_tick" | jq -r '.units[0] // empty')
            test -n "$unit" && break
            sleep 0.25
          done
          test -n "$unit"
          after_hash=$(curl -sf "http://$addr/state" | jq -r .state_hash)
          test "$before_hash" != "$after_hash"
          echo "order-state ok unit=$unit before=$before_hash after=$after_hash"
          kill "$pid"; wait "$pid" 2>/dev/null || true
          trap - EXIT

      - name: Serve a copy of the data directory, add a unit with a .osd edit, then break the edit
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/data-reload"
          rm -rf "$work"
          mkdir -p "$work"
          cp data/*.osd "$work/"
          addr=127.0.0.1:18440
          log="$work/server.log"
          ./target/debug/oscraftd --addr "$addr" --room ci --data "$work" > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          catalog() { curl -sf "http://$addr/catalog?map=ci"; }
          for i in $(seq 1 60); do catalog >/dev/null 2>&1 && break; sleep 0.5; done
          catalog | jq -e '.loaded == true' >/dev/null
          catalog | jq -e '.units | any(. == "reloadprobe") | not' >/dev/null
          printf '%s\n' 'unit("reloadprobe", 50, 2000, 300, build_time=300, resource_a=50, capacity=1, filters=["ground", "light", "army"], sight_milli=8000)' > "$RUNNER_TEMP/reload_probe.osd" && mv "$RUNNER_TEMP/reload_probe.osd" "$work/reload_probe.osd"
          for i in $(seq 1 60); do grep -q '^ev=data_reloaded ' "$log" && break; sleep 0.5; done
          grep -q '^ev=data_reloaded room=ci ' "$log"
          for i in $(seq 1 20); do catalog | jq -e '.units | any(. == "reloadprobe")' >/dev/null 2>&1 && break; sleep 0.25; done
          catalog | jq -e '.units | any(. == "reloadprobe")' >/dev/null
          grep '^ev=data_reloaded ' "$log" | head -n 1
          printf '%s\n' 'unit("reloadprobe", 50,' > "$RUNNER_TEMP/reload_probe.osd" && mv "$RUNNER_TEMP/reload_probe.osd" "$work/reload_probe.osd"
          for i in $(seq 1 60); do grep -q '^ev=data_reload_failed ' "$log" && break; sleep 0.5; done
          grep -q '^ev=data_reload_failed room=ci ' "$log"
          catalog | jq -e '.units | any(. == "reloadprobe")' >/dev/null
          test "$(grep -c '^ev=data_reloaded ' "$log")" -eq 1
          kill -0 "$pid"
          grep '^ev=data_reload_failed ' "$log" | head -n 1
          echo "check: the served catalog gained reloadprobe after the edit with no restart; the broken edit logged data_reload_failed and reloadprobe stayed served"

      - name: Edit a mod; the version rises and the next tick logs the new value
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mod-hot-reload"
          mkdir -p "$work"
          ./target/debug/osdt-data data "$work/catalog.osdt"
          printf '%s\n' 'function on_tick(state)' '  state.ticks = state.ticks + 1' '  state.probe = "v1"' 'end' > "$work/mod.lua"
          addr=127.0.0.1:18431
          log="$work/server.log"
          ./target/debug/oscraftd --addr "$addr" --room test --data "$work/catalog.osdt" --mod "$work/mod.lua" > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          version() { curl -sf "http://$addr/mod-version" | jq -r .version; }
          for i in $(seq 1 60); do version >/dev/null 2>&1 && break; sleep 0.5; done
          test "$(version)" = 1
          for i in $(seq 1 40); do grep -q 'ev=mod_tick tick=[0-9]* version=1 probe=v1' "$log" && break; sleep 0.25; done
          grep -q 'ev=mod_tick tick=[0-9]* version=1 probe=v1' "$log"
          sleep 2
          printf '%s\n' 'function on_tick(state)' '  state.ticks = state.ticks + 1' '  state.probe = "v2"' 'end' > "$work/mod.lua"
          for i in $(seq 1 40); do [ "$(version)" = 2 ] && break; sleep 0.25; done
          test "$(version)" = 2
          test "$(curl -sf "http://$addr/mod-events?since=1" | jq -r .changed)" = true
          for i in $(seq 1 40); do grep -q 'ev=mod_tick tick=[0-9]* version=2 probe=v2' "$log" && break; sleep 0.25; done
          grep -E 'ev=mod_tick tick=[0-9]+ version=2 probe=v2' "$log"
          echo "check: GET /mod-version went 1 -> 2 after the edit; the next tick logged probe=v2"

      - name: Measure one mod reload, from writing the changed mod file to the new version on /mod-version and its tick
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/reload-latency"
          rm -rf "$work"
          mkdir -p "$work"
          ./target/debug/osdt-data data "$work/catalog.osdt"
          mod="$work/mod.lua"
          printf '%s\n' 'function on_tick(state)' '  state.ticks = state.ticks + 1' '  state.probe = "v1"' 'end' > "$mod"
          addr=127.0.0.1:18461
          log="$work/server.log"
          ./target/debug/oscraftd --addr "$addr" --room test --data "$work/catalog.osdt" --mod "$mod" > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          version() { curl -sf "http://$addr/mod-version" | jq -r .version; }
          for i in $(seq 1 60); do version >/dev/null 2>&1 && break; sleep 0.5; done
          test "$(version)" = 1
          for i in $(seq 1 40); do grep -q 'ev=mod_tick tick=[0-9]* version=1 probe=v1' "$log" && break; sleep 0.25; done
          grep -q 'ev=mod_tick tick=[0-9]* version=1 probe=v1' "$log"
          sleep 2
          start=$(date +%s%N)
          printf '%s\n' 'function on_tick(state)' '  state.ticks = state.ticks + 1' '  state.probe = "v2"' 'end' > "$mod"
          for i in $(seq 1 2400); do
            if [ "$(version)" = 2 ] && grep -q 'ev=mod_tick tick=[0-9]* version=2 probe=v2' "$log"; then break; fi
            sleep 0.01
          done
          end=$(date +%s%N)
          test "$(version)" = 2
          grep -q 'ev=mod_tick tick=[0-9]* version=2 probe=v2' "$log"
          ms=$(( (end - start) / 1000000 ))
          echo "reload latency ms=$ms"
          kill "$pid"; wait "$pid" 2>/dev/null || true; trap - EXIT
          ceiling=$(awk -F= '/^ceiling_ms=/{print $2}' "$GITHUB_WORKSPACE/.github/perf/reload-latency.txt")
          test -n "$ceiling"
          if [ "$ms" -le "$ceiling" ]; then
            echo "reload latency ms=$ms ceiling_ms=$ceiling ok"
          else
            echo "reload latency ms=$ms ceiling_ms=$ceiling FAIL: the mod reload is slower than its ceiling" >&2
            exit 1
          fi

      - name: Arm one mod-thread panic; check one death, one restart, and a version bump after an edit
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mod-thread-restart"
          rm -rf "$work"
          mkdir -p "$work"
          ./target/debug/osdt-data data "$work/catalog.osdt"
          printf '%s\n' 'function on_tick(state)' '  state.ticks = state.ticks + 1' '  state.probe = "v1"' 'end' > "$work/mod.lua"
          addr=127.0.0.1:18441
          log="$work/server.log"
          ./target/debug/oscraftd --addr "$addr" --room test --data "$work/catalog.osdt" --mod "$work/mod.lua" --test-panic-mod-tick 20 > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; echo "server log:"; tail -n 40 "$log" || true' EXIT
          version() { curl -sf "http://$addr/mod-version" | jq -r .version; }
          for i in $(seq 1 60); do version >/dev/null 2>&1 && break; sleep 0.5; done
          for i in $(seq 1 60); do grep -q '^ev=mod_thread_restarted ' "$log" && break; sleep 0.5; done
          died=$(grep -c '^ev=mod_thread_died ' "$log" || true)
          restarted=$(grep -c '^ev=mod_thread_restarted ' "$log" || true)
          test "$died" -eq 1
          test "$restarted" -eq 1
          before=$(version)
          sleep 2
          printf '%s\n' 'function on_tick(state)' '  state.ticks = state.ticks + 1' '  state.probe = "v2"' 'end' > "$work/mod.lua"
          for i in $(seq 1 40); do [ "$(version)" -gt "$before" ] && break; sleep 0.25; done
          after=$(version)
          test "$after" -gt "$before"
          for i in $(seq 1 40); do grep -q 'ev=mod_tick tick=[0-9]* version='"$after"' probe=v2' "$log" && break; sleep 0.25; done
          grep -q 'ev=mod_tick tick=[0-9]* version='"$after"' probe=v2' "$log"
          kill "$pid"; wait "$pid" 2>/dev/null || true; trap - EXIT
          grep '^ev=mod_thread_' "$log"
          echo "mod thread panic ok died=$died restarted=$restarted version_after=$after"

      - name: A mod spawns one unit on its first tick; the served room's unit count rises
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mod-spawn"
          mkdir -p "$work"
          trap 'echo "server log:"; tail -n 40 "$work/server.log" || true' ERR
          ./target/debug/osdt-data data "$work/catalog.osdt"
          printf '%s\n' 'function on_tick(state)' '  if state.spawned == nil then' '    game.cmd_spawn("skirmisher", 688128, 1343488)' '    state.spawned = 1' '  end' 'end' > "$work/mod.lua"
          units() { curl -sf "http://$1/state" | jq -r .units; }
          base=127.0.0.1:18435
          ./target/debug/oscraftd --addr "$base" --room test --data "$work/catalog.osdt" --tick-budget-us 250000 > "$work/baseline.log" 2>&1 &
          bpid=$!
          for i in $(seq 1 60); do units "$base" >/dev/null 2>&1 && break; sleep 0.5; done
          before=$(units "$base")
          kill $bpid 2>/dev/null || true
          wait $bpid 2>/dev/null || true
          addr=127.0.0.1:18433
          ./target/debug/oscraftd --addr "$addr" --room test --data "$work/catalog.osdt" --mod "$work/mod.lua" --tick-budget-us 250000 > "$work/server.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do units "$addr" >/dev/null 2>&1 && break; sleep 0.5; done
          for i in $(seq 1 40); do [ "$(units "$addr")" -gt "$before" ] && break; sleep 0.25; done
          after=$(units "$addr")
          echo "mod-spawn units before=$before after=$after"
          test "$after" -gt "$before"

      - name: A mod orders the handle it spawned; the room unit's x or y differs before and after the order, and an unmapped handle is refused
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mod-unit-map"
          mkdir -p "$work"
          trap 'echo "server log:"; tail -n 60 "$work/server.log" || true' ERR
          ./target/debug/osdt-data data "$work/catalog.osdt"
          cat > "$work/mod.lua" <<'LUA'
          function on_tick(state)
            state.age = (state.age or 0) + 1
            if state.h == nil then
              state.h = game.cmd_spawn("skirmisher", 688128, 1343488)
            elseif state.age == 20 then
              game.cmd_order_handle(state.h, 720896, 1343488)
              game.cmd_order_handle(999, 720896, 1343488)
            end
          end
          LUA
          addr=127.0.0.1:18434
          ./target/debug/oscraftd --addr "$addr" --room test --data "$work/catalog.osdt" --mod "$work/mod.lua" --tick-budget-us 250000 > "$work/server.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          state() { curl -sf "http://$addr/state"; }
          unit_at() { curl -sf "http://$addr/state?unit=$room" | jq -r '"\(.unit.x) \(.unit.y)"'; }
          num() { [[ "$1" =~ ^-?[0-9]+$ ]]; }
          for i in $(seq 1 60); do state >/dev/null 2>&1 && break; sleep 0.5; done
          for i in $(seq 1 80); do grep -q 'ev=mod_unit_bound ' "$work/server.log" && break; sleep 0.25; done
          bound=$(grep -o 'ev=mod_unit_bound handle=[0-9]* unit=[0-9]*' "$work/server.log" | head -n 1)
          h=$(echo "$bound" | sed 's/.*handle=\([0-9]*\).*/\1/')
          room=$(echo "$bound" | sed 's/.*unit=//')
          read -r from_x from_y <<<"$(unit_at)"
          num "$from_x" && num "$from_y"
          grep -q 'ev=mod_unit_refused handle=999 ' "$work/server.log" && { echo "from read landed after the order"; exit 1; }
          for i in $(seq 1 120); do grep -q 'ev=mod_unit_refused handle=999 ' "$work/server.log" && break; sleep 0.25; done
          refused=$(grep 'ev=mod_unit_refused handle=999 reason=unmapped' "$work/server.log" | head -n 1)
          echo "$refused"
          test -n "$refused"
          for i in $(seq 1 120); do read -r to_x to_y <<<"$(unit_at)"; num "$to_x" && num "$to_y" && [ "$to_x,$to_y" != "$from_x,$from_y" ] && break; sleep 0.25; done
          num "$to_x" && num "$to_y"
          echo "mod-unit-map ok handle=$h room=$room from_x=$from_x from_y=$from_y to_x=$to_x to_y=$to_y"
          test "$from_x,$from_y" != "$to_x,$to_y"

      - name: Start oscraftd with --mod and a directory --data, edit a .osd file, read the probe
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mod-image"
          mkdir -p "$work/data"
          cp -r data/. "$work/data/"
          printf '%s\n' 'function on_tick(state)' '  state.ticks = state.ticks + 1' '  state.probe = tostring(ability_info("pulse_shot").cooldown)' 'end' > "$work/mod.lua"
          addr=127.0.0.1:18432
          log="$work/server.log"
          ./target/debug/oscraftd --addr "$addr" --room test --data "$work/data" --mod "$work/mod.lua" > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do curl -sf "http://$addr/mod-version" >/dev/null 2>&1 && break; sleep 0.5; done
          for i in $(seq 1 40); do grep -q 'ev=mod_tick tick=[0-9]* version=1 probe=24' "$log" && break; sleep 0.25; done
          before=$(grep -o 'ev=mod_tick tick=[0-9]* version=[0-9]* probe=[0-9]*' "$log" | tail -1 | sed 's/.*probe=//')
          test "$before" = 24
          sed -i 's/ability("pulse_shot", 24, /ability("pulse_shot", 31, /' "$work/data/abilities.osd"
          grep -q 'ability("pulse_shot", 31, ' "$work/data/abilities.osd"
          for i in $(seq 1 120); do grep -q '^ev=mod_image_reloaded ' "$log" && break; sleep 0.25; done
          grep -q '^ev=mod_image_reloaded ' "$log"
          for i in $(seq 1 40); do grep -q 'probe=31' "$log" && break; sleep 0.25; done
          after=$(grep -o 'ev=mod_tick tick=[0-9]* version=[0-9]* probe=[0-9]*' "$log" | tail -1 | sed 's/.*probe=//')
          test "$after" = 31
          echo "mod image follows data reload ok value_before=$before value_after=$after"

      - name: Spawn a unit through a mod, reload the data without the map's last unit, and order the same handle
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/handle-reload"
          rm -rf "$work"
          mkdir -p "$work"
          cp -r data "$work/data"
          cat > "$work/mod.lua" <<'LUA'
          -- Spawns one skirmisher on tick 1, then orders its handle to one of two points every 40 ticks.
          function on_tick(state)
            state.ticks = (state.ticks or 0) + 1
            if state.ticks == 1 then
              state.handle = game.cmd_spawn("skirmisher", 3 * 65536, 3 * 65536)
            elseif state.handle then
              local x = ((state.ticks // 40) % 2 == 0) and 4 or 8
              game.cmd_order_handle(state.handle, x * 65536, 4 * 65536)
            end
          end
          LUA
          addr=127.0.0.1:18441
          log="$work/server.log"
          ./target/debug/oscraftd --addr "$addr" --room handle --data "$work/data" --mod "$work/mod.lua" > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          wait_for() {
            for i in $(seq 1 $(( ${2:-60} * 4 ))); do
              grep -q "$1" "$log" && return 0
              kill -0 "$pid" 2>/dev/null || { cat "$log"; echo "server exited before: $1"; exit 1; }
              sleep 0.25
            done
            cat "$log"
            echo "timed out waiting for: $1"
            exit 1
          }
          num() { [[ "$1" =~ ^-?[0-9]+$ ]] || { echo "unit state not numeric: $1"; cat "$log"; exit 1; }; }
          unit_at() { curl -sf "http://$addr/state?unit=$unit" | jq -r '"\(.unit.x) \(.unit.y)"'; }
          wait_for 'ev=mod_unit_bound'
          bound=$(grep -o 'ev=mod_unit_bound handle=[0-9]* unit=[0-9]*' "$log" | head -n 1)
          handle=$(echo "$bound" | sed 's/.*handle=\([0-9]*\).*/\1/')
          unit=$(echo "$bound" | sed 's/.*unit=//')
          [[ -n "$handle" && -n "$unit" ]] || { echo "no mod unit bound"; cat "$log"; exit 1; }
          # The gunship is the last unit the map places; dropping it leaves the mod unit's index unplaced.
          sed -i '/spawn("gunship"/d' "$work/data/map.osd"
          wait_for 'ev=data_reloaded'
          read -r x0 y0 <<<"$(unit_at)"
          num "$x0"; num "$y0"
          sleep 6
          read -r x1 y1 <<<"$(unit_at)"
          num "$x1"; num "$y1"
          if grep -q 'ev=mod_unit_refused.*reason=unmapped' "$log"; then
            cat "$log"
            echo "mod handle $handle was refused as unmapped after the reload"
            exit 1
          fi
          if [[ "$x0 $y0" == "$x1 $y1" ]]; then
            cat "$log"
            echo "unit $unit did not move after the reload: $x1 $y1"
            exit 1
          fi
          echo "mod handle survives reload ok handle=$handle moved=true"

      - name: Mod walkthrough - a data file defines a new unit kind through the data hot path, a mod spawns it through the mod hot path, and /state shows the kind name
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mod-walkthrough"
          rm -rf "$work"
          mkdir -p "$work/data"
          cp data/*.osd "$work/data/"
          mod="$work/mod.lua"
          printf '%s\n' 'function on_tick(state)' '  state.ticks = (state.ticks or 0) + 1' 'end' > "$mod"
          addr=127.0.0.1:18471
          log="$work/server.log"
          ./target/debug/oscraftd --addr "$addr" --room walk --data "$work/data" --mod "$mod" > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          catalog() { curl -sf "http://$addr/catalog?map=walk"; }
          state() { curl -sf "http://$addr/state"; }
          version() { curl -sf "http://$addr/mod-version" | jq -r .version; }
          for i in $(seq 1 60); do catalog >/dev/null 2>&1 && break; sleep 0.5; done
          catalog | jq -e '.loaded == true' >/dev/null
          catalog | jq -e '.units | any(. == "modprobe_unit") | not' >/dev/null
          printf '%s\n' 'unit("modprobe_unit", 50, 2000, 300, build_time=300, resource_a=50, capacity=1, filters=["ground", "light", "army"], sight_milli=8000)' > "$RUNNER_TEMP/modprobe_unit.osd" && mv "$RUNNER_TEMP/modprobe_unit.osd" "$work/data/modprobe_unit.osd"
          for i in $(seq 1 60); do grep -q '^ev=mod_image_reloaded ' "$log" && break; sleep 0.5; done
          grep -q '^ev=mod_image_reloaded ' "$log"
          for i in $(seq 1 20); do catalog | jq -e '.units | any(. == "modprobe_unit")' >/dev/null 2>&1 && break; sleep 0.25; done
          catalog | jq -e '.units | any(. == "modprobe_unit")' >/dev/null
          kind=$(catalog | jq -r '.units | index("modprobe_unit")')
          before=$(version)
          printf '%s\n' 'function on_tick(state)' '  if state.spawned == nil then' '    state.spawned = game.cmd_spawn("modprobe_unit", 688128, 1343488)' '  end' '  state.ticks = (state.ticks or 0) + 1' 'end' > "$mod"
          for i in $(seq 1 60); do [ "$(version)" -gt "$before" ] && break; sleep 0.25; done
          test "$(version)" -gt "$before"
          for i in $(seq 1 60); do state | jq -e --argjson k "$kind" '[.records[] | select(.kind == $k)] | length >= 1' >/dev/null 2>&1 && break; sleep 0.25; done
          state | jq -e --argjson k "$kind" '[.records[] | select(.kind == $k)] | length >= 1' >/dev/null
          name=$(catalog | jq -r --argjson k "$kind" '.units[$k]')
          test "$name" = modprobe_unit
          echo "mod walkthrough ok kind=$name"
          kill "$pid"; wait "$pid" 2>/dev/null || true; trap - EXIT

  server-kinds-and-protocol:
    name: "server unit kinds, carry, protocol and log schema probes"
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ci-build
          path: rust

      - name: Mark the prebuilt binaries executable
        working-directory: ${{ github.workspace }}
        run: find rust/target/debug -maxdepth 1 -type f -exec chmod +x {} +

      - name: Add a unit kind from data alone, spawn it on the map, and check the served room
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/data-kind"
          rm -rf "$work"
          mkdir -p "$work"
          cp -r data "$work/base"
          cp -r data "$work/data"
          cat >> "$work/data/units.osd" <<'STAR'
          unit("zephyr", 45, 3150, 375, build_time=480, resource_a=50, capacity=1, abilities=[], filters=["ground", "light", "army"], weapon_damage=6, weapon_range_milli=5000, weapon_period=24, sight_milli=9000, resource="resource_a")
          STAR
          echo 'spawn("zephyr", 0, 22000, 18000)' >> "$work/data/map.osd"
          base_addr=127.0.0.1:18442
          kind_addr=127.0.0.1:18443
          ./target/debug/oscraftd --addr "$base_addr" --room base --data "$work/base" > "$work/base.log" 2>&1 &
          base_pid=$!
          ./target/debug/oscraftd --addr "$kind_addr" --room kind --data "$work/data" > "$work/kind.log" 2>&1 &
          kind_pid=$!
          trap 'kill $base_pid $kind_pid 2>/dev/null || true' EXIT
          up() {
            for i in $(seq 1 120); do
              curl -sf "http://$1/state" > /dev/null && return 0
              sleep 0.25
            done
            echo "server $1 did not answer /state"
            cat "$work/kind.log"
            exit 1
          }
          up "$base_addr"
          up "$kind_addr"
          base_units=$(curl -sf "http://$base_addr/state" | jq -r '.units')
          kind_units=$(curl -sf "http://$kind_addr/state" | jq -r '.units')
          listed=$(curl -sf "http://$kind_addr/catalog" | jq -r '.units | index("zephyr") != null')
          if [[ "$listed" != "true" ]]; then
            echo "zephyr is not in /catalog"
            cat "$work/kind.log"
            exit 1
          fi
          if [[ $(( kind_units - base_units )) -ne 1 ]]; then
            echo "units base=$base_units with-zephyr=$kind_units: the data-spawned zephyr was not counted"
            cat "$work/kind.log"
            exit 1
          fi
          echo "data-only kind ok kind=zephyr spawned=true"

      - name: Spawn a skirmisher through a mod, reload a map that puts a tender at the same index, and check the handle is dropped with one kind_changed line
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/handle-kind-change"
          rm -rf "$work"
          mkdir -p "$work"
          cp -r data "$work/data"
          cat > "$work/mod.lua" <<'LUA'
          -- Spawns one skirmisher on tick 1, then orders its handle to one of two points every 40 ticks.
          function on_tick(state)
            state.ticks = (state.ticks or 0) + 1
            if state.ticks == 1 then
              state.handle = game.cmd_spawn("skirmisher", 3 * 65536, 3 * 65536)
            elseif state.handle then
              local x = ((state.ticks // 40) % 2 == 0) and 4 or 8
              game.cmd_order_handle(state.handle, x * 65536, 4 * 65536)
            end
          end
          LUA
          addr=127.0.0.1:18445
          log="$work/server.log"
          ./target/debug/oscraftd --addr "$addr" --room kindchange --data "$work/data" --mod "$work/mod.lua" > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          wait_for() {
            for i in $(seq 1 $(( ${2:-60} * 4 ))); do
              grep -q "$1" "$log" && return 0
              kill -0 "$pid" 2>/dev/null || { cat "$log"; echo "server exited before: $1"; exit 1; }
              sleep 0.25
            done
            cat "$log"
            echo "timed out waiting for: $1"
            exit 1
          }
          wait_for 'ev=mod_unit_bound'
          bound=$(grep -o 'ev=mod_unit_bound handle=[0-9]* unit=[0-9]*' "$log" | head -n 1)
          handle=$(echo "$bound" | sed 's/.*handle=\([0-9]*\).*/\1/')
          unit=$(echo "$bound" | sed 's/.*unit=//')
          [[ -n "$handle" && -n "$unit" ]] || { echo "no mod unit bound"; cat "$log"; exit 1; }
          # The map places units 0 to 7, so the mod's skirmisher holds index 8. Appending a tender places a different kind at that index.
          printf '\nspawn("tender", 0, 2500, 21500)\n' >> "$work/data/map.osd"
          wait_for 'ev=data_reloaded'
          expect="ev=mod_unit_refused handle=$handle unit=$unit reason=kind_changed"
          if [[ "$(grep -cF "$expect" "$log")" -ne 1 ]]; then
            cat "$log"
            echo "expected exactly one line: $expect"
            exit 1
          fi
          kill "$pid"; wait "$pid" 2>/dev/null || true; trap - EXIT
          echo "mod handle dropped on kind change ok handle=$handle unit=$unit reason=kind_changed"

      - name: Rename the gunship kind in the catalog and map under a running match; the carry drop is printed and the unit count falls by exactly that many
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/carry-drop"
          rm -rf "$work"
          mkdir -p "$work"
          cp data/*.osd "$work/"
          addr=127.0.0.1:18446
          log="$work/server.log"
          ./target/debug/oscraftd --addr "$addr" --room drop --data "$work" > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          state() { curl -sf "http://$addr/state"; }
          for i in $(seq 1 60); do state >/dev/null 2>&1 && break; sleep 0.5; done
          before=$(state | jq -r .units)
          test "$before" -gt 0
          sed -i 's/"gunship"/"gunship_renamed"/g' "$work"/*.osd
          for i in $(seq 1 60); do grep -q '^ev=data_reloaded room=drop ' "$log" && break; sleep 0.5; done
          grep -q '^ev=data_reloaded room=drop ' "$log"
          line=$(grep '^ev=data_reloaded room=drop ' "$log" | head -n 1)
          dropped=$(sed -n 's/.* refused=\([0-9]*\).*/\1/p' <<<"$line")
          test -n "$dropped"
          test "$dropped" -ge 1
          after=$(state | jq -r .units)
          test "$after" -eq $(( before - dropped ))
          kill "$pid"; wait "$pid" 2>/dev/null || true; trap - EXIT
          echo "carry drop exercised dropped=$dropped before=$before after=$after"

      - name: Edit a unit's cost under a running match; the live units keep their ids and positions and none is duplicated
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/match-carried"
          rm -rf "$work"
          mkdir -p "$work"
          cp data/*.osd "$work/"
          addr=127.0.0.1:18442
          log="$work/server.log"
          ./target/debug/oscraftd --addr "$addr" --room ci --data "$work" > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          state() { curl -sf "http://$addr/state"; }
          dump() { for i in $(seq 0 $(( $1 - 1 ))); do curl -sf "http://$addr/state?unit=$i" | jq -r '"\(.id) \(.x) \(.y)"'; done; }
          for i in $(seq 1 60); do state >/dev/null 2>&1 && break; sleep 0.5; done
          before=$(state | jq -r .units)
          test "$before" -gt 0
          dump "$before" | sort > "$work/pre.txt"
          test "$(wc -l < "$work/pre.txt")" -eq "$before"
          sed -i '/^unit("skirmisher"/s/resource_a=50/resource_a=75/' "$work/units.osd"
          grep -q '^unit("skirmisher".*resource_a=75' "$work/units.osd"
          for i in $(seq 1 60); do grep -q '^ev=data_reloaded room=ci ' "$log" && break; sleep 0.5; done
          grep -q '^ev=data_reloaded room=ci ' "$log"
          after=$(state | jq -r .units)
          dump "$before" | sort > "$work/post.txt"
          kept=$(comm -12 "$work/pre.txt" "$work/post.txt" | wc -l)
          test "$after" -le "$before" || { echo "units_after=$after exceeds units_before=$before"; exit 1; }
          test "$after" -eq "$before"
          test "$kept" -eq "$before"
          kill "$pid"; wait "$pid" 2>/dev/null || true; trap - EXIT
          grep '^ev=data_reloaded ' "$log" | head -n 1
          echo "match carried units_before=$before units_after=$after positions_kept=$kept"

      - name: Swap the first two unit kinds in the catalog under a running match; carried units keep their kind name and the dropped count is printed
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/carry-kind-match"
          rm -rf "$work"
          mkdir -p "$work"
          cp data/*.osd "$work/"
          addr=127.0.0.1:18444
          log="$work/server.log"
          ./target/debug/oscraftd --addr "$addr" --room ci --data "$work" > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          state() { curl -sf "http://$addr/state"; }
          for i in $(seq 1 60); do state >/dev/null 2>&1 && break; sleep 0.5; done
          before=$(state | jq -r .units)
          test "$before" -gt 0
          first=$(grep -n '^unit(' "$work/units.osd" | sed -n 1p | cut -d: -f1)
          second=$(grep -n '^unit(' "$work/units.osd" | sed -n 2p | cut -d: -f1)
          a=$(sed -n "${first}p" "$work/units.osd")
          b=$(sed -n "${second}p" "$work/units.osd")
          { head -n $((first - 1)) "$work/units.osd"; printf '%s\n' "$b"; sed -n "$((first + 1)),$((second - 1))p" "$work/units.osd"; printf '%s\n' "$a"; tail -n +$((second + 1)) "$work/units.osd"; } > "$work/units.swap"
          mv "$work/units.swap" "$work/units.osd"
          for i in $(seq 1 60); do grep -q '^ev=data_reloaded room=ci ' "$log" && break; sleep 0.5; done
          grep -q '^ev=data_reloaded room=ci ' "$log"
          line=$(grep '^ev=data_reloaded room=ci ' "$log" | head -n 1)
          kept=$(sed -n 's/.* carried=\([0-9]*\).*/\1/p' <<<"$line")
          dropped=$(sed -n 's/.* refused=\([0-9]*\).*/\1/p' <<<"$line")
          test -n "$kept" && test -n "$dropped"
          test $(( kept + dropped )) -eq "$before"
          test "$kept" -eq "$before"
          test "$dropped" -eq 0
          kill "$pid"; wait "$pid" 2>/dev/null || true; trap - EXIT
          echo "carry kind match ok kept=$kept dropped=$dropped"

      - name: Snapshot at tick t, order, advance, then /delta since t applied to the snapshot matches a fresh /state at the same tick
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/late-join"
          rm -rf "$work"
          mkdir -p "$work"
          cp data/*.osd "$work/"
          addr=127.0.0.1:18447
          log="$work/server.log"
          target/debug/oscraftd --addr "$addr" --room ci --data "$work" --ticks 100000000 --tick-budget-us 20000 > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; echo "server log:"; tail -n 40 "$log" || true' EXIT
          state() { curl -sf "http://$addr/state"; }
          for i in $(seq 1 60); do state >/dev/null 2>&1 && break; sleep 0.5; done
          wait_tick() {
            for i in $(seq 1 240); do
              now=$(state | jq -r .tick)
              test "$now" -ge "$1" && return 0
              sleep 0.1
            done
            return 1
          }
          token=$(sed -n 's/^ev=order_token room=ci token=//p' "$log")
          test -n "$token"
          wait_tick 8
          snap=$(state)
          t=$(jq -r .tick <<<"$snap")
          test "$(jq -r '.records | length' <<<"$snap")" = "$(jq -r .units <<<"$snap")"
          test "$(jq -r .units <<<"$snap")" -gt 0
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $token" "http://$addr/order?map=ci" --data '{"player":0,"x":5,"y":5}')
          test "$code" = 200
          wait_tick $((t + 8))
          ok=""
          for i in $(seq 1 50); do
            delta=$(curl -sf "http://$addr/delta?since=$t")
            D=$(jq -r .tick <<<"$delta")
            fresh=$(state)
            if [ "$(jq -r .tick <<<"$fresh")" = "$D" ]; then ok=1; break; fi
            sleep 0.05
          done
          test -n "$ok"
          test "$(jq -r '.records | length' <<<"$delta")" = "$(jq -r .changed <<<"$delta")"
          test "$(jq -r '.records | length' <<<"$fresh")" = "$(jq -r .units <<<"$fresh")"
          applied=$(jq -c -n --argjson s "$snap" --argjson d "$delta" '
            ($d.records | map(select(.alive == false) | .id)) as $dead
            | ([$s.records[] | select(.id as $i | $dead | contains([$i]) | not)]
               + [$d.records[] | select(.alive == true) | del(.alive)])
            | group_by(.id) | map(last) | map({id,x,y,hp}) | sort_by(.id)')
          fresh_set=$(jq -c '[.records[] | {id,x,y,hp}] | sort_by(.id)' <<<"$fresh")
          if [ "$applied" != "$fresh_set" ]; then
            echo "late join mismatch tick=$D"
            echo "applied=$applied"
            echo "fresh=$fresh_set"
            exit 1
          fi
          n=$(jq -r .units <<<"$fresh")
          echo "late join ok ticks=$t units=$n"
          kill "$pid"; wait "$pid" 2>/dev/null || true
          trap - EXIT

      - name: Read /state, /delta and order replies and check proto equals PROTOCOL_VERSION
        run: |
          set -euo pipefail
          want=$(sed -n 's/^pub const PROTOCOL_VERSION: u32 = \([0-9]*\);$/\1/p' crates/server/src/http.rs)
          test -n "$want"
          work="$RUNNER_TEMP/protocol"
          mkdir -p "$work"
          ./target/debug/osdt-data data "$work/catalog.osdt"
          addr=127.0.0.1:8091
          log="$work/protocol.log"
          target/debug/oscraftd --addr "$addr" --room ci --data "$work/catalog.osdt" --ticks 100000000 --tick-budget-us 20000 > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; echo "server log:"; tail -n 40 "$log" || true' EXIT
          for i in $(seq 1 60); do curl -s -o /dev/null "http://$addr/" && break; sleep 0.5; done
          token=$(sed -n 's/^ev=order_token room=ci token=//p' "$log")
          test -n "$token"
          check() {
            if ! jq -e --argjson want "$want" '.proto == $want' <<<"$2" >/dev/null; then
              echo "proto mismatch in $1: $2"; exit 1
            fi
            echo "proto ok reply=$1 proto=$want"
          }
          state=$(curl -sf "http://$addr/state")
          check state "$state"
          tick=$(jq -r .tick <<<"$state")
          delta=$(curl -sf "http://$addr/delta?since=$tick")
          check delta "$delta"
          code=$(curl -s -o "$work/order.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $token" "http://$addr/order?map=ci" --data '{"player":0,"x":1,"y":1}')
          test "$code" = 200
          check order "$(cat "$work/order.json")"
          code=$(curl -s -o "$work/refused.json" -w '%{http_code}' "http://$addr/state?proto=$((want + 1))")
          test "$code" = 409
          jq -e '.error == "protocol_mismatch"' "$work/refused.json" >/dev/null
          echo "proto refusal reply=state status=$code error=protocol_mismatch"
          code=$(curl -s -o "$work/refused-delta.json" -w '%{http_code}' "http://$addr/delta?since=$tick&proto=$((want + 1))")
          test "$code" = 409
          jq -e '.error == "protocol_mismatch"' "$work/refused-delta.json" >/dev/null
          echo "protocol refusal ok reply=delta status=$code"
          code=$(curl -s -o "$work/refused-order.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $token" "http://$addr/order?map=ci&proto=$((want + 1))" --data '{"player":0,"x":1,"y":1}')
          test "$code" = 409
          jq -e '.error == "protocol_mismatch"' "$work/refused-order.json" >/dev/null
          echo "protocol refusal ok reply=order status=$code"
          echo "protocol-version ok constant=$want replies=state,delta,order"
          kill "$pid"; wait "$pid" 2>/dev/null || true
          trap - EXIT

      - name: Drive the server, then check every log line against docs/LOG_SCHEMA.md
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/log-schema"
          mkdir -p "$work"
          ./target/debug/osdt-data data "$work/catalog.osdt"
          mod="$work/mod.lua"
          printf '%s\n' 'function on_tick(state)' '  state.ticks = state.ticks + 1' '  state.probe = "v1"' 'end' > "$mod"
          addr=127.0.0.1:8103
          log="$work/mod.log"
          target/debug/oscraftd --addr "$addr" --room ci --data "$work/catalog.osdt" --mod "$mod" --tick-budget-us 20000 > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -sf "http://$addr/mod-version" | grep -q '"version":1' && break; sleep 0.5; done
          printf '%s\n' 'function on_tick(state)' '  state.ticks = state.ticks + 1' '  state.probe = "v2"' 'end' > "$mod"
          for i in $(seq 1 40); do grep -q '^ev=mod_tick tick=[0-9]* version=2 probe=v2' "$log" && break; sleep 0.25; done
          printf '%s\n' 'function on_tick(state' '  state.ticks = state.ticks + 1' 'end' > "$mod"
          for i in $(seq 1 40); do grep -q '^ev=mod_reload_failed ' "$log" && break; sleep 0.25; done
          printf '%s\n' 'function on_tick(state)' '  local x = nil' '  state.probe = x.field' 'end' > "$mod"
          for i in $(seq 1 40); do grep -q '^ev=mod_error ' "$log" && break; sleep 0.25; done
          curl -sf -X POST "http://$addr/client-error?session=schema&message=schema%20probe" > /dev/null
          for i in $(seq 1 40); do grep -q '^ev=client_error ' "$log" && break; sleep 0.25; done
          for i in $(seq 1 40); do grep -q '^ev=tick_time ' "$log" && break; sleep 0.25; done
          kill "$pid"; wait "$pid" 2>/dev/null || true; trap - EXIT
          over="$work/overrun.log"
          target/debug/oscraftd --addr 127.0.0.1:8104 --room ci --data "$work/catalog.osdt" --ticks 200 --tick-budget-us 1 > "$over" 2>&1
          cat "$log" "$over" > "$work/all.log"
          python3 -I - "$work/all.log" ../docs/LOG_SCHEMA.md crates/server/src/log.rs <<'PY'
          import re
          import sys

          log_path, doc_path, rust_path = sys.argv[1], sys.argv[2], sys.argv[3]
          enum_names = re.findall(r'Ev::[A-Za-z]+ => "([a-z_]+)"', open(rust_path).read())
          if len(enum_names) != len(set(enum_names)):
              sys.exit("log.rs names an event twice")
          rows = {}
          row = re.compile(r'^\| `([a-z_]+)` \| [A-Za-z]+ \| [a-z_.]+ \| ([^|]*?) \| (required|optional) \|$')
          for text in open(doc_path):
              m = row.match(text.rstrip("\n"))
              if m:
                  name, fields, sample = m.groups()
                  keys = [] if fields.strip() == "-" else [f.strip() for f in fields.split(",")]
                  rows[name] = (set(keys), sample)
          if set(enum_names) != set(rows):
              sys.exit(f"documented and log.rs differ: only_in_log={sorted(set(enum_names) - set(rows))} only_in_doc={sorted(set(rows) - set(enum_names))}")
          line_re = re.compile(r'^ev=([a-z_]+)((?: [a-z_0-9]+=(?:"(?:[^"\\]|\\.)*"|[^ "]+))*)$')
          key_re = re.compile(r' ([a-z_0-9]+)=(?:"(?:[^"\\]|\\.)*"|[^ "]+)')
          seen, lines = set(), 0
          for text in open(log_path):
              text = text.rstrip("\n")
              if not text:
                  continue
              lines += 1
              m = line_re.match(text)
              if not m or m.group(1) not in rows:
                  sys.exit(f"unparsed or undocumented line: {text}")
              name = m.group(1)
              keys = set(key_re.findall(m.group(2)))
              if not keys <= rows[name][0]:
                  sys.exit(f"undocumented field in {name}: {sorted(keys - rows[name][0])} in {text}")
              seen.add(name)
          missing = sorted(n for n, (_, s) in rows.items() if s == "required" and n not in seen)
          if missing:
              sys.exit(f"required events missing from the run: {missing}")
          print(f"log schema ok events={len(set(enum_names))} documented={len(rows)} lines={lines} seen={len(seen)}")
          PY

  browser-probes:
    name: "browser page probes - map, reconnect, self-reload and rejected edit"
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ci-build
          path: rust

      - name: Mark the prebuilt binaries executable
        working-directory: ${{ github.workspace }}
        run: find rust/target/debug -maxdepth 1 -type f -exec chmod +x {} +

      - name: Install headless Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: Stage the page wasm and maps this run built into js/client, which the static server serves
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf js/client/pkg
          cp -r rust/crates/web/site/pkg js/client/pkg
          cp rust/crates/web/site/map.bin js/client/map.bin
          cp rust/crates/web/site/moba.bin js/client/moba.bin
          ls -la js/client/pkg js/client/map.bin js/client/moba.bin

      - name: Render the committed map through the browser Game and check the witness
        run: |
          target/debug/oscraftd --addr 127.0.0.1:8000 --room ci --site crates/web/site > "$RUNNER_TEMP/http.log" 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8000/ && break; sleep 1; done
          "$GITHUB_WORKSPACE/rust/target/debug/oscraft-relay" 7447 > "$RUNNER_TEMP/relay.log" 2>&1 &
          python3 -m http.server 8093 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/js/client" > "$RUNNER_TEMP/static.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8093/play.html > /dev/null && break; sleep 1; done
          cat > "$RUNNER_TEMP/pw/check.mjs" <<'EOF'
          import { chromium } from "playwright";
          import { createRequire } from "module";
          const require = createRequire(import.meta.url);
          const browser = await chromium.launch({ args: ["--use-angle=swiftshader", "--enable-unsafe-swiftshader"] });
          const page = await browser.newPage({ viewport: { width: 1024, height: 768 } });
          const errors = [];
          page.on("pageerror", (e) => errors.push(String(e)));
          page.on("console", (m) => { if (m.type() === "error") errors.push(m.text()); });
          const failed = [];
          page.on("requestfailed", (r) => failed.push("failed " + r.url() + " " + r.failure()?.errorText));
          page.on("response", (r) => { if (r.status() >= 400) failed.push(r.status() + " " + r.url()); });
          page.on("requestfinished", (r) => { if (r.url().includes("pkg/")) failed.push("ok " + r.url()); });
          const diagnose = (why) => {
            console.log("DIAGNOSTICS: " + why);
            console.log("page errors: " + JSON.stringify(errors));
            console.log("requests: " + JSON.stringify(failed));
            console.log("http.log:\n" + require("fs").readFileSync(process.env.RUNNER_TEMP + "/http.log", "utf8"));
          };
          await page.goto("http://127.0.0.1:8093/play.html?relay=ws://127.0.0.1:7447&ns=oscraft-ci#map");
          try {
            await page.waitForSelector("body[data-ready='1'], body[data-error]", { timeout: 60000 });
          } catch (e) {
            diagnose("the page never reached ready or error");
            throw e;
          }
          const error = await page.getAttribute("body", "data-error");
          if (error) throw new Error("page error: " + error);
          const units = Number(await page.getAttribute("body", "data-units"));
          const ticks = Number(await page.getAttribute("body", "data-ticks"));
          if (!(await page.$("canvas"))) throw new Error("no canvas on the page");
          if (!(ticks > 0)) throw new Error("the sim did not tick: " + ticks);
          if (!(units > 0)) throw new Error("no units were drawn");
          const center = await page.getAttribute("body", "data-center");
          if (!center || center === "0,0,0" || center === "29,37,44") throw new Error("the map centre is blank: " + center);
          if (errors.length) throw new Error("console errors: " + errors.join("\n") + " requests: " + JSON.stringify(failed));
          await page.screenshot({ path: process.env.RUNNER_TEMP + "/pw/map.png" });
          console.log(`map witness ok ticks=${ticks} units=${units} center=${center} source=js/client/map.bin`);
          await browser.close();
          EOF
          node "$RUNNER_TEMP/pw/check.mjs" | tee "$RUNNER_TEMP/map-witness.txt"
          grep -q '^map witness ok ticks=[1-9][0-9]* units=[1-9][0-9]* center=[0-9.]*,[0-9.]* source=js/client/map.bin$' "$RUNNER_TEMP/map-witness.txt"
          test "$(curl -s --path-as-is -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8000/site/../Cargo.toml')" = 404
          curl -sf -X POST "http://127.0.0.1:8000/client-error?session=ci-browser&message=ci%20browser%20probe"
          test "$(grep -c '^ev=client_error session=' "$RUNNER_TEMP/http.log")" -eq 1
          grep '^ev=client_error session=' "$RUNNER_TEMP/http.log" | grep -q 'session=ci-browser '
          grep '^ev=client_error session=' "$RUNNER_TEMP/http.log" | grep -q 'message="ci browser probe"'

      - name: Left click selects a unit, right click orders it to move; the sim accepts the order
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pw/moba-input.mjs" <<'EOF'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ args: ["--use-angle=swiftshader", "--enable-unsafe-swiftshader"] });
          const page = await browser.newPage({ viewport: { width: 1024, height: 768 } });
          const errors = [];
          page.on("pageerror", (e) => errors.push(String(e)));
          page.on("console", (m) => { if (m.type() === "error") errors.push(m.text()); });
          await page.goto("http://127.0.0.1:8093/play.html?relay=ws://127.0.0.1:7447&ns=oscraft-ci&ci=1#moba");
          await page.waitForSelector("body[data-ready='1'], body[data-error]", { timeout: 60000 });
          const error = await page.getAttribute("body", "data-error");
          if (error) throw new Error("page error: " + error);
          const units = await page.evaluate(() => window.__ciUnits());
          if (!units.length) throw new Error("no units to order");
          const [cx, cz] = (await page.getAttribute("body", "data-center")).split(",").map(Number);
          const toScreen = (x, z) => ({ x: 512 + (x - cx) * 20, y: 384 + (z - cz) * 20 });
          // The camera moves with the arrow keys and zoom changes the scale, so the mapping is read again for each click.
          const screenAt = async (x, z) => {
            const [ccx, ccz] = (await page.getAttribute("body", "data-center")).split(",").map(Number);
            const ppu = 20 * Number(await page.getAttribute("body", "data-zoom"));
            return { x: 512 + (x - ccx) * ppu, y: 384 + (z - ccz) * ppu };
          };
          // Click the unit with the most room around it, so the pick cannot land on a neighbour.
          const unit = units.reduce((best, cand) => {
            const gap = Math.min(...units.filter((v) => v !== cand).map((v) => (v.x - cand.x) ** 2 + (v.z - cand.z) ** 2));
            return gap > best.gap ? { unit: cand, gap } : best;
          }, { unit: units[0], gap: -1 }).unit;
          const at = toScreen(unit.x, unit.z);
          await page.mouse.click(at.x, at.y, { button: "left" });
          const selected = await page.evaluate(() => window.__ciSelected());
          if (selected !== unit.id) throw new Error("left click selected " + selected + ", expected " + unit.id);
          const target = toScreen(Math.min(29, unit.x + 3), unit.z);
          await page.mouse.click(target.x, target.y, { button: "right" });
          await page.waitForSelector("body[data-orders='1']", { timeout: 15000 });
          const orders = await page.getAttribute("body", "data-orders");
          if (errors.length) throw new Error("console errors: " + errors.join("\n"));
          const before = (await page.getAttribute("body", "data-center")).split(",").map(Number)[0];
          await page.keyboard.down("ArrowRight");
          await page.waitForTimeout(500);
          await page.keyboard.up("ArrowRight");
          const after = (await page.getAttribute("body", "data-center")).split(",").map(Number)[0];
          if (!(after > before)) throw new Error("arrow right did not pan: " + before + " -> " + after);
          console.log(`moba camera ok pan=${(after - before).toFixed(2)}`);
          const zoomBefore = Number(await page.getAttribute("body", "data-zoom"));
          await page.mouse.move(512, 384);
          await page.mouse.wheel(0, -300);
          await page.waitForFunction((z) => Number(document.body.dataset.zoom) > z, zoomBefore, { timeout: 5000 });
          const zoomAfter = Number(await page.getAttribute("body", "data-zoom"));
          console.log(`moba zoom ok zoom=${zoomBefore.toFixed(3)}->${zoomAfter.toFixed(3)}`);
          const hp = Number(await page.getAttribute("body", "data-hp"));
          const gold = Number(await page.getAttribute("body", "data-gold"));
          if (!(hp > 0) || !(gold >= 0)) throw new Error("hud reads hp=" + hp + " gold=" + gold);
          console.log(`moba hud ok hp=${hp} gold=${gold}`);
          const dots = Number(await page.getAttribute("body", "data-minimap"));
          const drawnUnits = (await page.evaluate(() => window.__ciUnits())).length;
          if (!(dots > 0) || dots !== drawnUnits) throw new Error("minimap draws " + dots + " dots for " + drawnUnits + " units");
          console.log(`moba minimap ok dots=${dots}`);
          // Not every unit can cast or attack: try the most isolated units until one does both.
          const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.z - b.z) ** 2;
          const ranked = [...units].sort((a, b) => Math.min(...units.filter((v) => v !== b).map((v) => dist2(v, b))) - Math.min(...units.filter((v) => v !== a).map((v) => dist2(v, a))));
          let attacker = null;
          for (const cand of ranked.reverse().slice(0, 60)) {
            // Select through the CI hook: a click can land on another unit drawn over this one.
            await page.evaluate((id) => window.__ciSelect(id), cand.id);
            const foe = units.filter((v) => v.player !== cand.player).sort((a, b) => dist2(a, cand) - dist2(b, cand))[0];
            if (!foe) continue;
            const fp = await screenAt(foe.x, foe.z);
            // Hover the enemy so the cast aims at it: unit-target abilities need a unit under the pointer.
            await page.mouse.move(fp.x, fp.y);
            await page.keyboard.press("q");
            await page.waitForTimeout(150);
            const casts = Number(await page.getAttribute("body", "data-casts"));
            if (casts < 1) { console.log(`probe cast cand=${cand.id} foe=${foe.id} casts=${casts} at=${fp.x.toFixed(0)},${fp.y.toFixed(0)}`); continue; }
            await page.keyboard.press("a");
            await page.mouse.click(fp.x, fp.y, { button: "left" });
            await page.waitForTimeout(150);
            const attacks = Number(await page.getAttribute("body", "data-attacks"));
            console.log(`probe attack cand=${cand.id} foe=${foe.id} attacks=${attacks}`);
            if (attacks >= 1) { attacker = cand; break; }
          }
          if (!attacker) throw new Error("no unit both cast and attacked");
          const counts = await page.evaluate(() => ({ casts: document.body.dataset.casts, attacks: document.body.dataset.attacks }));
          console.log(`moba input ok orders=${orders} casts=${counts.casts} attacks=${counts.attacks}`);
          await page.evaluate(() => window.__ciKillSide(1));
          await page.waitForFunction(() => Number(document.body.dataset.winner) >= 0, null, { timeout: 15000 });
          const shown = await page.evaluate(() => { const w = document.getElementById("win"); return !w.hidden && w.textContent; });
          if (!shown || !shown.includes("side 0 wins")) throw new Error("win screen shows " + shown);
          console.log(`moba win screen ok winner=0`);
          await browser.close();
          EOF
          node "$RUNNER_TEMP/pw/moba-input.mjs" | tee "$RUNNER_TEMP/moba-input.txt"
          grep -q '^moba input ok orders=[1-9][0-9]* casts=[1-9][0-9]* attacks=[1-9][0-9]*$' "$RUNNER_TEMP/moba-input.txt"
          grep -q '^moba hud ok hp=[1-9][0-9]* gold=[0-9]*$' "$RUNNER_TEMP/moba-input.txt"
          grep -q '^moba minimap ok dots=[1-9][0-9]*$' "$RUNNER_TEMP/moba-input.txt"
          grep -q '^moba win screen ok winner=0$' "$RUNNER_TEMP/moba-input.txt"
          grep -q '^moba camera ok pan=[0-9.]*$' "$RUNNER_TEMP/moba-input.txt"
          grep -q '^moba zoom ok zoom=[0-9.]*->[0-9.]*$' "$RUNNER_TEMP/moba-input.txt"

      - name: Edit the mod under a running page; its data-mod-version follows
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mod-client"
          mkdir -p "$work"
          ./target/debug/osdt-data data "$work/catalog.osdt"
          mod="$work/mod.lua"
          printf '%s\n' 'function on_tick(state)' '  state.ticks = state.ticks + 1' '  state.probe = "v1"' 'end' > "$mod"
          target/debug/oscraftd --addr 127.0.0.1:8001 --room ci-client --data "$work/catalog.osdt" --mod "$mod" --site crates/web/site > "$work/server.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8001/mod-version | grep -q '"version":1' && break; sleep 1; done
          curl -sf http://127.0.0.1:8001/mod-version | grep -q '"version":1'
          cat > "$RUNNER_TEMP/pw/mod.mjs" <<'EOF'
          import { chromium } from "playwright";
          import { writeFileSync } from "fs";
          const modPath = process.argv[2];
          const browser = await chromium.launch({ args: ["--use-angle=swiftshader", "--enable-unsafe-swiftshader"] });
          const page = await browser.newPage({ viewport: { width: 1024, height: 768 } });
          const errors = [];
          page.on("pageerror", (e) => errors.push(String(e)));
          await page.goto("http://127.0.0.1:8001/site/");
          await page.waitForSelector("body[data-ready='1'], body[data-error]", { timeout: 60000 });
          const error = await page.getAttribute("body", "data-error");
          if (error) throw new Error("page error: " + error);
          await page.waitForSelector("body[data-mod-version='1']", { timeout: 15000 });
          const before = "1";
          writeFileSync(modPath, 'function on_tick(state)\n  state.ticks = state.ticks + 1\n  state.probe = "v2"\nend\n');
          let seen = before;
          const deadline = Date.now() + 15000;
          while (Date.now() < deadline) {
            seen = await page.getAttribute("body", "data-mod-version");
            if (seen === "2") break;
            await page.waitForTimeout(250);
          }
          if (seen !== "2") throw new Error("data-mod-version stayed at " + seen + " after the mod edit");
          writeFileSync(modPath, 'function on_tick(state\n  state.ticks = state.ticks + 1\nend\n');
          const brokenUntil = Date.now() + 5000;
          while (Date.now() < brokenUntil) {
            const kept = await page.getAttribute("body", "data-mod-version");
            if (kept !== "2") throw new Error("data-mod-version moved to " + kept + " after a broken mod edit");
            await page.waitForTimeout(250);
          }
          if (!(await page.$("canvas"))) throw new Error("no canvas after a broken mod edit");
          console.log("check: broken mod edit kept data-mod-version at 2 for 5 s and the canvas is still present");
          if (errors.length) throw new Error("page errors: " + errors.join("\n"));
          console.log("check: data-mod-version went " + before + " -> " + seen + " in the browser after the mod edit");
          await browser.close();
          EOF
          node "$RUNNER_TEMP/pw/mod.mjs" "$mod"
          for i in $(seq 1 10); do grep -q '^ev=mod_reload_failed ' "$work/server.log" && break; sleep 1; done
          grep -q '^ev=mod_reload_failed ' "$work/server.log"
          echo "check: server rejected the broken mod and kept the previous version"

      - name: Reject five reloads in the browser; one stop line, data-mod-version holds
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mod-reject"
          mkdir -p "$work"
          ./target/debug/osdt-data data "$work/catalog.osdt"
          mod="$work/mod.lua"
          printf '%s\n' 'function on_tick(state)' '  state.ticks = state.ticks + 1' 'end' > "$mod"
          target/debug/oscraftd --addr 127.0.0.1:8002 --room ci-reject --data "$work/catalog.osdt" --mod "$mod" --site crates/web/site > "$work/server.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8002/mod-version | grep -q '"version":1' && break; sleep 1; done
          curl -sf http://127.0.0.1:8002/mod-version | grep -q '"version":1'
          cat > "$RUNNER_TEMP/pw/reject.mjs" <<'EOF'
          import { chromium } from "playwright";
          import { writeFileSync } from "fs";
          const modPath = process.argv[2];
          const browser = await chromium.launch({ args: ["--use-angle=swiftshader", "--enable-unsafe-swiftshader"] });
          const page = await browser.newPage({ viewport: { width: 1024, height: 768 } });
          const errors = [];
          const stops = [];
          const applies = [];
          page.on("pageerror", (e) => errors.push(String(e)));
          page.on("console", (m) => {
            if (m.type() !== "error") return;
            if (m.text().startsWith("mod watch stopped")) stops.push(m.text());
            else errors.push(m.text());
          });
          page.on("request", (r) => { if (r.url().includes("map.bin?v=2")) applies.push(r.url()); });
          await page.goto("http://127.0.0.1:8002/site/?rejectReloads=5");
          await page.waitForSelector("body[data-ready='1'], body[data-error]", { timeout: 60000 });
          const error = await page.getAttribute("body", "data-error");
          if (error) throw new Error("page error: " + error);
          await page.waitForSelector("body[data-mod-version='1']", { timeout: 15000 });
          writeFileSync(modPath, 'function on_tick(state)\n  state.ticks = state.ticks + 1\n  state.probe = "v2"\nend\n');
          const deadline = Date.now() + 30000;
          while (stops.length === 0 && Date.now() < deadline) await page.waitForTimeout(250);
          await page.waitForTimeout(4000);
          if (stops.length !== 1) throw new Error("expected one stop line, saw " + stops.length + ": " + JSON.stringify(stops));
          if (!stops[0].includes("after 5 rejected reloads")) throw new Error("stop line names the wrong count: " + stops[0]);
          if (applies.length !== 5) throw new Error("expected 5 applies of map.bin?v=2, saw " + applies.length);
          const kept = await page.getAttribute("body", "data-mod-version");
          if (kept !== "1") throw new Error("data-mod-version moved to " + kept + " after rejected reloads");
          if (!(await page.$("canvas"))) throw new Error("no canvas after rejected reloads");
          if (errors.length) throw new Error("page errors: " + errors.join("\n"));
          console.log("check: five rejected reloads logged one stop line; data-mod-version held at " + kept + "; canvas present");
          await browser.close();
          EOF
          node "$RUNNER_TEMP/pw/reject.mjs" "$mod"

      - name: Upload the page screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-screenshot
          path: ${{ runner.temp }}/pw/map.png
          if-no-files-found: ignore

      - name: Uncaught page error and rejected promise each reach the server log once
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/client-probe"
          mkdir -p "$work"
          target/debug/oscraftd --addr 127.0.0.1:8003 --room ci-probe --site crates/web/site > "$work/http.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8003/ && break; sleep 1; done
          cat > "$RUNNER_TEMP/pw/probe.mjs" <<'EOF'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ args: ["--use-angle=swiftshader", "--enable-unsafe-swiftshader"] });
          const page = await browser.newPage({ viewport: { width: 1024, height: 768 } });
          await page.goto("http://127.0.0.1:8003/site/?probeErrors=1");
          await page.waitForSelector("body[data-ready='1'], body[data-error]", { timeout: 60000 });
          await page.waitForTimeout(3000);
          await browser.close();
          EOF
          node "$RUNNER_TEMP/pw/probe.mjs"
          for i in $(seq 1 20); do [ "$(grep -c '^ev=client_error ' "$work/http.log")" -ge 2 ] && break; sleep 0.5; done
          test "$(grep -c '^ev=client_error ' "$work/http.log")" -eq 2
          test "$(grep -c '^ev=client_error .*message="window.error: ' "$work/http.log")" -eq 1
          test "$(grep -c '^ev=client_error .*message="unhandledrejection: ' "$work/http.log")" -eq 1
          echo "check: one ev=client_error line for the uncaught page error and one for the rejected promise"

      - name: Browser load and frame p99 against the stored ceiling
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/perf-probe"
          mkdir -p "$work"
          target/debug/oscraftd --addr 127.0.0.1:8004 --room ci-perf --site crates/web/site > "$work/http.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8004/ && break; sleep 1; done
          cat > "$RUNNER_TEMP/pw/perf.mjs" <<'EOF'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ args: ["--use-angle=swiftshader", "--enable-unsafe-swiftshader"] });
          const page = await browser.newPage({ viewport: { width: 1024, height: 768 } });
          await page.goto("http://127.0.0.1:8004/site/");
          await page.waitForSelector("body[data-ready='1'], body[data-error]", { timeout: 60000 });
          await page.waitForTimeout(3000);
          const error = await page.getAttribute("body", "data-error");
          if (error) throw new Error("page error: " + error);
          const load = await page.getAttribute("body", "data-load-ms");
          const p99 = await page.getAttribute("body", "data-frame-p99-ms");
          console.log(`browser load ms=${load} frame_p99_ms=${p99}`);
          await browser.close();
          EOF
          node "$RUNNER_TEMP/pw/perf.mjs" | tee "$work/perf.txt"
          baseline="$GITHUB_WORKSPACE/.github/perf/browser-baseline.txt"
          ceiling=$(awk -F= '/^load_ms_ceiling=/{print $2}' "$baseline")
          test -n "$ceiling"
          if [ "$ceiling" = "unmeasured" ]; then
            echo "SKIP browser load ceiling is unmeasured in $baseline: set load_ms_ceiling from one measured run"
            exit 0
          fi
          check_load() {
            local n=$1 c=$2
            if [ "$n" -le "$c" ]; then
              echo "browser load ms=$n ceiling=$c ok"
            else
              echo "browser load ms=$n ceiling=$c FAIL"
              return 1
            fi
          }
          load=$(sed -n 's/^browser load ms=\([0-9]*\) .*/\1/p' "$work/perf.txt")
          test -n "$load"
          check_load "$load" 0 >/dev/null && { echo "self-check: a zero ceiling must fail"; exit 1; } || echo "self-check: a zero ceiling is refused ok"
          check_load "$load" "$ceiling"

      - name: Over-ceiling witness; a test-only ceiling below the measured load must fail
        env:
          BROWSER_LOAD_CEILING_OVERRIDE_MS: "1"
        run: |
          set -uo pipefail
          work="$RUNNER_TEMP/perf-probe"
          load=$(sed -n 's/^browser load ms=\([0-9]*\) .*/\1/p' "$work/perf.txt")
          test -n "$load"
          ceiling="$BROWSER_LOAD_CEILING_OVERRIDE_MS"
          check_load() {
            local n=$1 c=$2
            if [ "$n" -le "$c" ]; then
              echo "browser load ms=$n ceiling=$c ok"
            else
              echo "browser load ms=$n ceiling=$c FAIL"
              return 1
            fi
          }
          out=$(check_load "$load" "$ceiling") && rc=0 || rc=$?
          echo "$out"
          test "$rc" -ne 0 || { echo "witness: the override ceiling did not fail the measured load"; exit 1; }
          echo "$out" | tail -1 | grep -q ' FAIL$' || { echo "witness: FAIL line missing"; exit 1; }
          echo "browser over-ceiling witnessed load=$load ceiling=$ceiling exit=$rc"

      - name: Install headless Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: Restart oscraftd under an open page; the watch resumes at the new version
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/reconnect"
          mkdir -p "$work"
          ./target/debug/osdt-data data "$work/catalog.osdt"
          mod="$work/mod.lua"
          printf '%s\n' 'function on_tick(state)' '  state.ticks = state.ticks + 1' 'end' > "$mod"
          cat > "$RUNNER_TEMP/pw/reconnect.mjs" <<'EOF'
          import { chromium } from "playwright";
          import { spawn } from "child_process";
          import { openSync, readFileSync, writeFileSync } from "fs";
          const [bin, catalog, modPath, log, addr] = process.argv.slice(2);
          const base = "http://" + addr;
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const start = () => spawn(bin, ["--addr", addr, "--room", "ci-reconnect", "--data", catalog, "--mod", modPath, "--site", "crates/web/site"], { stdio: ["ignore", openSync(log, "a"), openSync(log, "a")] });
          const version = async () => (await (await fetch(base + "/mod-version", { cache: "no-store" })).json()).version;
          async function waitFor(fn, what, ms) {
            const end = Date.now() + ms;
            for (;;) {
              try { if (await fn()) return; } catch {}
              if (Date.now() > end) throw new Error("timed out: " + what);
              await sleep(250);
            }
          }
          const stop = (p) => new Promise((r) => { p.once("exit", r); p.kill(); });
          let server = start();
          await waitFor(async () => (await version()) === 1, "server up at version 1", 60000);
          const browser = await chromium.launch({ args: ["--use-angle=swiftshader", "--enable-unsafe-swiftshader"] });
          const page = await browser.newPage({ viewport: { width: 1024, height: 768 } });
          const errors = [];
          page.on("pageerror", (e) => errors.push(String(e)));
          await page.goto(base + "/site/");
          await page.waitForSelector("body[data-ready='1'], body[data-error]", { timeout: 60000 });
          const pageError = await page.getAttribute("body", "data-error");
          if (pageError) throw new Error("page error: " + pageError);
          await page.waitForSelector("body[data-mod-version='1']", { timeout: 15000 });
          await page.evaluate(() => { window.__sameDocument = "yes"; });
          writeFileSync(modPath, 'function on_tick(state)\n  state.ticks = state.ticks + 1\n  state.probe = "v2"\nend\n');
          await page.waitForSelector("body[data-mod-version='2']", { timeout: 15000 });
          server = await stop(server);
          await sleep(3000);
          server = start();
          await waitFor(async () => (await version()) === 1, "restarted server at version 1", 60000);
          await page.waitForSelector("body[data-mod-version='1']", { timeout: 30000 });
          const versionAfter = await page.getAttribute("body", "data-mod-version");
          if (await page.evaluate(() => window.__sameDocument) !== "yes") throw new Error("page reloaded instead of resuming");
          writeFileSync(modPath, 'function on_tick(state)\n  state.ticks = state.ticks + 1\n  state.probe = "v3"\nend\n');
          await page.waitForSelector("body[data-mod-version='2']", { timeout: 15000 });
          if (errors.length) throw new Error("page errors: " + errors.join("\n"));
          console.log("browser reconnect ok version_after=" + versionAfter);
          const lines = readFileSync(log, "utf8").split("\n").filter((l) => l.startsWith("ev=client_error ") && l.includes('message="reconnect'));
          if (lines.length !== 1) throw new Error("expected one reconnect log line, found " + lines.length);
          await browser.close();
          server = await stop(server);
          EOF
          node "$RUNNER_TEMP/pw/reconnect.mjs" "$PWD/target/debug/oscraftd" "$work/catalog.osdt" "$mod" "$work/server.log" 127.0.0.1:8006

      - name: Install headless Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: Serve a job-owned copy of the site, edit its main.js, and watch the page reload itself
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/self-reload"
          mkdir -p "$work"
          cp -r crates/web/site "$work/site"
          cat > "$RUNNER_TEMP/pw/self-reload.mjs" <<'JS'
          import { chromium } from "playwright";
          import { spawn } from "child_process";
          import { openSync, readFileSync, writeFileSync } from "fs";
          const [bin, site, addr, log] = process.argv.slice(2);
          const base = "http://" + addr;
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const server = spawn(bin, ["--addr", addr, "--room", "ci-self-reload", "--site", site], { stdio: ["ignore", openSync(log, "a"), openSync(log, "a")] });
          const stamp = async () => (await (await fetch(base + "/site/version", { cache: "no-store" })).json()).page;
          async function until(what, fn, ms) {
            const end = Date.now() + ms;
            for (;;) {
              try { const v = await fn(); if (v) return v; } catch {}
              if (Date.now() > end) throw new Error("timed out: " + what);
              await sleep(250);
            }
          }
          await until("server answers /site/version", stamp, 60000);
          const browser = await chromium.launch({ args: ["--use-angle=swiftshader", "--enable-unsafe-swiftshader"] });
          const page = await browser.newPage({ viewport: { width: 1024, height: 768 } });
          const errors = [];
          page.on("pageerror", (e) => errors.push(String(e)));
          await page.goto(base + "/site/");
          await page.waitForSelector("body[data-ready='1'], body[data-error]", { timeout: 60000 });
          const pageError = await page.getAttribute("body", "data-error");
          if (pageError) throw new Error("page error: " + pageError);
          const before = await until("page stamp", () => page.getAttribute("body", "data-page-version"), 15000);
          await page.evaluate(() => { window.__sameDocument = "yes"; });
          const file = site + "/main.js";
          writeFileSync(file, readFileSync(file, "utf8") + `\n// ci self-reload edit ${Date.now()}\n`);
          const after = await until("page reloads with a new stamp", async () => {
            const v = await page.getAttribute("body", "data-page-version");
            return v && v !== before ? v : null;
          }, 30000);
          if (await page.evaluate(() => window.__sameDocument) !== undefined) throw new Error("page kept its document; no reload happened");
          if (server.exitCode !== null) throw new Error("server exited during the reload");
          await page.waitForSelector("body[data-ready='1']", { timeout: 60000 });
          await sleep(3000);
          if (await page.getAttribute("body", "data-page-version") !== after) throw new Error("page reloaded more than once");
          if (errors.length) throw new Error("page errors: " + errors.join("\n"));
          console.log("browser self-reload ok page_version=" + after);
          await browser.close();
          server.kill();
          JS
          node "$RUNNER_TEMP/pw/self-reload.mjs" "$PWD/target/debug/oscraftd" "$work/site" 127.0.0.1:8008 "$work/server.log"

      - name: Install headless Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: Serve a job-owned copy of the site, break its main.js, and check the page rejects the edit
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/edit-rejected"
          mkdir -p "$work"
          cp -r crates/web/site "$work/site"
          cat > "$RUNNER_TEMP/pw/edit-rejected.mjs" <<'JS'
          import { chromium } from "playwright";
          import { spawn } from "child_process";
          import { openSync, readFileSync, writeFileSync } from "fs";
          const [bin, site, addr, log] = process.argv.slice(2);
          const base = "http://" + addr;
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const server = spawn(bin, ["--addr", addr, "--room", "ci-edit-rejected", "--site", site], { stdio: ["ignore", openSync(log, "a"), openSync(log, "a")] });
          const stamp = async () => (await (await fetch(base + "/site/version", { cache: "no-store" })).json()).page;
          async function until(what, fn, ms) {
            const end = Date.now() + ms;
            for (;;) {
              try { const v = await fn(); if (v) return v; } catch {}
              if (Date.now() > end) throw new Error("timed out: " + what);
              await sleep(250);
            }
          }
          const rejectLines = () => readFileSync(log, "utf8").split("\n").filter((l) => l.startsWith("ev=client_error ") && l.includes('message="page edit rejected: '));
          await until("server answers /site/version", stamp, 60000);
          const browser = await chromium.launch({ args: ["--use-angle=swiftshader", "--enable-unsafe-swiftshader"] });
          const page = await browser.newPage({ viewport: { width: 1024, height: 768 } });
          const errors = [];
          page.on("pageerror", (e) => errors.push(String(e)));
          await page.goto(base + "/site/");
          await page.waitForSelector("body[data-ready='1'], body[data-error]", { timeout: 60000 });
          const pageError = await page.getAttribute("body", "data-error");
          if (pageError) throw new Error("page error: " + pageError);
          const before = await until("page stamp", () => page.getAttribute("body", "data-page-version"), 15000);
          await page.evaluate(() => { window.__sameDocument = "yes"; });
          const file = site + "/main.js";
          const good = readFileSync(file, "utf8");
          writeFileSync(file, good + "\nfunction ci_broken( {\n");
          await until("server stamps the broken main.js", async () => (await stamp()) !== before, 15000);
          await until("server relays the rejection to the log", async () => rejectLines().length >= 1, 30000);
          await sleep(4000);
          if (await page.getAttribute("body", "data-page-version") !== before) throw new Error("page moved to a new stamp on a broken main.js");
          if (await page.evaluate(() => window.__sameDocument) !== "yes") throw new Error("page reloaded on a broken main.js");
          if (rejectLines().length !== 1) throw new Error("expected one client_error line, got " + rejectLines().length + ": " + rejectLines().join("\n"));
          if (server.exitCode !== null) throw new Error("server exited during the rejected edit");
          writeFileSync(file, good + `\n// ci edit rejected restore ${Date.now()}\n`);
          const after = await until("page reloads after the good edit", async () => {
            const v = await page.getAttribute("body", "data-page-version");
            return v && v !== before ? v : null;
          }, 30000);
          if (await page.evaluate(() => window.__sameDocument) !== undefined) throw new Error("page kept its document after the good edit; no reload happened");
          await page.waitForSelector("body[data-ready='1']", { timeout: 60000 });
          await sleep(3000);
          if (await page.getAttribute("body", "data-page-version") !== after) throw new Error("page reloaded more than once");
          if (rejectLines().length !== 1) throw new Error("client_error line count changed after the fix: " + rejectLines().length);
          if (errors.length) throw new Error("page errors: " + errors.join("\n"));
          console.log("browser broken edit rejected page_version=" + before + " reloaded_after_fix=true");
          await browser.close();
          server.kill();
          JS
          node "$RUNNER_TEMP/pw/edit-rejected.mjs" "$PWD/target/debug/oscraftd" "$work/site" 127.0.0.1:8009 "$work/server.log"

  static-probes:
    name: "static checks: client modules, host usage, protocol docs, names and ICE config"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: play.html loads committed modules through an import map
        run: |
          set -euo pipefail
          grep -q 'type="module" src="play.js"' js/client/play.html
          if grep -q 'dist/' js/client/play.html; then echo "play.html still references a dist bundle"; exit 1; fi
          grep -q '"wireweave": "https://' js/client/play.html
          count=0
          for f in js/client/*.js js/wire/frame.js js/wire/test.js; do node --check "$f"; count=$((count + 1)); done
          cmp js/wire/frame.js js/client/wire/frame.js
          echo "client modules ok files=$count"

      - name: 100 ticks of 200 units at 1 percent change, full and delta state bytes
        env:
          WIRE_JS: ${{ github.workspace }}/js/wire/frame.js
          DELTA_JS: ${{ github.workspace }}/js/client/delta.js
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { pathToFileURL } from 'node:url';
          const { encodeFrame, decodeFrame, FRAME } = await import(pathToFileURL(process.env.WIRE_JS).href);
          const { createStateEncoder, applyFrame } = await import(pathToFileURL(process.env.DELTA_JS).href);
          const fail = (why) => { console.error(`state delta FAIL ${why}`); process.exit(1); };

          const units = Array.from({ length: 200 }, (_, id) => ({ id, kind: id % 5, player: id % 2, x: id * 2, y: 3, hp: 100 }));
          const encoder = createStateEncoder();
          const receiver = new Map();
          let full = null;
          const deltaSizes = [];
          for (let tick = 1; tick <= 100; tick++) {
            // Two of 200 units (1 percent) step each tick; the other 198 hold still.
            for (const id of [tick % 200, (tick + 97) % 200]) units[id] = { ...units[id], x: units[id].x + 1 };
            const frame = encoder.encode(tick, (tick * 2654435761) >>> 0, units);
            const bytes = encodeFrame(frame);
            if (frame.type === FRAME.STATE) { if (full === null) full = bytes.length; } else deltaSizes.push(bytes.length);
            applyFrame(receiver, decodeFrame(bytes));
            const got = [...receiver.values()].sort((a, b) => a.id - b.id);
            if (JSON.stringify(got) !== JSON.stringify(units)) fail(`receiver diverged at tick ${tick}`);
          }
          const deltaAvg = deltaSizes.reduce((a, b) => a + b, 0) / deltaSizes.length;
          const ratio = deltaAvg / full;
          if (!(ratio <= 0.2)) fail(`delta_avg ${deltaAvg} is over 20 percent of full ${full}, ratio ${ratio.toFixed(4)}`);
          console.log(`state bytes full=${full} delta_avg=${Math.round(deltaAvg)} ratio=${ratio.toFixed(4)}`);
          process.exit(0);
          JS

      - name: Check docs/FRIENDS.md for command lines and CLI flags
        run: |
          set -euo pipefail
          guide=docs/FRIENDS.md
          test -s "$guide" || { echo "docs/FRIENDS.md is missing or empty"; exit 1; }
          if grep -n -E '^[[:space:]]*(node|npm|npx|cargo|\./)[[:space:]]' "$guide"; then
            echo "docs/FRIENDS.md has a command line; the page-hosted guide must not"; exit 1
          fi
          if grep -n -E '(^|[[:space:]])--[a-z][a-z-]*' "$guide"; then
            echo "docs/FRIENDS.md has CLI flags"; exit 1
          fi
          if grep -n -i -E 'oscraftd|js/host|server\.js|\.wasm|archive' "$guide"; then
            echo "docs/FRIENDS.md names a server process or archive"; exit 1
          fi
          echo "friends guide ok command_lines=0 cli_flags=0"

      - name: Count the retired resource names under rust and js
        run: |
          count() { grep -rhoi "$1" rust js | wc -l; }
          m=$(count minerals); v=$(count vespene); s=$(count supply)
          test "$m$v$s" = 000 || { echo "resource names found minerals=$m vespene=$v supply=$s"; exit 1; }
          echo "resource names ok minerals=$m vespene=$v supply=$s"

      - name: ICE config with OSCRAFT_ICE set, then unset
        env:
          ICE_JS: ${{ github.workspace }}/js/client/ice.js
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ice-check.mjs" <<'JS'
          import { pathToFileURL } from 'node:url';
          const { iceServersFrom } = await import(pathToFileURL(process.env.ICE_JS).href);
          const fail = (why) => { console.error(`ice config FAIL ${why}`); process.exit(1); };
          const raw = process.env.OSCRAFT_ICE;
          const config = iceServersFrom(raw ?? null);
          const hasTurn = config.servers.some((s) => [s.urls].flat().some((u) => /^turns?:/.test(u)));
          if (raw === undefined) {
            if (!config.default || config.servers.length !== 2) fail('unset OSCRAFT_ICE must give the default STUN list');
            console.log('ice config ok default=true');
          } else {
            if (config.default) fail('OSCRAFT_ICE set but the default list was used');
            if (!hasTurn) fail('OSCRAFT_ICE set without a TURN entry');
            console.log(`ice config ok servers=${config.servers.length}`);
          }
          let refused = false;
          try { iceServersFrom('not json'); } catch { refused = true; }
          if (!refused) fail('malformed ICE config was accepted');
          process.exit(0);
          JS
          OSCRAFT_ICE='[{"urls":"turn:turn.example.org:3478","username":"u","credential":"p"},{"urls":"stun:stun.example.org:3478"}]' node "$RUNNER_TEMP/ice-check.mjs" | tee "$RUNNER_TEMP/ice-set.txt"
          grep -q '^ice config ok servers=2$' "$RUNNER_TEMP/ice-set.txt"
          env -u OSCRAFT_ICE node "$RUNNER_TEMP/ice-check.mjs" | tee "$RUNNER_TEMP/ice-unset.txt"
          grep -q '^ice config ok default=true$' "$RUNNER_TEMP/ice-unset.txt"

      - name: moba unit models parse as GLB
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync, readdirSync } from "node:fs";
            import { parseGlb } from "./js/client/glb.js";
            const files = readdirSync("js/client/models").filter((f) => f.endsWith(".glb"));
            for (const f of files) {
              const b = readFileSync("js/client/models/" + f);
              parseGlb(b.buffer.slice(b.byteOffset, b.byteOffset + b.byteLength));
            }
            console.log(`moba models ok kinds=${files.length}`);
          ' | tee moba-models.txt
          grep -q '^moba models ok kinds=6$' moba-models.txt

      - name: count reference-game terms in the tree
        run: |
          count() { git grep -iE "$1" -- . ':!LICENSES-INVENTORY.md' | wc -l; }
          s=$(count 'st[a]rcraft'); c=$(count 'sc[2]'); b=$(count 'blizz[a]rd'); g=$(count 'gal[a]xy')
          if [ $((s+c+b+g)) -ne 0 ]; then echo naming comments FAIL st''arcraft=$s sc''2=$c bli''zzard=$b gal''axy=$g; exit 1; fi
          echo naming comments ok st''arcraft=$s sc''2=$c bli''zzard=$b

  mod-lsp:
    name: language server matches the engine validator
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ci-build
          path: rust

      - name: Mark the prebuilt binaries executable
        working-directory: ${{ github.workspace }}
        run: find rust/target/debug -maxdepth 1 -type f -exec chmod +x {} +

      - name: Drive the server over stdio and compare its diagnostic with the engine
        run: |
          set -euo pipefail
          export LC_ALL=C
          MOD="$RUNNER_TEMP/mod"
          mkdir -p "$MOD"
          printf 'x = 1\n' > "$MOD/mod.osd"
          ENGINE=$(./target/debug/osdt-data "$MOD" "$RUNNER_TEMP/mod.bin" 2>&1 | sed -n 's/^Error: //p' || true)
          URI="file://$MOD/mod.osd"
          frame() { printf 'Content-Length: %d\r\n\r\n%s' "${#1}" "$1"; }
          {
            frame '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"processId":null,"rootUri":null,"capabilities":{}}}'
            frame '{"jsonrpc":"2.0","method":"initialized","params":{}}'
            frame "{\"jsonrpc\":\"2.0\",\"method\":\"textDocument/didOpen\",\"params\":{\"textDocument\":{\"uri\":\"$URI\",\"languageId\":\"starlark\",\"version\":1,\"text\":\"x = 1\\n\"}}}"
            frame "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"textDocument/completion\",\"params\":{\"textDocument\":{\"uri\":\"$URI\"},\"position\":{\"line\":0,\"character\":0}}}"
            frame '{"jsonrpc":"2.0","id":3,"method":"shutdown"}'
            frame '{"jsonrpc":"2.0","method":"exit"}'
          } | ./target/debug/oscraft-lsp > "$RUNNER_TEMP/lsp.out"
          sed 's/Content-Length: [0-9]*//g' "$RUNNER_TEMP/lsp.out" | tr -d '\r' > "$RUNNER_TEMP/msgs.jsonl"
          DIAG=$(jq -r 'select(.method=="textDocument/publishDiagnostics") | .params.diagnostics[0].message // ""' "$RUNNER_TEMP/msgs.jsonl")
          HAS_GRID=$(jq -r 'select(.id==2) | [.result.items[].label] | index("grid") != null' "$RUNNER_TEMP/msgs.jsonl")
          echo "engine: [$ENGINE]"
          echo "server: [$DIAG]"
          [ -n "$ENGINE" ] || { echo "REFUSE: engine validator reported nothing for the fixture"; exit 1; }
          [ "$DIAG" = "$ENGINE" ] || { echo "FAIL: server diagnostic differs from engine"; exit 1; }
          [ "$HAS_GRID" = true ] || { echo "FAIL: completion lacks engine builtin grid"; exit 1; }
          echo "ok: diagnostic matches engine validator, completion lists engine builtins"

      - name: Hover on an engine builtin lists its parameters over stdio
        run: |
          set -euo pipefail
          export LC_ALL=C
          MOD="$RUNNER_TEMP/hover-mod"
          mkdir -p "$MOD"
          printf 'x = 1\n' > "$MOD/mod.osd"
          URI="file://$MOD/hover.osd"
          frame() { printf 'Content-Length: %d\r\n\r\n%s' "${#1}" "$1"; }
          {
            frame '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"processId":null,"rootUri":null,"capabilities":{}}}'
            frame '{"jsonrpc":"2.0","method":"initialized","params":{}}'
            frame "{\"jsonrpc\":\"2.0\",\"method\":\"textDocument/didOpen\",\"params\":{\"textDocument\":{\"uri\":\"$URI\",\"languageId\":\"starlark\",\"version\":1,\"text\":\"effect\\n\"}}}"
            frame "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"textDocument/hover\",\"params\":{\"textDocument\":{\"uri\":\"$URI\"},\"position\":{\"line\":0,\"character\":2}}}"
            frame '{"jsonrpc":"2.0","id":3,"method":"shutdown"}'
            frame '{"jsonrpc":"2.0","method":"exit"}'
          } | ./target/debug/oscraft-lsp > "$RUNNER_TEMP/hover.out"
          sed 's/Content-Length: [0-9]*//g' "$RUNNER_TEMP/hover.out" | tr -d '\r' > "$RUNNER_TEMP/hover-msgs.jsonl"
          HOVER=$(jq -r 'select(.id==2) | .result.contents.value // ""' "$RUNNER_TEMP/hover-msgs.jsonl")
          SIG=$(printf '%s\n' "$HOVER" | head -1)
          case "$SIG" in effect\(*\)) ;; *) echo "FAIL: hover for effect is [$SIG]"; exit 1 ;; esac
          INNER=${SIG#effect(}
          INNER=${INNER%)}
          PARAMS=$(echo "$INNER" | awk -F', ' '{print NF}')
          for p in kind p0 p1 p2 p3; do
            case ", $INNER," in *", $p,"*) ;; *) echo "FAIL: hover lacks parameter $p in [$SIG]"; exit 1 ;; esac
          done
          echo "lsp hover ok name=effect params=$PARAMS"

      - name: Lua mods get a load diagnostic with a line, the clean mod gets none, host globals complete
        run: |
          set -euo pipefail
          export LC_ALL=C
          SRC=crates/spike/mods/unit_mod.lua
          CLEAN="$RUNNER_TEMP/lua-clean/unit_mod.lua"
          BROKEN="$RUNNER_TEMP/lua-broken/unit_mod.lua"
          mkdir -p "$(dirname "$CLEAN")" "$(dirname "$BROKEN")"
          cp "$SRC" "$CLEAN"
          sed '8s/ = / = = /' "$SRC" > "$BROKEN"
          cmp -s "$SRC" "$BROKEN" && { echo "REFUSE: broken copy equals the clean mod"; exit 1; }
          frame() { printf 'Content-Length: %d\r\n\r\n%s' "${#1}" "$1"; }
          open_msg() { jq -cn --rawfile t "$1" --arg u "file://$1" '{jsonrpc:"2.0",method:"textDocument/didOpen",params:{textDocument:{uri:$u,languageId:"lua",version:1,text:$t}}}'; }
          {
            frame '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"processId":null,"rootUri":null,"capabilities":{}}}'
            frame '{"jsonrpc":"2.0","method":"initialized","params":{}}'
            frame "$(open_msg "$CLEAN")"
            frame "$(open_msg "$BROKEN")"
            frame "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"textDocument/completion\",\"params\":{\"textDocument\":{\"uri\":\"file://$CLEAN\"},\"position\":{\"line\":0,\"character\":0}}}"
            frame '{"jsonrpc":"2.0","id":3,"method":"shutdown"}'
            frame '{"jsonrpc":"2.0","method":"exit"}'
          } | ./target/debug/oscraft-lsp > "$RUNNER_TEMP/lua.out"
          sed 's/Content-Length: [0-9]*//g' "$RUNNER_TEMP/lua.out" | tr -d '\r' > "$RUNNER_TEMP/lua-msgs.jsonl"
          CLEAN_N=$(jq -r --arg u "file://$CLEAN" 'select(.method=="textDocument/publishDiagnostics" and .params.uri==$u) | .params.diagnostics | length' "$RUNNER_TEMP/lua-msgs.jsonl")
          [ "$CLEAN_N" = 0 ] || { echo "FAIL: clean mod reported [$CLEAN_N] diagnostic group(s)"; exit 1; }
          BROKEN_DIAG=$(jq -r --arg u "file://$BROKEN" 'select(.method=="textDocument/publishDiagnostics" and .params.uri==$u) | .params.diagnostics[0] | "\(.range.start.line)\t\(.message)"' "$RUNNER_TEMP/lua-msgs.jsonl")
          BROKEN_LINE=${BROKEN_DIAG%%$'\t'*}
          BROKEN_MSG=${BROKEN_DIAG#*$'\t'}
          [[ "$BROKEN_LINE" =~ ^[0-9]+$ ]] || { echo "FAIL: broken copy has no diagnostic line: [$BROKEN_DIAG]"; exit 1; }
          [ "$BROKEN_LINE" = 7 ] || { echo "FAIL: broken copy diagnostic at 0-based line $BROKEN_LINE, expected 7"; exit 1; }
          echo "lua-diagnostic: $(basename "$BROKEN") line $((BROKEN_LINE + 1)): $BROKEN_MSG"
          EXPORTED=$({ sed -n '/^pub const HOST_GLOBALS/,/^\];/p' crates/mod-host/src/lib.rs | grep -o '"[a-z_]*"' | tr -d '"'; sed -n '/^pub const EVENTS/,/^\];/p' crates/mod-host/src/lib.rs | grep -o '("[a-z_]*"' | tr -d '("'; } | sort)
          COMPLETED=$(jq -r 'select(.id==2) | .result.items[].label' "$RUNNER_TEMP/lua-msgs.jsonl" | sort)
          [ -n "$EXPORTED" ] || { echo "REFUSE: mod-host exports no host globals"; exit 1; }
          [ "$COMPLETED" = "$EXPORTED" ] || { echo "FAIL: lua completion differs from mod-host exports"; diff <(echo "$EXPORTED") <(echo "$COMPLETED") || true; exit 1; }
          echo "lsp host globals match mod-host ok count=$(echo "$EXPORTED" | wc -l)"
          for name in define_region in_region on_tick; do
            grep -q "\"$name\"" crates/mod-host/src/lib.rs || { echo "FAIL: mod-host no longer registers $name"; exit 1; }
          done
          grep -q 'on_tick(state)' crates/mod-host/src/lib.rs || { echo "FAIL: mod-host contract no longer takes state"; exit 1; }
          echo "ok: clean mod has no diagnostic, broken mod reports line 8, host globals complete and registered"

  hot-reload:
    name: hot reload swaps and rolls back (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: rust-workspace

      - name: Run the reload harness and check its three check lines
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p mod-host --bin reload_harness > reload.txt 2>&1 || { cat reload.txt; exit 1; }
          cat reload.txt
          grep -Eq '^reload-check reload ok ' reload.txt
          grep -Eq '^reload-check value-changed ok ' reload.txt
          grep -Eq '^reload-check error-reported line=[0-9]+ ok$' reload.txt
          grep -Eq '^reload-check rollback ok ' reload.txt

  hot-reload-linux:
    name: hot reload swaps and rolls back (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ci-build
          path: rust

      - name: Mark the prebuilt binaries executable
        working-directory: ${{ github.workspace }}
        run: find rust/target/debug -maxdepth 1 -type f -exec chmod +x {} +

      - name: Run the reload harness and check its three check lines
        shell: bash
        run: |
          set -euo pipefail
          target/debug/reload_harness > reload.txt 2>&1 || { cat reload.txt; exit 1; }
          cat reload.txt
          grep -Eq '^reload-check reload ok ' reload.txt
          grep -Eq '^reload-check value-changed ok ' reload.txt
          grep -Eq '^reload-check error-reported line=[0-9]+ ok$' reload.txt
          grep -Eq '^reload-check rollback ok ' reload.txt

      - name: Check a mod against the moba scenario with mod_check, and refuse a broken mod with its file and line
        shell: bash
        run: |
          set -euo pipefail
          target/debug/mod_check ../scenarios/moba crates/mod-host/fixtures/moba_attack.lua 300 > modcheck.txt 2>&1 || { cat modcheck.txt; exit 1; }
          cat modcheck.txt
          grep -Eq '^mod-check ok ticks=300 units=[1-9][0-9]* deaths=[0-9]+ casts=[0-9]+ casts_refused=[0-9]+ last_refusal=[A-Za-z]+ refusals=(none|[a-z-]+:[0-9]+(,[a-z-]+:[0-9]+)*)$' modcheck.txt
          set +e
          target/debug/mod_check ../scenarios/moba crates/mod-host/fixtures/broken.lua 5 > broken.txt 2>&1
          code=$?
          set -e
          cat broken.txt
          test "$code" -eq 1
          grep -Eq '^mod-check load-error .*broken\.lua:3: ' broken.txt

  package-install:
    name: single archive builds and installs into an empty directory
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: rust-package

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0

      - name: Build the archive (server, mod LSP, data directory, browser page)
        run: bash scripts/package/build.sh "$RUNNER_TEMP/package"

      - name: Install the archive into an empty directory and check it runs
        run: |
          set -euo pipefail
          archive=$(ls "$RUNNER_TEMP"/package/oscraft-*.tar.gz)
          bash scripts/package/install-check.sh "$archive" "$RUNNER_TEMP/installed" | tee "$RUNNER_TEMP/install.out"
          grep -q '^package install ok members=[0-9]* sha256_checked=[0-9]*$' "$RUNNER_TEMP/install.out"

      - uses: actions/upload-artifact@v4
        with:
          name: oscraft-package
          path: ${{ runner.temp }}/package/oscraft-*.tar.gz
      - name: Assert the install line reports the client, the wasm package and the map
        run: |
          set -euo pipefail
          grep -q '^package install ok members=[0-9]* sha256_checked=[0-9]* client=ok pkg=ok map=ok$' "$RUNNER_TEMP/install.out"

  wire:
    name: wire frame codec round-trip
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 5
    defaults:
      run:
        working-directory: js/wire
    steps:
      - uses: actions/checkout@v4

      - name: Round-trip and reject tests
        run: node test.js

  duel-routes:
    name: duel-routes scenario loads and serves its counts
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ci-build
          path: rust

      - name: Mark the prebuilt binaries executable
        working-directory: ${{ github.workspace }}
        run: find rust/target/debug -maxdepth 1 -type f -exec chmod +x {} +

      - name: Compile the scenario, serve it, advance 200 ticks, check counts derived from its files
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/duel-routes"
          mkdir -p "$work"
          addr=127.0.0.1:8106
          scen="$GITHUB_WORKSPACE/scenarios/duel-routes"
          pid=0
          on_exit() {
            rc=$?
            [ "$pid" -ne 0 ] && kill "$pid" 2>/dev/null || true
            if [ "$rc" -ne 0 ]; then echo "--- server log tail"; tail -n 120 "$work/server.log" 2>/dev/null || echo "(no server log)"; fi
            exit "$rc"
          }
          trap on_exit EXIT
          cd rust
          ./target/debug/osdt-data "$scen" "$work/catalog.osdt"
          target/debug/oscraftd --addr "$addr" --room ci --data "$work/catalog.osdt" --ticks 100000000 > "$work/server.log" 2>&1 &
          pid=$!
          for i in $(seq 1 60); do curl -s -o /dev/null "http://$addr/" && break; sleep 0.5; done
          curl -sf "http://$addr/state?map=ci" > "$work/s0.json"
          tick=0
          for i in $(seq 1 240); do
            curl -sf "http://$addr/state?map=ci" > "$work/s1.json" || true
            tick=$(jq -r '.tick // 0' "$work/s1.json" 2>/dev/null || echo 0)
            test "$tick" -ge 200 && break
            sleep 0.5
          done
          test "$tick" -ge 200
          cd "$scen"
          starts=$(grep -cE '^start\(' map.osd)
          spawns=$(grep -cE '^spawn\(' map.osd)
          beacons=$(grep -cE '^spawn\("beacon"' map.osd)
          routes=$(grep -E '^spawn\("beacon"' map.osd | sed -E 's/.*, *([0-9]+) *\)$/\1/' | sort -u | wc -l)
          workers=$(grep -oE 'opening_workers *= *[0-9]+' economy.osd | grep -oE '[0-9]+$')
          expected_units=$((spawns + starts * workers))
          units=$(jq '.units' "$work/s0.json")
          sides=$(jq '[.records[].player | select(. >= 0)] | unique | length' "$work/s0.json")
          live_routes=$(jq '[.records[] | select(.hp == 19660800) | .y] | unique | length' "$work/s0.json")
          live_beacons=$(jq '[.records[] | select(.hp == 19660800)] | length' "$work/s0.json")
          echo "from files: starts=$starts spawns=$spawns beacons=$beacons routes=$routes expected_units=$expected_units"
          echo "served at tick 0: units=$units sides=$sides routes=$live_routes objectives=$live_beacons tick_reached=$tick"
          test "$units" -eq "$expected_units"
          test "$sides" -eq "$starts"
          test "$live_routes" -eq "$routes"
          test "$live_beacons" -eq "$beacons"
          echo "scenario ok sides=$sides routes=$routes objectives=$beacons units=$units"

      - name: Gate witnesses - a beacon loses hit points in range; destroying a side's tagged structures names the winner
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gate-witness.txt"
          cd "$GITHUB_WORKSPACE/rust"
          # The gate exits nonzero when any other check fails; this step asserts only its own PASS line.
          target/debug/oscraft-gate > "$out" 2>&1 || true
          grep -q '^check mechanic-structure-damage PASS$' "$out"
          grep -E '^structure damage ok hp_before=[0-9]+ hp_after=[0-9]+$' "$out"
          grep -q '^check mechanic-win-trigger PASS$' "$out"
          grep -E '^win trigger ok winner=[0-9]+$' "$out"
          grep -q '^check mechanic-kill-bounty PASS$' "$out"
          grep -E '^kill bounty ok gold_before=[0-9]+ gold_after=[0-9]+$' "$out"
          grep -q '^check moba-match-end PASS$' "$out"
          grep -E '^moba match ok winner=[0-9]+ ticks=[0-9]+$' "$out"
          grep -q '^check moba-creeps PASS$' "$out"
          grep -E '^moba creeps ok lane_progress=[0-9]+$' "$out"
          grep -q '^check moba-lane PASS$' "$out"
          grep -E '^moba lane ok ticks=[0-9]+ connector=true$' "$out"
          grep -q '^check moba-sync PASS$' "$out"
          grep -E '^moba sync ok ticks=[0-9]+ diff=0$' "$out"
          grep -q '^check moba-objective PASS$' "$out"
          grep -E '^moba objective ok hp=[0-9]+->[0-9]+$' "$out"

  moba:
    name: moba scenario loads, serves its counts, spawns timed creep waves, and reads the win trigger
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ci-build
          path: rust

      - name: Mark the prebuilt binaries executable
        working-directory: ${{ github.workspace }}
        run: find rust/target/debug -maxdepth 1 -type f -exec chmod +x {} +

      - name: Compile the moba scenario, serve it, run past one creep_wave cooldown, check counts derived from its files
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/moba"
          mkdir -p "$work"
          addr=127.0.0.1:8107
          scen="$GITHUB_WORKSPACE/scenarios/moba"
          pid=0
          on_exit() {
            rc=$?
            [ "$pid" -ne 0 ] && kill "$pid" 2>/dev/null || true
            if [ "$rc" -ne 0 ]; then echo "--- server log tail"; tail -n 120 "$work/server.log" 2>/dev/null || echo "(no server log)"; fi
            exit "$rc"
          }
          trap on_exit EXIT
          cooldown=$(grep -oE '^ability\("creep_wave", *[0-9]+' "$scen/abilities.osd" | grep -oE '[0-9]+$')
          bases=$(grep -cE '^spawn\("base"' "$scen/map.osd")
          initial=$(grep -cE 'trigger="spawned".*ability="creep_wave"' "$scen/behaviours.osd")
          target=$((cooldown + 100))
          cd rust
          ./target/debug/osdt-data "$scen" "$work/catalog.osdt"
          target/debug/oscraftd --addr "$addr" --room ci --data "$work/catalog.osdt" --ticks 100000000 > "$work/server.log" 2>&1 &
          pid=$!
          for i in $(seq 1 60); do curl -s -o /dev/null "http://$addr/" && break; sleep 0.5; done
          tick=0
          for i in $(seq 1 240); do
            curl -sf "http://$addr/state?map=ci" > "$work/s0.json" || true
            tick=$(jq -r '.tick // 0' "$work/s0.json" 2>/dev/null || echo 0)
            test "$tick" -ge 3 && break
            sleep 0.5
          done
          test "$tick" -ge 3
          units0=$(jq '.units' "$work/s0.json")
          at_tick=""
          tick=0
          for i in $(seq 1 1800); do
            curl -sf "http://$addr/state?map=ci" > "$work/s1.json" || true
            tick=$(jq -r '.tick // 0' "$work/s1.json" 2>/dev/null || echo 0)
            units_now=$(jq '.units' "$work/s1.json" 2>/dev/null || echo "$units0")
            if [ -z "$at_tick" ] && [ "$units_now" -gt "$units0" ]; then at_tick=$tick; fi
            test "$tick" -ge "$target" && break
            sleep 0.5
          done
          test "$tick" -ge "$target"
          cd "$scen"
          starts=$(grep -cE '^start\(' map.osd)
          spawns=$(grep -cE '^spawn\(' map.osd)
          towers=$(grep -cE '^spawn\("tower"' map.osd)
          heroes=$(grep -cE '^spawn\("hero"' map.osd)
          creeps_spawned=$(grep -cE '^spawn\("creep"' map.osd)
          lanes=$(grep -E '^spawn\("tower"' map.osd | sed -E 's/.*, *[0-9]+ *, *([0-9]+) *\)$/\1/' | sort -u | wc -l)
          workers=$(grep -oE 'opening_workers *= *[0-9]+' economy.osd | grep -oE '[0-9]+$')
          expected_units=$((spawns + starts * workers))
          initial_units=$((expected_units + bases * initial))
          sides=$(jq '[.records[].player | select(. >= 0)] | unique | length' "$work/s0.json")
          echo "from files: starts=$starts spawns=$spawns towers=$towers heroes=$heroes creeps=$creeps_spawned lanes=$lanes bases=$bases initial_waves=$initial cooldown=$cooldown expected_units=$expected_units"
          echo "served from tick 3: units=$units0 sides=$sides; expected with initial waves=$initial_units"
          test "$units0" -eq "$initial_units"
          test "$sides" -eq "$starts"
          test "$lanes" -eq 3
          test "$heroes" -eq "$starts"
          echo "moba scenario ok sides=$sides lanes=$lanes towers=$towers heroes=$heroes creeps_spawned=$creeps_spawned"
          units_end=$(jq '.units' "$work/s1.json")
          spawned=$((units_end - units0))
          max_waves=$((bases * (target / cooldown + 1)))
          echo "wave: units_end=$units_end spawned=$spawned at_tick=$at_tick bases=$bases max_waves=$max_waves"
          test -n "$at_tick"
          test "$spawned" -ge "$bases"
          test "$spawned" -le "$max_waves"
          echo "moba wave ok spawned=$spawned at_tick=$at_tick"
          win=$(grep -E '^behaviour\("win_on_base_loss"' behaviours.osd)
          test -n "$win"
          echo "$win" | grep -qE 'trigger="destroyed".*action="declare_winner".*tag="building"'
          echo "moba win tag ok tag=building"

  lobby-room-select:
    name: lobby room panel lists two rooms announced on the relay, joins one, and drops a closed page after its TTL
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ci-build
          path: rust

      - name: Mark the prebuilt binaries executable
        working-directory: ${{ github.workspace }}
        run: find rust/target/debug -maxdepth 1 -type f -exec chmod +x {} +

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install headless Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: Two pages announce their rooms on a relay; a third page lists them and joins one
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/lobby"
          mkdir -p "$work"
          "$GITHUB_WORKSPACE/rust/target/debug/oscraft-relay" 7447 > "$work/relay.log" 2>&1 &
          relay=$!
          site="$work/site"
          mkdir -p "$site"
          cp -R "$GITHUB_WORKSPACE/js/client/." "$site/"
          cp -R "$GITHUB_WORKSPACE/js/wire" "$site/wire"
          python3 -m http.server 8091 --bind 127.0.0.1 --directory "$site" > "$work/static.log" 2>&1 &
          static=$!
          trap 'cat "$work/relay.log" | tail -40 >&2; kill $relay $static 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8091/play.html > /dev/null && break; sleep 1; done
          cat > "$RUNNER_TEMP/pw/lobby.mjs" <<'EOF'
          import { chromium } from "playwright";
          const relay = "ws://127.0.0.1:7447";
          const base = `http://127.0.0.1:8091/play.html?relay=${relay}&ns=oscraft-ci`;
          const browser = await chromium.launch({ args: ["--use-angle=swiftshader", "--enable-unsafe-swiftshader"] });
          const errors = [];
          try {
            const hostA = await (await browser.newContext()).newPage();
            const hostB = await (await browser.newContext()).newPage();
            for (const [page, hash] of [[hostA, "alpha"], [hostB, "beta"]]) {
              page.on("pageerror", (e) => errors.push(e.message));
              page.on("console", (m) => errors.push(`${m.type()}: ${m.text()}`));
              page.on("response", (r) => { if (r.status() >= 400) errors.push(`http ${r.status()} ${r.url()}`); });
              await page.goto(`${base}#${hash}`);
            }
            const viewer = await (await browser.newContext()).newPage();
            viewer.on("pageerror", (e) => errors.push(e.message));
            viewer.on("console", (m) => errors.push(`viewer ${m.type()}: ${m.text()}`));
            viewer.on("response", (r) => { if (r.status() >= 400) errors.push(`viewer http ${r.status()} ${r.url()}`); });
            await viewer.goto(`${base}#alpha`);
            await viewer.waitForSelector('#rooms[data-ready="1"]', { state: "attached", timeout: 60000 });
            await viewer.waitForFunction(() => document.querySelectorAll("#room-list button").length === 2, null, { timeout: 120000 }).catch(async (err) => {
              console.error(`panel: ${await viewer.textContent("#room-list")}`);
              throw err;
            });
            const names = await viewer.$$eval("#room-list button", (bs) => bs.map((b) => b.dataset.room).sort());
            if (JSON.stringify(names) !== JSON.stringify(["alpha", "beta"])) throw new Error(`panel lists ${JSON.stringify(names)}`);
            await Promise.all([viewer.waitForEvent("load"), viewer.click('#room-list button[data-room="beta"]')]);
            await viewer.waitForSelector('#rooms[data-ready="1"]', { state: "attached", timeout: 60000 });
            const joined = await viewer.textContent("#room-current");
            if (joined !== "beta") throw new Error(`joined ${joined}, want beta`);
            await hostA.close();
            await viewer.waitForFunction(() => [...document.querySelectorAll("#room-list button")].map((b) => b.dataset.room).join(",") === "beta", null, { timeout: 150000 });
            console.log(`room expiry ok dropped=alpha remaining=beta ttl_s=45`);
            console.log(`lobby room select ok rooms=${names.length} joined=${joined}`);
          } catch (err) {
            console.error(`page errors: ${errors.slice(0, 40).join(" | ")}`);
            throw err;
          } finally {
            await browser.close();
          }
          EOF
          node "$RUNNER_TEMP/pw/lobby.mjs" | tee "$work/lobby.txt"
          grep -q '^room expiry ok dropped=alpha remaining=beta ttl_s=45$' "$work/lobby.txt"
          grep -q '^lobby room select ok rooms=2 joined=beta$' "$work/lobby.txt"
  wasip3:
    name: sim as wasip3 guest on nightly
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust/crates/wasip3
    steps:
      - uses: actions/checkout@v4

      - name: Install the nightly toolchain with the wasm32-wasip3 target
        run: rustup toolchain install nightly --profile minimal --target wasm32-wasip3

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/crates/wasip3 -> target
          shared-key: rust-wasip3

      - name: Build the sim as a wasip3 guest
        run: cargo +nightly build --target wasm32-wasip3 -p wasip3-guest --release

      - name: Run the guest under the native host on the map image, and check its tick witness
        run: |
          set -euo pipefail
          (cd ../.. && cargo +stable run -q -p mapexport -- "$RUNNER_TEMP/map.osdt" data)
          # The host runs on stable: wasmtime's allocative dependency does not compile on this nightly.
          cargo +stable run --release --bin oscraft_wasip3 -- target/wasm32-wasip3/release/oscraft_wasip3.wasm "$RUNNER_TEMP/map.osdt" | tee "$RUNNER_TEMP/wasip3.txt"
          grep -q '^wasip3 build ok bytes=[0-9]*$' "$RUNNER_TEMP/wasip3.txt"
          grep -qE '^wasip3 tick ok ticks=10 units=[1-9][0-9]*$' "$RUNNER_TEMP/wasip3.txt"

  browser-two-peers:
    name: "browser host and browser peer over wireweave: one order moves a unit on both pages"
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ci-build
          path: rust

      - name: Mark the prebuilt binaries executable
        working-directory: ${{ github.workspace }}
        run: find rust/target/debug -maxdepth 1 -type f -exec chmod +x {} +

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stage the page wasm and maps this run built into js/client, which the static server serves
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf js/client/pkg
          cp -r rust/crates/web/site/pkg js/client/pkg
          cp rust/crates/web/site/map.bin js/client/map.bin
          cp rust/crates/web/site/moba.bin js/client/moba.bin

      - name: Install headless Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: "Relay, browser host and browser peer: an order from the peer moves its unit on both pages"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/browser-two-peers"
          mkdir -p "$work"
          "$GITHUB_WORKSPACE/rust/target/debug/oscraft-relay" 7447 > "$work/relay.log" 2>&1 &
          relay=$!
          python3 -m http.server 8092 --bind 127.0.0.1 --directory js/client > "$work/static.log" 2>&1 &
          static=$!
          trap 'kill $relay $static 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8092/play.html > /dev/null && break; sleep 1; done
          cat > "$RUNNER_TEMP/pw/two-peers.mjs" <<'EOF'
          import { chromium } from "playwright";
          const base = "http://127.0.0.1:8092/play.html?relay=ws://127.0.0.1:7447&ns=oscraft-ci&ci=1";
          const browser = await chromium.launch({ args: ["--use-angle=swiftshader", "--enable-unsafe-swiftshader", "--disable-features=WebRtcHideLocalIpsWithMdns"] });
          const errors = [];
          try {
            const host = await (await browser.newContext()).newPage();
            const peer = await (await browser.newContext()).newPage();
            for (const p of [host, peer]) p.on("pageerror", (e) => errors.push(e.message));
            await host.goto(`${base}&host=1#ci`);
            await peer.goto(`${base}#ci`);
            await host.waitForFunction(() => window.__ciPeers && window.__ciPeers() >= 1, null, { timeout: 120000 });
            await peer.waitForFunction(() => window.__ciUnits && window.__ciUnits().length > 0, null, { timeout: 120000 });
            const start = await peer.evaluate(() => window.__ciUnits());
            const unit = start.find((u) => u.player === 0);
            if (!unit) throw new Error("no unit owned by the first peer's player 0");
            const dist = (p) => Math.hypot(p.x - (unit.x + 4), p.z - unit.z);
            const seen = async (page) => page.evaluate((id) => window.__ciUnits().find((u) => u.id === id) || null, unit.id);
            const target = { x: Math.round(unit.x) + 4, z: Math.round(unit.z) };
            const deadline = Date.now() + 90000;
            let onPeer = null;
            let onHost = null;
            while (Date.now() < deadline) {
              await peer.evaluate(([id, x, z]) => window.__ciOrder(id, x, z), [unit.id, target.x, target.z]);
              await new Promise((r) => setTimeout(r, 1500));
              onPeer = await seen(peer);
              onHost = await seen(host);
              if (onPeer && onHost && Math.hypot(onPeer.x - target.x, onPeer.z - target.z) < Math.hypot(unit.x - target.x, unit.z - target.z) - 1
                && Math.hypot(onHost.x - target.x, onHost.z - target.z) < Math.hypot(unit.x - target.x, unit.z - target.z) - 1) break;
            }
            const movedToward = (p) => !!p && Math.hypot(p.x - target.x, p.z - target.z) < Math.hypot(unit.x - target.x, unit.z - target.z) - 1;
            if (!movedToward(onPeer) || !movedToward(onHost)) throw new Error(`no movement seen: start=${unit.x},${unit.z} peer=${JSON.stringify(onPeer)} host=${JSON.stringify(onHost)}`);
            // The gunship spawned at (24, 14) for player 1 in rust/data/map.osd. It flies, so the sim's
            // same-layer separation never moves it, and no ground unit reaches it; a ground unit next to
            // the moving unit would be pushed by separation and would not witness the refusal.
            const foreign = start.find((u) => u.player === 1 && Math.hypot(u.x - 24, u.z - 14) < 0.5);
            if (!foreign) throw new Error("no gunship owned by the second player at (24, 14)");
            const at = async (page) => page.evaluate((id) => window.__ciUnits().find((u) => u.id === id) || null, foreign.id);
            const foreignBefore = await at(host);
            await peer.evaluate(([id, x, z]) => window.__ciOrder(id, x, z), [foreign.id, Math.round(foreign.x) + 4, Math.round(foreign.z)]);
            await host.waitForFunction((id) => document.body.dataset.lastRefusal === `not_owner unit=${id}`, foreign.id, { timeout: 60000 });
            await new Promise((r) => setTimeout(r, 2000));
            const same = (a, b) => !!a && !!b && Math.hypot(a.x - b.x, a.z - b.z) < 0.05;
            const foreignHost = await at(host);
            const foreignPeer = await at(peer);
            if (!same(foreignBefore, foreignHost) || !same(foreignBefore, foreignPeer)) throw new Error(`refused order moved a foreign unit: before=${JSON.stringify(foreignBefore)} host=${JSON.stringify(foreignHost)} peer=${JSON.stringify(foreignPeer)}`);
            if (errors.length) throw new Error("page errors: " + errors.join(" | "));
            console.log(`browser two peers ok unit=${unit.id} host_moved=true peer_moved=true`);
            console.log(`browser order refused not_owner ok unit=${foreign.id} owner=1 sender=0 stayed=true`);
            await host.waitForFunction(() => window.__ciFrames && window.__ciFrames.length >= 200, null, { timeout: 120000 });
            const frames = await host.evaluate(() => window.__ciFrames.slice(0, 200));
            const full = frames.find((f) => f.type === 2);
            const deltas = frames.filter((f) => f.type === 5);
            if (!full || deltas.length === 0) throw new Error("no state or delta frame in the first 200 host ticks");
            const deltaAvg = Math.round(deltas.reduce((sum, f) => sum + f.bytes, 0) / deltas.length);
            console.log(`browser frame bytes full=${full.bytes} delta_avg=${deltaAvg}`);
          } finally {
            await browser.close();
          }
          EOF
          node "$RUNNER_TEMP/pw/two-peers.mjs" | tee "$work/two-peers.txt"
          grep -q '^browser two peers ok unit=[0-9]* host_moved=true peer_moved=true$' "$work/two-peers.txt"
          grep -q '^browser order refused not_owner ok unit=[0-9]* owner=1 sender=0 stayed=true$' "$work/two-peers.txt"
          grep -q '^browser frame bytes full=[0-9]* delta_avg=[0-9]*$' "$work/two-peers.txt"
          frame_line=$(grep '^browser frame bytes full=' "$work/two-peers.txt")
          full=$(echo "$frame_line" | sed 's/.* full=\([0-9]*\) .*/\1/')
          delta=$(echo "$frame_line" | sed 's/.* delta_avg=\([0-9]*\)$/\1/')
          budget="$GITHUB_WORKSPACE/.github/perf/browser-frame-bytes.txt"
          full_ceiling=$(awk -F= '/^full_ceiling_bytes=/{print $2}' "$budget")
          delta_ceiling=$(awk -F= '/^delta_avg_ceiling_bytes=/{print $2}' "$budget")
          test -n "$full_ceiling" && test -n "$delta_ceiling"
          if [ "$full" -le "$full_ceiling" ] && [ "$delta" -le "$delta_ceiling" ]; then
            echo "browser frame bytes full=$full delta_avg=$delta within full_ceiling=$full_ceiling delta_ceiling=$delta_ceiling ok"
          else
            echo "browser frame bytes full=$full delta_avg=$delta exceeds full_ceiling=$full_ceiling delta_ceiling=$delta_ceiling" >&2
            exit 1
          fi


  browser-turn-relay:
    name: "browser peers forced onto TURN relay candidates: orders, a cast and an attack cross the relay and the peers agree"
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ci-build
          path: rust

      - name: Mark the prebuilt binaries executable
        working-directory: ${{ github.workspace }}
        run: find rust/target/debug -maxdepth 1 -type f -exec chmod +x {} +

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stage the page wasm and maps this run built into js/client, which the static server serves
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf js/client/pkg
          cp -r rust/crates/web/site/pkg js/client/pkg
          cp rust/crates/web/site/map.bin js/client/map.bin
          cp rust/crates/web/site/moba.bin js/client/moba.bin

      - name: Install headless Chromium and coturn
        run: |
          sudo apt-get update
          sudo apt-get install -y coturn
          # The package starts a default TURN server on port 3478. Stop it so the probe's own server, with its
          # test credentials, is the one the page reaches.
          sudo systemctl disable --now coturn || true
          sudo pkill -x turnserver || true
          if (echo > /dev/tcp/127.0.0.1/3478) 2>/dev/null; then echo "port 3478 still in use"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: "Relay, TURN server and two browser peers forced to relay candidates: orders, a cast and an attack cross the relay"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/browser-turn-relay"
          mkdir -p "$work"
          "$GITHUB_WORKSPACE/rust/target/debug/oscraft-relay" 7447 > "$work/relay.log" 2>&1 &
          relay=$!
          turnserver -n --listening-ip=127.0.0.1 --relay-ip=127.0.0.1 --listening-port=3478 --lt-cred-mech --user=oscraft:oscraft-ci --realm=oscraft --no-tls --no-dtls --no-cli --allow-loopback-peers --log-file=stdout > "$work/turn.log" 2>&1 &
          turn=$!
          python3 -m http.server 8092 --bind 127.0.0.1 --directory js/client > "$work/static.log" 2>&1 &
          static=$!
          trap 'kill $relay $turn $static 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8092/play.html > /dev/null && break; sleep 1; done
          cat > "$RUNNER_TEMP/pw/turn-relay.mjs" <<'EOF'
          import { chromium } from "playwright";
          const ice = encodeURIComponent(JSON.stringify([{ urls: "turn:127.0.0.1:3478?transport=udp", username: "oscraft", credential: "oscraft-ci" }]));
          const base = `http://127.0.0.1:8092/play.html?relay=ws://127.0.0.1:7447&ns=oscraft-ci&ci=1&ice_policy=relay&ice=${ice}`;
          const browser = await chromium.launch({ args: ["--use-angle=swiftshader", "--enable-unsafe-swiftshader", "--disable-features=WebRtcHideLocalIpsWithMdns"] });
          const errors = [];
          const dist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
          try {
            const host = await (await browser.newContext()).newPage();
            const peer = await (await browser.newContext()).newPage();
            for (const p of [host, peer]) p.on("pageerror", (e) => errors.push(e.message));
            await host.goto(`${base}&host=1#moba`);
            await peer.goto(`${base}#moba`);
            // On a timeout, print each page's peer connection states and candidate types before failing.
            const diagnose = async (page, name, e) => {
              console.log(`DIAG ${name} debug=${JSON.stringify(await page.evaluate(() => window.__ciDebug()))}`);
              console.log(`DIAG ${name} candidates=${JSON.stringify(await page.evaluate(() => window.__ciCandidates()))}`);
              console.log(`DIAG ${name} status=${await page.evaluate(() => document.getElementById("status")?.textContent)}`);
              throw e;
            };
            await host.waitForFunction(() => window.__ciPeers && window.__ciPeers() >= 1, null, { timeout: 120000 }).catch((e) => diagnose(host, "host", e));
            await peer.waitForFunction(() => window.__ciUnits && window.__ciUnits().length > 0, null, { timeout: 120000 }).catch((e) => diagnose(peer, "peer", e));
            const relayOnly = (c) => c.localTypes.length > 0 && c.localTypes.every((t) => t === "relay")
              && c.pairs.length > 0 && c.pairs.every((x) => x.local === "relay" && x.remote === "relay");
            let h = null;
            let p = null;
            const pairDeadline = Date.now() + 90000;
            while (Date.now() < pairDeadline) {
              h = await host.evaluate(() => window.__ciCandidates());
              p = await peer.evaluate(() => window.__ciCandidates());
              if (relayOnly(h) && relayOnly(p)) break;
              await new Promise((r) => setTimeout(r, 1000));
            }
            if (!relayOnly(h) || !relayOnly(p)) throw new Error(`not relay-only: host=${JSON.stringify(h)} peer=${JSON.stringify(p)}`);
            const start = await peer.evaluate(() => window.__ciUnits());
            const unit = start.find((u) => u.player === 0);
            if (!unit) throw new Error("no unit owned by the first peer's player 0");
            const target = { x: Math.round(unit.x) + 4, z: Math.round(unit.z) };
            const movedToward = (u) => !!u && dist(u, target) < dist(unit, target) - 1;
            const seen = async (page) => page.evaluate((id) => window.__ciUnits().find((u) => u.id === id) || null, unit.id);
            let onHost = null;
            const moveDeadline = Date.now() + 90000;
            while (Date.now() < moveDeadline) {
              await peer.evaluate(([id, x, z]) => window.__ciOrder(id, x, z), [unit.id, target.x, target.z]);
              await new Promise((r) => setTimeout(r, 1500));
              onHost = await seen(host);
              if (movedToward(onHost) && movedToward(await seen(peer))) break;
            }
            if (!movedToward(onHost) || !movedToward(await seen(peer))) throw new Error(`no movement over the relay: unit=${unit.id} host=${JSON.stringify(onHost)}`);
            // Not every unit of a side can attack or cast, so each one is tried against its nearest enemies until the host accepts.
            const foes = start.filter((u) => u.player === 1);
            const mine = start.filter((u) => u.player === 0).sort((a, b) => dist(a, foes[0] || a) - dist(b, foes[0] || b));
            const landed = async (attr, send) => {
              for (const me of mine) {
                for (const foe of foes.slice().sort((a, b) => dist(a, me) - dist(b, me)).slice(0, 3)) {
                  await send(me, foe);
                  const until = Date.now() + 3000;
                  while (Date.now() < until) {
                    if (await host.evaluate((a) => document.body.dataset[a] === "1", attr)) return { me, foe };
                    await new Promise((r) => setTimeout(r, 250));
                  }
                }
              }
              throw new Error(`no ${attr} accepted by the host: refusal=${await host.evaluate(() => document.body.dataset.lastRefusal)}`);
            };
            await landed("remoteAttacks", (me, foe) => peer.evaluate(([id, targetId]) => window.__ciAttack(id, targetId), [me.id, foe.id]));
            await landed("remoteCasts", (me, foe) => peer.evaluate(([id, targetId, x, z]) => window.__ciCast(id, 0, targetId, x, z), [me.id, foe.id, foe.x, foe.z]));
            const attacks = await host.evaluate(() => document.body.dataset.remoteAttacks);
            const casts = await host.evaluate(() => document.body.dataset.remoteCasts);
            // Both sides must hold the same unit positions for the host ticks they both logged.
            await new Promise((r) => setTimeout(r, 3000));
            const sent = new Map(await host.evaluate(() => window.__ciSentTicks()));
            const recv = await peer.evaluate(() => window.__ciRecvTicks());
            let matched = 0;
            let mismatched = 0;
            for (const [tick, key] of recv) {
              if (!sent.has(tick)) continue;
              if (sent.get(tick) === key) matched += 1;
              else mismatched += 1;
            }
            if (matched < 20 || mismatched > 0) throw new Error(`wireweave disagreement: matched=${matched} mismatched=${mismatched}`);
            if (errors.length) throw new Error("page errors: " + errors.join(" | "));
            console.log(`browser turn relay ok local=${h.localTypes.join(",")} pairs=${h.pairs.length}/${p.pairs.length} unit=${unit.id} moved=true`);
            console.log(`browser relay commands ok attacks=${attacks} casts=${casts}`);
            console.log(`browser relay agreement ok ticks=${matched}`);
          } finally {
            await browser.close();
          }
          EOF
          node "$RUNNER_TEMP/pw/turn-relay.mjs" | tee "$work/turn-relay.txt"
          grep -qE '^browser turn relay ok local=relay pairs=[1-9][0-9]*/[1-9][0-9]* unit=[0-9]+ moved=true$' "$work/turn-relay.txt"
          grep -qE '^browser relay commands ok attacks=1 casts=1$' "$work/turn-relay.txt"
          grep -qE '^browser relay agreement ok ticks=[2-9][0-9]+$' "$work/turn-relay.txt"

      - name: Show the TURN server and relay logs when the probe fails
        if: failure()
        run: |
          cat "$RUNNER_TEMP/browser-turn-relay/turn.log" || true
          cat "$RUNNER_TEMP/browser-turn-relay/relay.log" || true

  net-client:
    name: "net client: play.html loads play.js through an import map pinned to wireweave"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: play.html imports wireweave from the a71f179 pin and loads play.js as a module
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('js/client/play.html', 'utf8');
          const fail = (why) => { console.error(`net client FAIL ${why}`); process.exit(1); };
          const m = html.match(/<script type="importmap">([\s\S]*?)<\/script>/);
          if (!m) fail('no importmap script');
          const map = JSON.parse(m[1]).imports ?? {};
          const pin = 'https://cdn.jsdelivr.net/gh/AnEntrypoint/wireweave@a71f179cc5352964bc014deea166969938705e61/src/index.js';
          if (map.wireweave !== pin) fail(`wireweave pin is ${map.wireweave}`);
          if (!/<script type="module" src="play\.js"/.test(html)) fail('play.html does not load play.js as a module');
          if (/dist\//.test(html)) fail('play.html references dist/');
          console.log(`net client bundle ok wireweave=a71f179 importmap=${Object.keys(map).length}`);
          JS
          node --check js/client/play.js
