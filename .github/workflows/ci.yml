          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8002/mod-version | grep -q '"version":1' && break; sleep 1; done
          curl -sf http://127.0.0.1:8002/mod-version | grep -q '"version":1'
          cat > "$RUNNER_TEMP/pw/reject.mjs" <<'EOF'
          import { chromium } from "playwright";
          import { writeFileSync } from "fs";
          const modPath = process.argv[2];
          const browser = await chromium.launch({ args: ["--use-angle=swiftshader", "--enable-unsafe-swiftshader"] });
          const page = await browser.newPage({ viewport: { width: 1024, height: 768 } });
          const errors = [];
          const stops = [];
          const applies = [];
          page.on("pageerror", (e) => errors.push(String(e)));
          page.on("console", (m) => {
            if (m.type() !== "error") return;
            if (m.text().startsWith("mod watch stopped")) stops.push(m.text());
            else errors.push(m.text());
          });
          page.on("request", (r) => { if (r.url().includes("map.bin?v=2")) applies.push(r.url()); });
          await page.goto("http://127.0.0.1:8002/site/?rejectReloads=5");
          await page.waitForSelector("body[data-ready='1'], body[data-error]", { timeout: 60000 });
          const error = await page.getAttribute("body", "data-error");
          if (error) throw new Error("page error: " + error);
          await page.waitForSelector("body[data-mod-version='1']", { timeout: 15000 });
          writeFileSync(modPath, 'function on_tick(state)\n  state.ticks = state.ticks + 1\n  state.probe = "v2"\nend\n');
          const deadline = Date.now() + 30000;
          while (stops.length === 0 && Date.now() < deadline) await page.waitForTimeout(250);
          await page.waitForTimeout(4000);
          if (stops.length !== 1) throw new Error("expected one stop line, saw " + stops.length + ": " + JSON.stringify(stops));
          if (!stops[0].includes("after 5 rejected reloads")) throw new Error("stop line names the wrong count: " + stops[0]);
          if (applies.length !== 5) throw new Error("expected 5 applies of map.bin?v=2, saw " + applies.length);
          const kept = await page.getAttribute("body", "data-mod-version");
          if (kept !== "1") throw new Error("data-mod-version moved to " + kept + " after rejected reloads");
          if (!(await page.$("canvas"))) throw new Error("no canvas after rejected reloads");
          if (errors.length) throw new Error("page errors: " + errors.join("\n"));
          console.log("check: five rejected reloads logged one stop line; data-mod-version held at " + kept + "; canvas present");
          await browser.close();
          EOF
          node "$RUNNER_TEMP/pw/reject.mjs" "$mod"

