name: net-ten
on:
  push:
    paths: ['js/wire/**', 'js/client/delta.js', 'js/client/rooms.js', 'js/client/lobby.js', '.github/workflows/net-ten.yml']
  workflow_dispatch:
jobs:
  net-ten:
    name: ten-player wire frames, seating and late join
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ten players round-trip over the wire frame
        run: |
          set -euo pipefail
          cmp js/wire/frame.js js/client/wire/frame.js
          for f in js/client/rooms.js js/client/delta.js js/wire/frame.js js/wire/test.js; do node --check "$f"; done
          node js/wire/test.js | tee net.txt
          grep -Fx 'net ten ok players=10' net.txt
