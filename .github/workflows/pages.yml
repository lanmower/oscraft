name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running deploy and then supersedes it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The page is built from source here, so the published wasm and map always match main.
  # Nothing is committed back to main: the built pkg and maps exist only in this run's site.
  build:
    name: build the page wasm and maps from main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The wasm package and the maps are a pure function of the build sources, so a source-keyed hit
      # restores them and skips the toolchain, the cargo build and wasm-pack. Every artifact is still laid out and uploaded.
      # Two caches, because the two artifacts have different inputs. The wasm depends on the Rust
      # sources alone, so a push that only touches scenario data still hits it and skips wasm-pack;
      # the map images depend on the scenario data as well and are rebuilt by mapexport, which is
      # cheap once rust-cache has restored its build. One cache keyed on both made every scenario
      # push pay for a full wasm build.
      - id: pkg
        uses: actions/cache@v4
        with:
          path: rust/crates/web/site/pkg
          key: page-pkg-v1-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock', 'rust/crates/**', '.github/workflows/pages.yml') }}

      - id: maps
        uses: actions/cache@v4
        with:
          path: |
            scenarios/moba/moba.osdt
            scenarios/duel-routes/duel-routes.osdt
          key: page-maps-v1-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock', 'rust/crates/**', 'scenarios/**') }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.pkg.outputs.cache-hit != 'true' || steps.maps.outputs.cache-hit != 'true'
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        if: steps.pkg.outputs.cache-hit != 'true' || steps.maps.outputs.cache-hit != 'true'
        with:
          workspaces: rust -> target
          shared-key: rust-workspace

      - uses: jetli/wasm-pack-action@v0.4.0
        if: steps.pkg.outputs.cache-hit != 'true'
        with:
          version: v0.15.0

      # Size-optimised, because this is the largest file a player downloads. Measured on this tree
      # before wasm-opt: 2.61 MB default, 2.05 MB with lto and strip alone, 1.72 MB with opt-level=s
      # as well, for about five seconds more build. opt-level=z reaches 1.57 MB but trades hot-loop
      # speed for bytes, and the page runs the sim every tick. Scoped to this step as environment,
      # so no other build in this workflow or in ci.yml sees them.
      - name: Build the page wasm
        if: steps.pkg.outputs.cache-hit != 'true'
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
          CARGO_PROFILE_RELEASE_LTO: true
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: wasm-pack build crates/web --target web --out-dir site/pkg

      - name: Export the maps
        if: steps.maps.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cargo build -p mapexport
          target/debug/mapexport ../scenarios/moba ../scenarios/moba/moba.osdt
          target/debug/mapexport ../scenarios/duel-routes ../scenarios/duel-routes/duel-routes.osdt

      - name: Lay out the site
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site/js
          cp -r js/client _site/js/client
          rm -rf _site/js/client/pkg && cp -r rust/crates/web/site/pkg _site/js/client/pkg
          rm -f _site/js/client/pkg/.gitignore
          cp -r scenarios _site/scenarios
          mkdir -p _site/scenarios/moba/assets/models
          cp rust/crates/web/site/assets/units/*.glb _site/scenarios/moba/assets/models/
          cp -r mods _site/mods
          printf '{"sha":"%s","ref":"%s","run":"%s","built":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/version.json
          cp _site/version.json _site/js/client/version.json
          test -f _site/js/client/editor.html
          test -f _site/version.json
          test -f _site/js/client/play.html
          test -f _site/js/client/play.js
          test -f _site/scenarios/moba/moba.osdt
          printf '<meta http-equiv="refresh" content="0; url=js/client/play.html">\n' > _site/index.html
          test -f _site/js/client/pkg/web.js
          test -f _site/js/client/pkg/web_bg.wasm

      # The moba game as one gzip stream, split into parts no larger than --part-size MiB: a single
      # file tens of megabytes across sits near GitHub's 100 MB per-file ceiling, is too big for the
      # edge cache to hold comfortably, and grows with every model that lands. --build re-runs
      # mapexport so the pack's image matches the source. latest.json names the archive and its parts
      # so a loader can find them without knowing the version.
      - name: Pack the moba game into one archive
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # No --build: the Export step above already wrote scenarios/moba/moba.osdt, and mapexport is deterministic
          # (two runs give the same bytes), so re-running it here only repeats that work.
          node scripts/pack-package.mjs scenarios/moba _site/packs
          node scripts/pack-latest.mjs _site/packs
          test -f _site/packs/latest.json
          cat _site/packs/latest.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # The same tree, kept under its own name so the deploy job can compare the live URL with exactly what was built.
      - uses: actions/upload-artifact@v4
        with:
          name: site-expected
          path: _site
          retention-days: 1

  deploy:
    name: publish the built page to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          sparse-checkout: scripts/observe

      - uses: actions/download-artifact@v4
        with:
          name: site-expected
          path: expected

      # Pages caches for minutes after a deploy; compare.mjs retries with a bounded backoff, then prints the table and fails.
      - name: Compare the live page with the build
        run: node scripts/observe/compare.mjs expected "${{ steps.deployment.outputs.page_url }}" --expect-sha "${{ github.sha }}" --attempts 6 --backoff 10

  # Witness for first draw on the built site: the same artifact the deploy publishes, timed in headless Chromium.
  # Runs beside the deploy and does not gate it; a red run here is a perf regression to fix, not a deploy failure.
  first-draw:
    name: first draw of the built page
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/perf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned Playwright and Chromium
        run: |
          set -euo pipefail
          npm install --prefix scripts/perf --no-save playwright@1.47.2
          npx --yes playwright@1.47.2 install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: site-expected
          path: site
      - name: Time the first frame of the built page
        run: node scripts/perf/first-draw.mjs site --loads=3 --ceiling-ms=10000
