name: pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the page wasm and maps from main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - id: pkg
        uses: actions/cache@v4
        with:
          path: rust/crates/web/site/pkg
          key: page-pkg-v2-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock', 'rust/rust-toolchain.toml', 'rust/crates/**', '.github/workflows/pages.yml') }}

      - id: maps
        uses: actions/cache@v4
        with:
          path: |
            scenarios/moba/moba.osdt
            scenarios/duel-routes/duel-routes.osdt
          key: page-maps-v2-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock', 'rust/rust-toolchain.toml', 'rust/crates/**', 'scenarios/**') }}

      - name: Install the pinned Rust toolchain
        if: steps.pkg.outputs.cache-hit != 'true' || steps.maps.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2
        if: steps.pkg.outputs.cache-hit != 'true' || steps.maps.outputs.cache-hit != 'true'
        with:
          workspaces: rust -> target
          shared-key: rust-workspace

      - uses: jetli/wasm-pack-action@v0.4.0
        if: steps.pkg.outputs.cache-hit != 'true'
        with:
          version: v0.15.0

      - name: Build the page wasm
        if: steps.pkg.outputs.cache-hit != 'true'
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
          CARGO_PROFILE_RELEASE_LTO: true
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: wasm-pack build crates/web --target web --out-dir site/pkg

      - name: Export the maps
        if: steps.maps.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cargo build -p mapexport
          target/debug/mapexport ../scenarios/moba ../scenarios/moba/moba.osdt
          target/debug/mapexport ../scenarios/duel-routes ../scenarios/duel-routes/duel-routes.osdt

      - name: Install the pinned toktx and Pillow
        run: |
          set -euo pipefail
          ktx_dir="$RUNNER_TEMP/ktx"
          mkdir -p "$ktx_dir"
          curl -fsSL -o "$ktx_dir/ktx.tar.bz2" https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.tar.bz2
          echo "c6b08c817f8c8dd299deccae4f2fbb8d55e9acd2  $ktx_dir/ktx.tar.bz2" | sha1sum -c -
          tar -xjf "$ktx_dir/ktx.tar.bz2" -C "$ktx_dir"
          echo "$ktx_dir/KTX-Software-4.4.2-Linux-x86_64/bin" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/atlas-python"
          "$RUNNER_TEMP/atlas-python/bin/pip" install --quiet pillow==13.0.0
          echo "PYTHON=$RUNNER_TEMP/atlas-python/bin/python" >> "$GITHUB_ENV"
      - name: Lay out the site
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash scripts/layout-site.sh _site "$GITHUB_REF_NAME" "$GITHUB_RUN_ID"
          du -sk _site
          cat _site/packs/latest.json

      - name: Bundle the client JS into one file
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          npx --yes esbuild@0.25.0 _site/js/client/play.js --bundle --format=esm --splitting --outdir=_site/js/client --entry-names=play.bundle --chunk-names=chunk-[hash] --external:./pkg/* --external:./vendor/* --external:wireweave --external:wireweave/* --external:nostr-tools --external:xstate --external:node:*
          du -sk _site/js/client/play.bundle.js
          sed -i 's|<script type="module" src="play.js"></script>|<script type="module" src="play.bundle.js"></script>|' _site/js/client/play.html
          grep -q 'src="play.bundle.js"' _site/js/client/play.html

      - name: Bundle the moba Lua modules into one file
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          node scripts/bundle-lua.mjs scenarios/moba _site/scenarios/moba/bundle/moba.modules.lua

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/upload-artifact@v4
        with:
          name: site-expected
          path: _site
          retention-days: 1

  gate-static:
    name: static client checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-modulepreload.mjs
      - run: node scenarios/moba/tools/check-fx.mjs

  deploy:
    name: publish the built page to GitHub Pages
    needs: [build, gate-static]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          sparse-checkout: scripts/observe

      - uses: actions/download-artifact@v4
        with:
          name: site-expected
          path: expected

      - name: Compare the live page with the build
        run: node scripts/observe/compare.mjs expected "${{ steps.deployment.outputs.page_url }}" --expect-sha "${{ github.sha }}" --attempts 6 --backoff 10

