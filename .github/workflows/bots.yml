name: bots
on:
  push:
    paths: ['mods/bot_*.lua', 'rust/crates/mod-host/**', 'rust/crates/sim/**', 'scenarios/moba/**', '.github/workflows/bots.yml']
  workflow_dispatch:
jobs:
  bots:
    name: ten Lua bots play a moba match
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: rust-workspace
      - name: Ten bots in all ten slots under mod_check
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p mod-host --bin mod_check
          cat ../mods/bot_lib.lua ../mods/bot_hero.lua > bots.lua
          target/debug/mod_check --fog off ../scenarios/moba bots.lua 1200 > bots.txt 2>&1 || { cat bots.txt; exit 1; }
          cat bots.txt
          grep -Eq '^mod-check ok ' bots.txt
          line=$(grep -E '^mod-state heroes=10 kills=[1-9][0-9]* ' bots.txt)
          kills=$(echo "$line" | sed -E 's/.* kills=([0-9]+).*/\1/')
          echo "bots ok heroes=10 kills=$kills"
      - name: 'Bot witness: walks its lane, last-hits a creep, retreats at low health'
        shell: bash
        run: |
          set -euo pipefail
          cat ../mods/bot_lib.lua ../mods/bot_hero.lua ../mods/bot_probe.lua > bots_probe.lua
          target/debug/mod_check --fog off ../scenarios/moba bots_probe.lua 240 > probe.txt 2>&1 || { cat probe.txt; exit 1; }
          cat probe.txt
          grep -Eq '^mod-check ok ' probe.txt
          state=$(grep -E '^mod-state ' probe.txt)
          for key in walks attacks kills retreats probe_spawned; do
            echo "$state" | grep -Eq " $key=[1-9]" || { echo "bot witness: $key not set"; exit 1; }
          done
          echo "bot witness ok: $state"
