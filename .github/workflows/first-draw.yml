name: first-draw

on:
  workflow_run:
    workflows: [pages]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: first-draw
  cancel-in-progress: true

jobs:
  first-draw:
    name: first draw of the built page
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/perf
            scripts/dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: playwright
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            scripts/perf/node_modules
          key: playwright-v1-${{ runner.os }}-1.47.2
      - name: Install the pinned Playwright and Chromium
        if: steps.playwright.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          npm install --prefix scripts/perf --no-save playwright@1.47.2
          npx --yes playwright@1.47.2 install --with-deps chromium
      - name: Download the page built by the pages run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id="${{ github.event.workflow_run.id }}"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list -R "$GITHUB_REPOSITORY" -w pages.yml -b main -s success -L 1 --json databaseId -q '.[0].databaseId')
          fi
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n site-expected -D site
      - name: Time the first frame of the built page
        run: node scripts/perf/first-draw.mjs site --loads=3 --ceiling-ms=10000
