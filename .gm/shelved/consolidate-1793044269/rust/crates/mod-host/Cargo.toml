[package]
name = "mod-host"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = ["build", "piccolo"]
build = ["dep:osdt-data"]
piccolo = ["dep:piccolo", "dep:serde_json"]
fault-injection = []

[[bin]]
name = "mod_check"
path = "src/bin/mod_check.rs"
required-features = ["build", "piccolo"]

[[bin]]
name = "parity_hash"
path = "src/bin/parity_hash.rs"
required-features = ["build", "piccolo"]

[dependencies]
piccolo = { version = "0.3.3", optional = true }
serde_json = { version = "1", optional = true }
sim = { path = "../sim" }
osdt-data = { path = "../data", optional = true }
