id: DADA_CRIT_USE_KRUG-trav-hud-client-DADA_CRIT_USE_KRUG-1
subject: Allied units draw the enemy-red health bar, so a teammate reads as hostile at first sight
description: 'js/client/hud.js:104 colours a unit bar green only when u.player === localPlayer(); every other unit, including an allied hero, gets #e53935 (enemy red). js/client/ui_minimap.js:124 already separates allies with teamOf(teams, u.player) === myTeam, so the minimap and the bars disagree about the same unit. Principle: Krug, a HUD control or readout must be obvious at first use without thinking. Evidence: codesearch literal ''#e53935'' over js/client/hud.js (dispatch 1792858467784-4519-10f2c7dc433ef1df) returned hud.js:104; fs_read ui_minimap.js:116-132 (dispatch 1792858468019-4520-b156cce4fd3c7669) shows the ally test at line 124. Caveat: js/client is 4 ahead and 9 behind upstream 2d3cc5769e9c; stale_tree, so upstream tip is unchecked.'
acceptance_criteria: In a team match, an allied non-local unit's bar uses a different colour from an enemy's, and the bar colour rule uses the same team test as the minimap (teamOf). Close stale only with a live refutation on the working tree or upstream tip showing this already holds.
witness_plan: codesearch literal '#e53935' over js/client/hud.js after reconciling to upstream; in a live two-team match read the bar fill for an allied unit and an enemy unit and confirm they differ.
