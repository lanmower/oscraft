id: lobby-modal-reemitted-every-refresh-flashes-hero-grid
subject: 'Lobby hero grid flashes and clicks miss: the lobby modal is re-emitted on every refresh timer tick'
description: 'User report: the GUI keeps flashing, which makes clicking a hero in hero selection hard. Cause: scenarios/moba/panels.lua refresh() (around line 1250) calls emit_all() every REFRESH_TICKS ticks through game.timer("panels", 1, refresh, REFRESH_TICKS). emit_all() emits lobby_tree() as the modal every time, whether the lobby changed or not, so the client tears down and rebuilds the hero grid under the cursor. Fix: keep a fingerprint of everything lobby_tree reads (LOBBY slots owner, hero, ready, bot; host; started; worldReady; LOBBY.error; the roster count; OPEN state if it is shown in the modal) and emit the lobby modal only when the fingerprint differs from the last one sent; the other panels keep their behaviour. Acceptance: a lobby with no change sends no lobby modal event between changes (count the lobby emits over 10 s of idle); a hero pick, claim or ready still updates the grid at once; CI green on ci and pages; no Lua error (main has gone red from panels.lua before). Ownership: scenarios/moba/panels.lua only.'
