notes:
- ts: 2026-10-25T16:20:45.027Z
  session_id: heroes-inv-1
  note: 'heroes-inv-1: published the 133 Dota 2 ability icons (commit 61e09211, CC0 placeholders, ABILITY-SOURCES-DOTA2.tsv). The 6.88g icons for ids that have no ability row yet are NOT published: origin commit 7df47a60 already ships icons for all 501 live ability ids, and shipping icons without rows would add unreferenced files. These icons follow their rows in heroes-688g-ability-rows-missing.'
- ts: 2026-10-26T21:08:33.172Z
  session_id: drain-icons-688g-art-r2
  note: 'drain-icons-688g-art-r2: 6.88g ability icon PIXELS are not obtainable in this workspace. Evidence: (1) no 6.88g map archive, MPQ or BLP exists under /workspace/oscraft or /workspace/hy3d; the only .w3x on disk is a 937-byte file inside hy3d/tools/w3x2lni (witness 1793048874381-3380-7e3f1ce35b70a662). The 6.88g material present is war3map.j, war3map.w3e/.doo/.wtg/.wct and the LNI text export g688-lni/ability.ini. (2) ability.ini carries icon NAME strings only (Art = ReplaceableTextures\CommandButtons\BTN...), no pixels. (3) the route this row names, content-item-icons-hy3d-replace, is itself still pending and unproven; icons/ITEM-SOURCES.tsv already records ''6.88g item art is not in the repo: UNVERIFIED''. (4) pixels would need a download of a third-party 6.88g map mirror (epicwar.com, wc3maps.com) and extraction of Blizzard-derived art: a redistribution decision for the owner, and no BLP decoder exists here. Wired what IS obtainable: icons/ABILITY-SOURCES.tsv records per icon file the shipped CC0 pack source, its status, and the exact 6.88g icon name for the 291 of 634 ids a 6.88g ability covers (619 PLACEHOLDER, 15 UNKNOWN, 0 GAP). No art invented. Row premise refuted: replacement via the hy3d item-icon route has no source art behind it.'
