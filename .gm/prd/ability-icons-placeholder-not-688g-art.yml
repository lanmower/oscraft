id: ability-icons-placeholder-not-688g-art
subject: Hero ability icons are CC0 placeholders, not 6.88g art
description: 'Ability icons under scenarios/moba/assets/icons/abilities/ for hero skills are placeholder CC0 art (freegameassets.com Fantasy RPG Icons) picked by name, recorded in ABILITY-SOURCES.tsv and ABILITY-SOURCES-DOTA2.tsv with status PLACEHOLDER. The 6.88g source icon plan (/workspace/hy3d/output/688g-data/abil2-icons-plan.tsv) names fga sources, not 6.88g BLP art. Replacement needs 6.88g icon art extracted from the reference map, same route as content-item-icons-hy3d-replace. Acceptance: every ability icon for the 127 heroes derives from 6.88g art or a named public source, with the source tracked per file.'
