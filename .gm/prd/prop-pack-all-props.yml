id: prop-pack-all-props
subject: 'Prop pack: every prop kind the moba map places, as one content-hashed cacheable pack'
description: 'Build a single props pack (model and texture bytes plus a byte-range index per prop kind) the same way as the character and item packs in scripts/assets/build-packs.mjs. Scope: every prop kind placed by the moba map, from scenarios/moba doodad-types-688g.tsv, doodad-types-w3.tsv, doodads-688g.tsv, doodads-w3.tsv and doodad-assets.tsv, with its model, texture and variation. Kinds with no model file are listed as missing, not guessed. Output: scenarios/moba/assets/packs/props.<sha256[:16]>.bin and an index entry in scenarios/moba/assets/packs/index.json. Cache key content-hashed from pack bytes. Naming uses prop from the start (a lane renames doodad to prop, row rename-doodad-to-prop). Work in scratch clone /config/tmp/prop-pack; publish with publish_on_origin.'
acceptance_criteria: Pack built by scripts/assets/build-packs.mjs; index.json lists every placed prop kind with byte range; every indexed kind resolves to bytes in the pack; total size and cache key reported; kinds without a model listed with reasons; commit by lanmower with no Co-Authored-By; ci-status green on the pushed full sha.
witness_plan: Read-back check of every index entry against the pack bytes (dispatch id from a verify- session), then ci-status on the pushed sha.
