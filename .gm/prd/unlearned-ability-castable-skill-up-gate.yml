id: unlearned-ability-castable-skill-up-gate
subject: 'An ability that is not learned can be cast: check the skill-up gate in the sim and the controls'
description: 'From hy3d''s live check: one cast went through for an ability that had not been learned, so skill_up may not gate casts. Check the sim (rust/crates/sim: the cast path and the ability level check) and the mod''s cast call (scenarios/moba/controls.lua, targeting.lua). Expected: a cast at level 0 is refused with a typed reason (ability not learned) and the cast does not start. Fix at the gate that is missing. Ownership: rust/crates/sim cast path and scenarios/moba/controls.lua or targeting.lua (only the gate). Acceptance: a level-0 cast is refused in a native test or a CI check (no new test file: use the existing parity or sim check), CI green on ci, tests (on demand workflow) and pages; the state hash for existing scenarios is unchanged unless the gate changes a recorded cast (say which).'
