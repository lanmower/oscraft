  note: 'drain-hy3d-findings-14 (cause found, live): cast_index (rust/crates/sim/src/rules.rs:254-334) refuses NotLearned only when ability.skill is Some and rank is 0; spell.rs:1316 treats a skill-less ability as learned by design. At origin 71707fd8, 76 abilities referenced by unit abilities lists or hero_abilities have no skill(...) row (scan dispatch 1792930518851-5316-943babcf73690a40, session verify-unlearned-ability-castable-skill-up-gate; e.g. windrunner_powershot, tinker_laser, warlock_shadow_word, plus talents and glyph_of_fortification and courier_deliver). Their level-0 casts pass the sim gate: this is the real gameplay bug. Fix options: (a) give each hero ability its 6.88g skill row so the existing gate refuses it (data, conversion lane; UNVERIFIED where 6.88g is silent); (b) a sim learnable flag for skill-less hero abilities (sim change; base abilities such as courier_deliver and talents rely on skill-less = learned, so the flag must be per ability). Witness: a level-0 refusal of one listed ability in a CI check (no local build, no browser). Not closed this run: the fix needs a sim change that the CI gate must witness.'
