subject: 'Trees: close the 6.88g gaps left after destructible trees landed (Timber Chain damage and range, Tango and Quelling Blade ward target, per-site move clear radius, state version record)'
description: 'From hy3d''s gap list (docs/CONVERGENCE_688G.md:362). The original premise (trees not destructible, no alive flag, no regrow in state or hash, no kill or restore, no temporary blockers) is refuted at upstream 5b1d68fe33bd: Obstacle.alive/until/temp (rust/crates/sim/src/obstacles.rs:15-17), kill_tree and restore_tree, add_blocker and remove_blocker, tick_obstacles regrow deferred by tree_guard, TREE cell bit via cover_cells, obstacles hashed (rust/crates/sim/src/hash.rs:149-155) and saved (persist.rs:491-492), STATE_VERSION 64 (persist.rs:7), natives tree_kill and tree_restore (rust/crates/mod-host/src/piccolo_host.rs:1598, 1606), scenarios/moba/trees.lua with 300 s regrow, 450 s for the first 20, guard 175, chain pull, and blockers for Sprout, Ironwood, Fissure and Ice Shards. Receipts: .gm/receipts/proposed-destructible-trees/01-orient.md to 03-eliminate.md. Still open: (1) Timber Chain damage and the 250 range talent (trees.lua chain() pulls only); (2) Tango and Quelling Blade ward target (none in trees.lua); (3) per-site clear radius for the 57 hy .osd move effects (only the global 75-unit rule at trees.lua:34); (4) the STATE_VERSION 63 to 64 record lives only in .gm/pool/runs.jsonl, not in the tree. Not open: slot reuse, since push_obstacle reuses a dead temporary slot (obstacles.rs:74); the convergence doc and provenance/trees.lua.tsv said otherwise. Owner: hy3d. Proposed, not approved; a hashed or saved layout change bumps STATE_VERSION and says so in the commit body.'
acceptance_criteria: 'Each open gap above either lands with its 6.88g source cited in the commit body and CI green on the pushed sha, or is refused in this row with its named reason. Cut and regrow per 6.88g are already met by existing code and need no change. Any hashed or saved tree layout change bumps STATE_VERSION and says so in the commit body. Native and wasm state-hash parity (CI pages and tests) agrees on the pushed sha. Owner: hy3d.'
