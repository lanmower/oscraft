id: prop-models-failed-to-fetch-on-load
subject: On the live page, 27 prop models fail with 'Failed to fetch' on load (towers, barracks, fountain, rocks, trees, courier, stall, and others)
description: 'Pasted by the user from the last load. The asset-errors list names only prop models: tower-t4-skinned, tower-t2-skinned, barracks-melee-skinned, tower-t3-skinned, barracks-ranged-skinned, tower-hexagon-base, courier-skinned, fountain-skinned, pillar-obelisk, rock-skinned, tall-tree-skinned, stall, campfire-stand-skinned, cart-high-skinned, catwalk-junction-skinned, coffin-skinned, crypt-skinned, debris-wood-skinned, fence-skinned, fish-skinned, grass-large-skinned, grave-skinned, iron-fence-border-gate-skinned, patch-dirt-skinned, rocks-skinned, rocks-low. No hero model is listed. The files exist in the tree (scenarios/moba/assets/models/<name>.glb, checked on the 6d8e7388 checkout). ''Failed to fetch'' is a network-level failure, not a 404: the likely causes are many prop fetches started at once on one HTTP/2 connection (the server resets streams; compare the earlier row pages-moba-glb-http2-protocol-error), or the prop kick-off running before the decoders (model-loads-order-decoders-selected-background). Candidate cause to check first: the prop model kick-off in play.js (loadDoodadModels) starts all kinds at once. Acceptance: on the live page after deploy, the asset-errors list is empty, and the prop fetches run with a concurrency cap and retry once on a network error. Witness: a browser load with console on, read the asset errors, and CI green on the pushed sha.'
