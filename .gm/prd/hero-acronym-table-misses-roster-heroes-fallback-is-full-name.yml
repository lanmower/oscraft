id: hero-acronym-table-misses-roster-heroes-fallback-is-full-name
subject: Acronym table covers 69 heroes; any other roster hero shows its full name (acronym() falls back to name)
description: 'From the user: scrolling down the lobby grid shows many acronyms longer than 3 letters. Cause: scenarios/moba/panels.lua acronym(name) returns UI.heroAcronyms[name] or HERO_ACRONYM_RULE[name] or name; HERO_ACRONYM_RULE holds 69 names but the roster (player-controlled kinds in units_heroes.osd and units.osd) is larger, and the mod VM has no string library to shorten a name at run time, so the fallback shows the full name. Fix: (1) scenarios/moba/tools/gen-hero-acronyms.mjs reads every roster hero name and writes scenarios/moba/hero_acronyms.lua (a table name -> acronym), rule: word initials (hyphens split, apostrophes dropped); if more than 3, drop the stop words of and the, then truncate to 3; one-word names keep their first 3 letters; heroAcronyms overrides in moba_ui.json win; collisions are resolved deterministically (the later name gets a distinct 3-letter form, e.g. first letter of the first word plus first two letters of the second) and listed in the commit body for the user to review; (2) panels.lua requires hero_acronyms.lua (and scenarios/moba/manifest.json modules lists it: check-fx.mjs fails otherwise; remember the pack-load test only follows a literal require) and acronym() has no fallback to the full name (an unknown name returns its first 3 letters via a precomputed table or a short marker, never the full name); (3) scripts/check-acronyms.mjs (row hero-acronym-ci-guard-max-three-letters, in flight) also fails when a roster hero has no entry. Acceptance: every roster hero has a unique acronym of 1 to 3 letters, ci and pages green (watch for a Lua error: main has gone red from panels.lua before); screenshot after deploy shows no tile with a long label while scrolling. Ownership: scenarios/moba/panels.lua, hero_acronyms.lua (new), tools/gen-hero-acronyms.mjs (new), moba_ui.json heroAcronyms, manifest.json modules.'
