id: lobby-start-world-ready-never-fires-headful
subject: Start match stays disabled when worldReady never fires in headful Chrome
description: 'The panels drain could not start a match with Start enabled: worldReady never fired in headful Chrome, so Start stayed disabled. The lobby gates Start on the world-ready promise, and that promise may depend on requestAnimationFrame, which background or hidden tabs throttle. If so, a player on a hidden tab is stuck the same way. Hypothesis to verify, not a confirmed cause. Located in js/client/play.js near main''s build3d await and the world-ready promise, and the Start gate in scenarios/moba/panels.lua.'
acceptance_criteria: Start enables once the world is ready in both a foreground and a background headful tab, with no dependency on frame callbacks alone.
witness_plan: Open two headful tabs, put one in the background, and confirm Start enables in both once the world is ready. Run from a session other than the resolver.
