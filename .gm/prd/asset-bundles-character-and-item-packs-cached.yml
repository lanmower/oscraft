id: asset-bundles-character-and-item-packs-cached
subject: 'Bundle stable assets: one character pack per hero (icon, sounds, skill icons) and one item pack, content-hashed and cached across deploys'
description: 'From the user: these assets change rarely, so bundle them and cache them across update cycles so they are not reloaded during development. Design (default, state it on the row): (1) a build step (scripts/assets/build-packs.mjs, run in the pages workflow) writes one character pack per hero: scenarios/moba/assets/packs/character/<hero>.<hash>.bin holding that hero''s icon, its sound entries and its skill icon definitions; and one item pack items.<hash>.bin holding every item icon. Each pack has a manifest entry with its sha256. (2) the page loads a pack by its hashed name, so a pack whose contents did not change keeps its URL and is served from the browser cache; a changed pack gets a new name. A loose-file fallback stays for the dev server. (3) lobby hero icons, sounds and item icons read from the packs (the widget image path resolves through the pack; panels.lua and play.js keep the same keys). Pages sets its own cache headers, so the cache works through the hashed names, not through header control. Ownership: scripts/assets/build-packs.mjs (new), .github/workflows/pages.yml (the build step only), js/client/play.js and widgets.js (the resolver only), scripts/dev/stage.sh. Acceptance: a first load fetches each pack once; a second load fetches no pack body (served from cache, 304 or cache hit: check the network summary); a change to one hero''s icon changes only that hero''s pack name; CI green on ci and pages; the first-draw median is noise, never change the ceiling. Witness: a browser load twice, the network summary showing cached packs on the second load.'
