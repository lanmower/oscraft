id: panels-hero-primary-688g-rows-missing
subject: HERO_PRIMARY in panels.lua has 69 of 127 heroes; 55 heroes with a 6.88g primary attribute are shown as group 0
description: 'scenarios/moba/panels.lua HERO_PRIMARY is a copy of heroes_688g.tsv column 4, but only 69 heroes have a row. At origin/main bb2f5bfa8a the TSV has 127 heroes: 69 present rows agree with the TSV exactly (Lua value = TSV value + 1, Lua 1 strength, 2 agility, 3 intelligence; TSV 0 strength, 1 agility, 2 intelligence), 55 heroes with TSV 0-2 are missing, and 3 heroes (abaddon, furion, visage) have TSV 3, which the three-column scheme cannot express. A hero without a row is group 0 and shown as UNVERIFIED, so the lobby marks 55 heroes UNVERIFIED although 6.88g gives their primary. The four heroes hy3d named (dazzle, nyx_assassin, techies, wisp) are among the 55. Mapping for the 55: dazzle 3, nyx_assassin 2, techies 3, wisp 1. Owner question: the three TSV=3 heroes stay group 0 until the user says what group 3 means in this UI (universal or a fourth column). This row does not decide it.'
acceptance_criteria: 'HERO_PRIMARY holds one row per hero in heroes_688g.tsv for every TSV value 0-2, each equal to TSV+1, with the 69 existing rows unchanged. The three TSV=3 heroes are left at group 0 with a comment that names their 6.88g value. The lobby shows no 6.88g-valued hero as UNVERIFIED for its primary. Witness: ci-status green on the pushed sha, and a browser lobby look that reads the group for dazzle and wisp.'
