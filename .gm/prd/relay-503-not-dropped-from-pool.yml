id: relay-503-not-dropped-from-pool
subject: A Nostr relay returning 503 stays in the pool, retried on every load, instead of being dropped and logged
description: 'The live page logs `WebSocket wss://relay.damus.io/ failed ... Unexpected response code: 503` on loads and keeps the relay in the pool. Separate from the loading stall: timing (note on lobby-disabled-when-one-relay-503, dispatch 1792871329132-5152-edc260b58d28747a) shows the stall is texture loading in buildSplat, not the relay. Make a relay that fails its handshake drop out of the pool with one log line, so one failed relay never blocks the page. Related row: lobby-disabled-when-one-relay-503.'
acceptance_criteria: With relay.damus.io returning 503, the pool drops it, logs one line naming the relay and the failure, and the page boot path does not wait on it.
witness_plan: Load the page with one relay failing; confirm one drop log line and that boot proceeds. Run from a session other than the resolver.
