id: gm-prd-close-names-verbs-the-build-lacks
subject: prd-close demands publish_on_origin, which this runner build does not register
description: 'prd-close on moba-damage-table-not-in-manifest refused with error_code close_commit_required and told this session to commit the close with publish_on_origin, a verb this build answers with unknown_verb. The same is true for prd-reference and prd-references, which prd-close itself names as the way to fill the references gate. Three unknown_verb answers in one row: the served gate names verbs the running build does not register, so no row can be closed through the gate on this machine.'
acceptance_criteria: Either the build registers publish_on_origin and prd-references so prd-close accepts a close, or the gate falls back to a pushed commit whose body carries Row, Witness and Status, and prd-close documents that fallback.
note: 'Filed by orch-main-r1: row moba-damage-table-not-in-manifest is witnessed, published as 662afbee and recorded in a closure commit a6e4810c, and still cannot close.'
