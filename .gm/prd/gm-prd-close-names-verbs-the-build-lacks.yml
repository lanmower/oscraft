- ts: 2026-10-31T20:05:57.422Z
  session_id: orch-main-r1
  note: 'Correction after the fact: prd-close does work on this build once three things are in place, none of which is publish_on_origin. (1) the row file carries a references entry, (2) a commit made with git_commit {message: <Row/Witness/Status trailers>, paths:[row file]} and then git_push {rev} is in the store''s log, (3) prd-close is called with status: resolved alongside resolution, witness_evidence, witness_dispatch_id. prd-reference/prd-references are still unknown_verb, so the references entry was written into the row file directly. Row moba-damage-table-not-in-manifest closed at 2026-10-31T20:04:46.144Z by that path.'
