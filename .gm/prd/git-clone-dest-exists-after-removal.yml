id: git-clone-dest-exists-after-removal
subject: git-clone reports dest_exists for a dest removed just before the call
description: 'After rm -rf of /config/tmp/prop-pack (confirmed absent by ls, dispatch 1792952196873), git-clone with dest prop-pack returned dest_exists (dispatch 1792952197975); an earlier call (1792952162474) after a rm reported the same. The verb''s existence check does not see the removal. Route: check the verb''s dest existence test in gm-mcp.'
