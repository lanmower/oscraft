id: layout-site-skip-packs-guard-before-build
subject: scripts/layout-site.sh runs build-packs before the SKIP_PACKS guard, so a skipped-pack stage still needs toktx
description: 'scripts/layout-site.sh calls build-packs.mjs before checking SKIP_PACKS, so `SKIP_PACKS=1 scripts/dev/stage.sh` exits 1 when toktx (KTX-Software) is absent. Fix: move the SKIP_PACKS guard ahead of the build-packs call so a skipped-pack stage never needs toktx. Acceptance: SKIP_PACKS=1 stage completes on a host without toktx; the full stage path is unchanged; CI green on the pushed sha.'
