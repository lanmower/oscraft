id: FALLACIES-trav-minimap-camera-1
subject: Minimap drag restarts the camera glide on every pointer event, so the camera trails the pointer and lands about 0.4 s after release
description: 'Fact: js/client/ui_minimap.js:191-193 calls centreAt on every pointermove while pressed; centreAt (ui_minimap.js:175-184) calls centre once per event. REDRAW_MS (ui_minimap.js:18, 160) throttles only the paint. js/client/hud.js:71 sends each as send("camera_to"); in a joined session sendInput broadcasts each action (js/client/play.js:249-253). scenarios/moba/controls.lua:561-562 calls game.camera with centreSeconds 0.4 (controls.lua:42), which the native binding turns into a ui camera event (rust/crates/mod-host/src/piccolo_host.rs:2165-2169). js/client/modui.js:157 replaces the glide with {from: current target, to: pointer point, elapsed: 0}, so each event discards the previous glide''s progress. modui.js:170-172, driven per frame by play.js:2805, applies easeInOut (modui.js:21, quadratic ease-in), so each event closes only 2*(dt/0.4)^2 of the remaining gap: about 0.35% at 60 events/s and 3% at 20 events/s. A sustained drag therefore leaves the camera trailing with a time constant of about 286 events (4.8 s at 60 events/s), and it reaches the pointer only about 0.4 s after release. Witness dispatches: pointermove 1792859238697-6232-931c8c957f053659; camera_to 1792859124128-6137-f94b9b0315d105a; centreSeconds 1792859245717-6239-b9826f102c576f67; easeInOut 1792859252562-6252-69be874194b56add; move assignment 1792859255224-6254-b691e18e2d3ecd81; sendInput 1792859154058-6168-ef135f16331e10a1; game.camera 1792859138984-6156-924f60a3237b58b3. Rival cause, not separated by code reading alone: round-trip latency would delay the glide but would not flatten its per-event progress; the witness_plan probe separates them.'
acceptance_criteria: During a sustained minimap drag the camera target stays within 1 map unit of the pointer's map point after 0.2 s; each pointermove sends at most one camera_to per REDRAW_MS interval; a single click still glides over centreSeconds.
witness_plan: 'Live probe in a running page: drive a 60 Hz minimap drag and log the camera target against the pointer each frame. Before the fix the lag settles near 286 events of travel; after the fix it stays within 1 map unit. A probe that feeds camera events at 60 Hz into modui''s camera handler and step with seconds 0.4 separates the per-event restart from round-trip latency.'
