id: fx-cast-rules
subject: Compose cast, travel, impact and linger effects from the ability signature in effects.lua
description: 'scenarios/moba/effects.lua on_cast(caster, ability_name) looks up ability_fx.lua and emits a composed sequence; moba_ui.json gets the new kinds and school colours. The generic cast_ring/cast_burst/spell_orb path stays as the fallback for an ability with no signature. CONTRACT (shared by all fx rows). Event params are game.effect(kind,x,y,{source,target,colour,duration,scale,text,name,value}); duration is MILLISECONDS (0=kind default), scale is thousandths (0=1000). Kinds live in moba_ui.json effects.kinds; each kind''s renderer is one of the existing ring|burst|float|flash|projectile|flag or the new: beam{colour,width,seconds,segments,jitter,flicker} (source anchor to target anchor or point; both ends follow units); column{colour,r,height,seconds,grow}; nova{colour,r0,r1,spokes,seconds,spin}; aura{colour,r,rise,motes,seconds,pulse} (follows unit target else source for duration ms); zone{colour,r,seconds,spokes,spin,motes} (ground decal at point); orbit{colour,count,r,height,speed,seconds}; spiral{colour,turns,height,motes,seconds}; cone{colour,length,angle,count,seconds}; projectile gains optional trail{count,seconds} and size. School colour names in effects.colours: fire frost lightning nature shadow holy arcane poison blood earth wind physical. Signature table scenarios/moba/ability_fx.lua returns {[ability_name]={school,form,size,speed,dur,hits}} with form in bolt|beam|chain|nova|zone|column|aura|cone|summon|blink|orbit|spiral. Constraints: pooled fixed-capacity renderers, no per-frame allocation; Lua per-tick work minimal and no table.sort in the sandbox. Work in the scratch clone /workspace/oscraft-fx-scratch, publish with publish_on_origin (repo_dir the clone, cwd /workspace/oscraft); re-read moba_ui.json from origin right before editing (another lane edits heroAcronyms in it).'
