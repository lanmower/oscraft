id: first-draw-defer-assets-not-needed-for-first-frame
subject: 'First draw transfers about 30 MB gzipped: defer what the first frame does not need'
description: 'Evidence: the pages first-draw gate fails or sits at the 10000 ms ceiling on identical trees (medians 5835, 9352, 9790, 10759, 10852, 10923, 11332 ms); the infra lane (drain-infra-9, f11e823e added per-file output to scripts/perf/first-draw.mjs) found each CI load transfers about 30 MB gzipped; AGENTS memory: the wasm is the bottleneck and big fetches alongside it slow first draw; the user asked earlier whether most assets can be lazy loaded. Task: read the per-file output of the first-draw job on the newest pages run (gh run view --log), list what is fetched before the first frame and its bytes, and defer everything the first frame does not need: hero models other than those being drawn (load a model when a hero is readied or in view), voices and sfx, the icon sets until the lobby opens, map layers not in view, large JSON used only after the match starts. Start the wasm fetch first and serial before bulk assets (serial beats parallel here). Do not change the 10000 ms ceiling or the gate. Ownership: js/client/play.js loader code, js/client/render3d.js model loading, play.html preload hints (the modulepreload checker must stay green). Acceptance: the first-draw job median drops by at least 2 s on the pushed sha across two pages runs, with the lobby and match still loading assets on demand (world-ready still fires; no new 404 or console error in a browser look). Witness: pages first-draw job medians from two runs plus a browser lane look. NOTES (drain-firstdraw-11): pushed cd85d6d7 (fog view created before build3d, play.js only). CI pages run 40183575740 (cd85d6d7): first-draw 12358 9292 9048 ms, median 9292, 21.8-22.8 MB transferred per load, 281-283 requests; before (run 40182314656, c2ba9675): median 11326, 30.5 MB, 289 requests. LOCAL (site built from the cd85d6d7 archive with the CI wasm flags, scripts/layout-site.sh, first-draw timing via a /tmp instrument; system chromium 155 on the ANGLE path lost its GL context, so the legacy swiftshader flag was used): baseline 14337 14967 15283 ms, median 14967. All 288 requests finish by about 1.4 s, so the local first-draw wait is CPU, not transfer. Fog is on (getState fog=true). Before the first frame, 30 glb (9.0 MB) are fetched: the three unit models melee-creep, ranged-creep and tender plus arrow, and about 26 scenery kinds (tower, barracks, base, trees, rocks, courier), because loadDoodadModels maps every placed kind at build3d start, not in the deferred pass; roshan was not fetched locally, so the four-model question is answered by unit-type visibility, not by fog being off. EXPERIMENT E1 (JS only, the doodad kick-off moved into deferUntilDrawn): first draw 4343 4408 3319 ms, median 4343; worldBuilt=1, all 1787 doodads placed by 15 s, no page error. Patch /tmp/fd11/e1.patch (dry run clean against origin/main play.js). NOT PUBLISHED: the shared checkout play.js has 62 changed lines from other lanes, so publish_on_origin from the shared tree would sweep them in, and a scratch-clone push is off limits. Lane-sync flag: shared checkout 378 dirty entries and 44 commits behind origin. Bundle split and content-hashed names: not done, the local run shows no transfer gain to chase. PARKED (coordinator): E1 waits for the sync lane. Checked at the time of parking: shared checkout 379 dirty, 48 behind origin/main, play.js 56 insertions and 6 deletions from other writers. When synced: apply E1 through publish_on_origin from the shared checkout (explicit path js/client/play.js), read ci-status for ci and pages on the full sha, and add the CI first-draw medians here with the local run. Ceiling stays 10000 ms.'
