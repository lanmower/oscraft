id: lobby-model-preview-widget
subject: 'Widgets: a model kind that shows a portrait until its model is loaded, then a 3D preview; updates on oscraft:model-loaded without rebuilding the lobby'
description: 'From the user: show each loaded model in the UI, for the local pick and for the other players'' picks, as soon as it is loaded. Design: a generic model widget kind in js/client/widgets.js (name by what it shows; no genre names). It takes a model name and a portrait src; it draws the portrait until window event oscraft:model-loaded arrives for that model (see lobby-preload-picked-models-and-announce), then mounts a small WebGL preview (reuse render3d''s mesh build for a parsed model; add the preview to js/client/render3d.js). It updates its own canvas only, so the lobby does not rebuild (the flashing fix lobby-modal-reemitted-every-refresh-flashes-hero-grid depends on this). Ownership: js/client/widgets.js and js/client/render3d.js. Then scenarios/moba/panels.lua hero card and seat cards use the kind, after the flashing row publishes (re-read origin first; another lane is editing panels.lua). Acceptance: CI green on ci and pages; a picked hero shows its portrait then its 3D preview; other seats show theirs when loaded; no full lobby re-render on load (witness in the browser lane).'
