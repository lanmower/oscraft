id: ui-widget-button-label-overridden-by-tip
subject: Buttons with a tip get aria-label = tip, so the accessible name drops the visible text
description: 'js/client/widgets.js:271. Symptom: a screen reader hears ''level up this ability'' not ''+'', ''choose this talent'' for every talent button; breaks label-in-name (WCAG 2.5.3). Acceptance: aria-label starts with the visible text, or the tip goes to aria-description/title. Witness: accessibility tree read of a skills button.'
