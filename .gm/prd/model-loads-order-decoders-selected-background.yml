id: model-loads-order-decoders-selected-background
subject: 'Model loads: decoders first, selected heroes next, speculative roster loads last in background'
description: 'User report: model loads queue before basis and meshopt, and speculative roster loads are not held behind selected models. Required order: (1) basis KTX2 transcoder and meshopt decoders finish init before any model load starts; (2) a seat''s selected hero model and its textures load at top priority, and while any selected model is pending no other model load starts and queued speculative loads are held; (3) during selection the rest of the roster loads in the background at lowest priority, starting only after decoders and selected models are done; (4) after selection, remaining models keep loading in background at lowest priority, never ahead of a selected model or a decoder; (5) no model fetch runs alongside the wasm load or delays first draw (scripts/perf/first-draw.mjs unchanged or better). Code sites: js/client/play.js (loadModels, preloadModel, preloadReadyHeroes, lobby pick path, doodad/prop model kick-off), js/client/render3d.js (model loading queue), js/client/decoders.js and js/client/texture.js (decoder init). Verify in browser with gm browser verbs, console on, CDP cache disabled; log request order under .gm/model-order/; no click on any pack, Start, Fill or Claim element; no room joins.'
acceptance_criteria: Measured request order shows basis and meshopt decoders first, then the selected model, then speculative models; no speculative request in flight while a selected model is pending; first-draw numbers unchanged or better; CI green on the pushed sha.
witness_plan: browser order log and screenshot under .gm/model-order/ plus ci-status on the pushed full sha
