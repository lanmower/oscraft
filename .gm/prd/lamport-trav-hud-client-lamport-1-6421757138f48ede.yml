id: LAMPORT-trav-hud-client-LAMPORT-1
subject: After a hud.js hot reload the HUD minimap runs the pre-edit ui_minimap.js code, so the final state depends on edit order
description: 'Fact. js/client/hud.js:61 createMinimap is called through the static import of ui_minimap.js, which resolves to the base module instance. js/client/hmr.js:24-27 re-imports a changed module with ?v= and does not rebind importers, so the base instance stays on pre-edit code. ui_minimap.js:202-204 hmrReload returns createMinimap from the new instance, and hud.js:74-77 takes that value. But hud.js:146-149 hmrReload rebuilds the whole HUD through createHud (hud.js:38), which calls createMinimap again from the base instance and replaces the hot-updated minimap. Result: a ui_minimap.js edit followed by a hud.js edit leaves the old minimap code live; the reverse order ends correct. Causal-order defect: a later update applies an older module version. Related but distinct: SLAP-trav-minimap-camera-1 (listener stacking on the same canvas).'
acceptance_criteria: After a ui_minimap.js hot update followed by a hud.js hot update, the minimap in use is the new ui_minimap.js code, the same as the reverse edit order. The rebuilt HUD does not take its minimap from the base import once hud.js has been hot-reloaded.
witness_plan: 'Live localhost page with ?hmr: add a visible marker to the minimap draw in ui_minimap.js, save it, then save hud.js; the marker must still show. Repeat in reverse order. Codesearch js/client/hud.js for the createMinimap call that the fix changes, with the dispatch id.'
