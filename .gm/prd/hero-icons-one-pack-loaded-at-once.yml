id: hero-icons-one-pack-loaded-at-once
subject: One hero icon pack loaded at once so the lobby hero grid renders without per-hero requests
description: Hero icons (127, scenarios/moba/assets/icons/heroes, resolved per hero by the lobby model name in panels.lua) move out of the per-hero character packs into one content-hashed pack heroes-icons.<sha256[:16]>.bin indexed in packs/index.json. Character packs keep sounds and skill icons; their cache keys change (expected). The client fetches the hero icon pack once before the lobby hero grid renders (play.js packImageUrl / pack index read); other packs stay lazy. Measure requests and bytes before the lobby shows heroes from a gm browser load (console on, CDP cache disabled, headful; never click any element whose text contains pack, never Start, Fill or Claim, never join rooms); screenshot and numbers under .gm/heroicon-pack/.
acceptance_criteria: scripts/assets/build-packs.mjs emits heroes-icons.<sha256[:16]>.bin containing all 127 hero icons and indexes it in scenarios/moba/assets/packs/index.json; character packs no longer contain hero icons; js/client/play.js waits for the one icon pack before the lobby hero grid, other packs lazy; built-page smoke still finds 127 hero icons; CI green on the full pushed sha; before/after request and byte counts and screenshot recorded under .gm/heroicon-pack/. Commit body states the cache key change.
witness_plan: Browser load via gm browser verb (console on, CDP cache disabled, headful) counting requests and bytes before the lobby shows heroes; ci-status on the pushed full sha.
