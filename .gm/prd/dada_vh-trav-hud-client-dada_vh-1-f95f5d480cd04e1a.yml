id: DADA_VH-trav-hud-client-DADA_VH-1
subject: 'World unit bars ignore selection: the selected unit''s health bar is drawn the same as every other unit''s'
description: 'Surface: js/client/hud.js. Principle DADA_VH (visual hierarchy, Arnheim/Dondis): the most important element should be the dominant one. drawBars (hud.js:85-109) draws every unit''s health bar at the same BAR_WIDTH_PX=20 by BAR_HEIGHT_PX=3 (hud.js:11-12), coloured only by ownership (hud.js:104). The selected unit is a parameter (hud.js:38) and is read only for the minimap (hud.js:66) and the selection count publish (hud.js:136); drawBars never reads it. The unit the player is acting on therefore carries no more weight on the map than any creep bar. Distinct from DADA_CRAP-trav-minimap-camera-1 (minimap fill) and DADA_CRIT_USE_KRUG-trav-hud-client-DADA_CRIT_USE_KRUG-1 (bar colour).'
acceptance_criteria: A selected unit's world health bar is drawn larger, heavier or with a distinct marker than an unselected unit's bar at the same zoom, inside drawBars.
witness_plan: codesearch literal 'selected' on js/client/hud.js shows a read inside drawBars; a live browser capture with one unit selected shows its bar distinct from a creep bar in the same frame.
