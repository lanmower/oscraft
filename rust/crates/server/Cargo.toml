[package]
name = "server"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "oscraftd"
path = "src/main.rs"

[dependencies]
sim = { path = "../sim" }
mod-host = { path = "../mod-host" }

[features]
default = ["server-tests"]
# Tests that load game data through the server's mod loader. The web crate includes replay.rs without this feature.
server-tests = []
