[package]
name = "oscraft-wasip2"
version = "0.1.0"
edition = "2021"
description = "The deterministic sim as a wasip2 component (WIT world sim-component) and a native host that instantiates it and runs one tick"
publish = false

# Its own workspace root: rust/Cargo.toml excludes this crate, so the native check job never compiles wasmtime.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "oscraft-wasip2-host"
path = "src/host.rs"

# The mod runtime (mlua, vendored Lua 5.4) is off by default: vendored Lua does not build for wasm32-wasip2.
[features]
mod = ["dep:mod-host"]

[dependencies]
sim = { path = "../sim" }
mod-host = { path = "../mod-host", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "=0.41.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "=1.0.104"
osdt-data = { path = "../data" }
wasmtime = { version = "=27.0.0", features = ["component-model"] }
wasmtime-wasi = "=27.0.0"