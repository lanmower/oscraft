[package]
name = "oscraft-wasip1"
version = "0.1.0"
edition = "2021"
description = "The deterministic sim as a wasip1 guest driven over stdin and stdout, and a native host that runs it under wasmtime"
publish = false

# Its own workspace root: rust/Cargo.toml excludes this crate, so the native check job never builds wasmtime.
[workspace]

[lib]
name = "wasip1_guest"
path = "src/lib.rs"

[[bin]]
name = "oscraft_wasip1"
path = "src/main.rs"

[dependencies]
sim = { path = "../sim" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "=1.0.104"
osdt-data = { path = "../data" }
wasmtime = "=27.0.0"
wasmtime-wasi = "=27.0.0"
