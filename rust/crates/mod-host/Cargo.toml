[package]
name = "mod-host"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = ["build", "piccolo"]
# Builds OSDT images from .osd sources; the wasip3 guest turns it off to keep starlark out of wasm.
build = ["dep:osdt-data"]
# The mod VM: piccolo, pure Rust. The native host and the wasip3 guest both run mods on it.
piccolo = ["dep:piccolo"]

[[bin]]
name = "mod_check"
path = "src/bin/mod_check.rs"
required-features = ["build", "piccolo"]

[dependencies]
piccolo = { version = "0.3.3", optional = true }
sim = { path = "../sim" }
osdt-data = { path = "../data", optional = true }
