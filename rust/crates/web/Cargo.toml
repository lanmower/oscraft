[package]
name = "web"
version = "0.1.0"
edition = "2021"
description = "Browser build of the deterministic sim: a wasm-bindgen Game over sim::load"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Test build only: a mod whose source has `-- wasip3-fault: panic at <tick>` traps the wasm at that sim tick. Off by default.
fault-injection = ["mod-host/fault-injection"]

[dependencies]
sim = { path = "../sim" }
replay = { path = "../replay" }
# The mod VM (piccolo, pure Rust) runs the pack's Lua in the page's sim; the page always has it.
mod-host = { path = "../mod-host", default-features = false, features = ["piccolo"] }
serde_json = "1"
wasm-bindgen = "0.2"

# piccolo's hash maps seed through getrandom; the browser supplies entropy from JS.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

# wasm-pack runs wasm-opt with -O alone, and that validator refuses the bulk-memory instructions
# (memory.copy, memory.fill) LLVM emits once the release profile is size-optimised in pages.yml:
# "Bulk memory operations require bulk memory [--enable-bulk-memory]". Every browser that runs this
# page has supported bulk memory for years, so only the validator needs telling. The args replace
# wasm-pack's defaults, which is why -O is repeated here.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-sign-ext", "--enable-mutable-globals", "--enable-nontrapping-float-to-int"]

