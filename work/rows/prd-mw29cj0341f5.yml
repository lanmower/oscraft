title: "Non-item panel trees rebuild every refresh: gate them on a sim-side state version"
body: "Split from prd-perfluaperticksettersblockerdrainf1 (deleted, git keeps it). The item-generation signal exists (game.unit_item_gen, piccolo_host.rs, Sim::item_generation in inventory.rs) and upgrades.lua and inventory_tree_cached already gate on it, so the item parts are done. Still open: emit_all in scenarios/moba/panels.lua (about lines 1933-1947, REFRESH_TICKS = 4) rebuilds the hud, team, skills, select and other trees on every refresh, because those depend on game state that has no version. Acceptance: a sim-side state counter (not hashed unless its effect is hashed; decide and say so in the commit body) that the mod reads, and each non-item tree is re-emitted only when its inputs change. Targeting (targeting.lua 141-158) is not gated: it depends on positions, so an item gate would change strike timing. Witness: a mod-host probe that counts tree rebuilds per tick with the counter unchanged (zero) and changed (one)."
status: "open"
