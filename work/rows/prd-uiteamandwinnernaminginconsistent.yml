body: "id: ui-team-and-winner-naming-inconsistent\nsubject: Team is Team A/B in the lobby, Team 0/1 on the scoreboard and 'side N wins' at the end; win panel has no action\ndescription: 'scenarios/moba/panels.lua:269 win_tree (prefix side + raw index), :1023,1074 lobby teamNames, scoreboard teamLabel + side; moba_ui.json text.winner/teamLabel. Symptom: one team has three names; end screen is text rows only with no leave/back-to-lobby control and raw P0 ids. Acceptance: one team-name source (UI.text) used by all three; win panel names the team and offers a return/leave button via a ui call. Witness: finish match, #win shows the lobby team name and a button.'\nsession_id: survey-ui-8\nowner: survey-ui-8\nstatus: pending\nnotes:\n- ts: 2026-10-25T09:01:05.716Z\n  session_id: drain-ui-panels-9\n  note: 'claimed by drain-ui-panels-9. Pushed ae39ed17: scoreboard and end screen use the lobby team name (team_name). Open: the win panel still has no return/leave button (no existing return-to-lobby call) and the witness needs a finished match in a browser.'\n- ts: 2026-10-25T09:20:55.625Z\n  session_id: drain-panels-10\n  note: claimed by drain-panels-10\n- ts: 2026-10-25T09:42:42.686Z\n  session_id: drain-panels-10\n  note: 'win panel still lacks a return/leave button: no return-to-lobby call exists in controls/panels; open'\n- ts: 2026-10-25T20:48:41.091Z\n  session_id: hud-match-1\n  note: 'Lobby witnessed: after-item4 shots show The Sentinel / The Scourge (verify-ui-team-and-winner-naming-inconsistent, dispatch 1792958961921-5284-488fc090c6dcd07f). Done in scratch: one name source (moba_ui.json lobby.teamNames from 6.88g wts 17/18), win panel Close button (win_close). Open: win and scoreboard witness. Blocker: no live match is reachable in a browser without Claim, Fill, Start or a room join; the owner allows those witness routes.'\n- ts: 2026-10-25T21:14:47.128Z\n  session_id: hud-match-1\n  note: 'Published b2682bdd on origin/main (scenarios/moba/panels.lua, scenarios/moba/moba_ui.json). CI on that sha: static client checks success; build the page wasm and maps and built page smoke fail the same way as the parent 1d7f2547 (pre-existing, row ci-red-mapexport-lycan-wolf-1-on-main). Row stays open until its in-match witness.'\n- ts: 2026-10-26T05:26:55.004Z\n  session_id: hud-match-witness\n  note: 'The lobby names read The Sentinel and The Scourge (earlier witness 1792958961921-5284-488fc090c6dcd07f). Open: the win panel was not reached in the hud-match-witness run.'\n- ts: 2026-11-01T10:19:09.815Z\n  session_id: gm-drain-1793526214-7\n  note: 'blocked_by: ui-team-and-winner-naming-inconsistent-blocker-gm-drain-1793526214-7 (session gm-drain-1793526214-7). Blocker: (1) in-match witness needs a finished match; the owner allows the Claim/Fill/Start/room join witness routes. (2) panels.lua unreachable from mod_check (dispatch 1793528345718 not run; live probe .gm/scratch/probe-panels-reach.lua -> load-error unknown_module: panels). (3) browser lease held by gm-drain-1793526214-15 (dispatch 1793528212490-1679). Open unknowns: ui-team-win-leave-call, ui-team-win-lobby-after-end-started, ui-team-win-button-semantics (owner: return/leave vs win_close dismiss). Receipts 01-03 in .gm/receipts/ui-team-and-winner-naming-inconsistent/. Clause 1 (one team-name source) is met on the tree at panels.lua:155-157, 264, 772, 1307.'\n"
