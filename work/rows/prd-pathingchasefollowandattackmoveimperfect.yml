body: "id: pathing-chase-follow-and-attack-move-imperfect\nsubject: Pathfinding, chasing, following and attack-move are imperfect\ndescription: 'Unit movement is reported imperfect: path finding, chasing and following a unit, and a-click (attack-move) on both a hero and the ground, where attack-move should engage everything encountered. The behaviour should match the 6.88g reference.'\nacceptance_criteria: A unit paths around obstacles to its ordered destination, a chase follows the target until in range, a follow keeps station on the target, and an attack-move order engages every enemy it meets on the way, on both hero and ground targets.\nwitness_plan: Run the moba scenario, order a move past an obstacle, a chase, a follow and an attack-move on a hero and on ground, and read the unit's path and engagement each tick.\nsession_id: mcp-codemode-56806-1793170367691-23\nowner: mcp-codemode-56806-1793170367691-23\nstatus: pending\n"
