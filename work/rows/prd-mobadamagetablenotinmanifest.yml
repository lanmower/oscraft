body: "id: moba-damage-table-not-in-manifest\nsubject: scenarios/moba/damage_table.osd is tracked but not listed in manifest.json\ndescription: 'scenarios/moba/damage_table.osd declares every damage_factor(attack type, size, Q16) row for the pack, but scenarios/moba/manifest.json data does not list it, so mapexport and the loader never read it: the moba catalog ships zero DMGF rows while rust/crates/sim/src/combat.rs reads catalog.damage_factors. Same defect class as ci-red-mapexport-lycan-wolf-1-on-main (a data file absent from the manifest). Deciding this needs the 6.88g damage table: either list the file in manifest.json data (it changes the map image, so the gate and any balance reference must be re-read) or delete it as a stale reference table. Owner: scenarios/moba/manifest.json and scenarios/moba/damage_table.osd.'\nsession_id: drain-lycan-wolf-r2\nowner: drain-lycan-wolf-r2\nstatus: pending\nreferences:\n- ts: 2026-10-31T19:55:47.275Z\n  session_id: orch-main-r1\n  note:\n    \\\"url\\\":\\\"https://github.com/lanmower/oscraft/blob/main/scenarios/moba/damage_table.osd\\\": null\n    \\\"repo\\\":\\\"lanmower/oscraft\\\": null\n    \\\"path\\\":\\\"scenarios/moba/damage_table.osd\\\": null\n    \\\"sha\\\":\\\"662afbee8e925f051d02ec661d9e4d9f4a43a92b\\\": null\n    \\\"why\\\":\\\"The DMGF source now listed last in manifest data; combat.rs reads catalog.damage_factors.\\\": null\n    \\\"license\\\":\\\"unknown\\\": null\nnotes:\n- ts: 2026-10-31T20:01:47.416Z\n  session_id: orch-main-r1\n  note: 'Closing witness carried by the publish commit: exec_js 1793476264633-1665-b858152df41976d8 plus ci-status success on 662afbee (run 41236136801).'\n"
