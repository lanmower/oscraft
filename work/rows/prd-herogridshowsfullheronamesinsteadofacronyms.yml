id: "prd-herogridshowsfullheronamesinsteadofacronyms"
kind: "prd"
title: "The fullscreen hero selection shows full hero names and its icons have no acronym backing"
body: "id: hero-grid-shows-full-hero-names-instead-of-acronyms\nsubject: The fullscreen hero selection shows full hero names and its icons have no acronym backing\ndescription: The new fullscreen hero selection (js/client/gui_flow.js) renders each hero's full name and a bare portrait. The old hero selection gives every icon the same background acronym block, and the roster should be identified by that acronym everywhere, including the model file names. Full hero names must not appear anywhere in the selection UI or in model names.\nacceptance_criteria: Hero cards in the fullscreen selection show the same acronym-backed portrait treatment as the old hero selection, models are named by acronym, and no full hero name appears in the selection UI or model names.\nwitness_plan: Load the local mirror of the page, open the hero selection, and read the card text and icon elements; then list the model directory for full-name files.\nsession_id: mcp-codemode-56806-1793170367691-23\nowner: mcp-codemode-56806-1793170367691-23\nstatus: pending\nnotes:\n- ts: 2026-11-02T10:12:15.769Z\n  session_id: mcp-codemode-389565-1793614335663-136\n  note: 'Remaining: the fullscreen grid (js/client/gui_flow.js) still renders hero.name text and a bare img (no badge), unlike panels.lua hero_tile which carries a badge from hero_acronyms.lua. The row also requires roster model files renamed to acronyms (scenarios/moba/assets/models/*.glb, assets/assets.json, units_heroes.osd model column, gen-heroes.mjs and icon/voice manifests), so it spans scripts/assets and the Lua generator, beyond this lane. No partial UI-only change made.'\n"
status: "open"
createdAt: "2026-10-28T18:42:02.000Z"
