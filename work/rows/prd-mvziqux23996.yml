title: "Wire the hit, cast, death, ui and ambient sound names to their game events"
body: "The sound set is in scenarios/moba/assets/sounds (commit ab70cf84): hit_flesh_1..3, hit_metal_1..2, cast_arcane_1..2, cast_fire_1, cast_nature_1, death_1..2, ui_click, ui_confirm, ui_error, ui_buy, ui_levelup, ambient_wind, ambient_forest (seamless 6 s loops), horn. All are OGG Vorbis, mono 22.05 kHz, original procedural synthesis (CREDITS.tsv rows).\nToday only announce_sounds.lua calls game.sound, and its names are firstblood..rampage, horn. No client or Lua code calls the new names.\nacceptance: each hit, cast, death and ui name has a call site (sim event to game.sound, or a client play call in js/client/audio.js or play.js); the two ambient names have a looping play path, since createSfx plays one-shot.\nwitness: a moba match with the sound names logged at their call sites, and a browser check that the sound loads (no \"Could not load\" error from js/client/audio.js)."
