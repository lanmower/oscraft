title: "Nil on a set key in mod tables can panic the next grow and disable the courier module"
body: "id: mod-nil-on-set-key-table-panic\nsubject: Assigning nil to a set key in a mod table can panic the next grow and disable the module\ndescription: 'AGENTS.md (Lua mod host): never assign nil to a key already set in a mod table; piccolo keeps the dead key and the next grow panics. 64 such assignments exist in scenarios/moba, among them courier.lua move_marks (added in f1c3a9eb), stop_visit, store.lua couriers, deliveries and courier.errand. A panic in a hook disables that module for the rest of the match, which looks like the owner report (courier neither follows nor returns, PRD prd-mw1aoodrc8a9). The courier probes never grow the table after a clear, so they cannot see it.'\nacceptance_criteria: (1) A mod-host test shows the panic on a set key cleared with nil followed by growth, quoted. (2) courier.lua, store.lua and the courier path use false and if-entry tests instead of nil on set keys, with iteration unchanged. (3) A courier probe clears and regrows the courier tables (many errands, stop visits, couriers) and the courier still follows its hero; no mod_hook_failed in the log. (4) The sim tests, courier_probe and pathing_probe results are unchanged or better.\nwitness_plan: Quote the mod-host panic test, the courier probe lines before and after, and the courier_probe and pathing_probe results.\nstatus: pending\n"
