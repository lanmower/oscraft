title: "The hero grid offers the opposing team's heroes in a normal match"
body: "id: hero-grid-lists-the-other-teams-heroes\nsubject: The hero grid offers the opposing team's heroes in a normal match\ndescription: After a team is chosen, the fullscreen hero grid still lists heroes the other team holds, so heroes that are not pickable in a normal match can be selected. The grid must offer only what the chosen team may pick.\nacceptance_criteria: With a team chosen, the grid contains no hero held by the other team, and picking a hero not available to the team is impossible.\nwitness_plan: Open the hero selection on the local mirror, read the card list with both teams holding heroes, and confirm no opposing hero is present.\nsession_id: mcp-codemode-56806-1793170367691-23\nowner: mcp-codemode-56806-1793170367691-23\nstatus: pending\nNo public references: the defect and its fix are internal to the oscraft client; no external URL applies.\nreferences:\n- ts: 2026-11-02T10:09:24.819Z\n  session_id: mcp-codemode-389565-1793614154484-106\n  note: '{\"url\":\"https://github.com/lanmower/oscraft/commit/53d27340c9e6ae8e777c5654e454edfb4ccb82bb\",\"repo\":\"\",\"path\":\"\",\"sha\":\"\",\"why\":\"The flow commit added the team filter (passesFilter/takenBy) that removes held heroes from the hero grid.\",\"license\":\"unknown\"}'\n"
