body: "id: portraits-badge-snap-to-top\nsubject: 'Portrait badge: snap the acronym to the top of the tile, icons occupy the bottom'\ndescription: 'From the user: the acronym badge should sit at the top of the tile because the icon occupies the bottom. Today (159d02fd, widgets.js portraits kind) the badge is centred behind the icon. Change: anchor the badge to the top edge of the tile, horizontally centred, in capitals, sized to fit the tile width (three letters must not clip), the icon drawn at the bottom and not overlapping the badge. Keep the optional badge/text/tone fields and the no-badge rendering unchanged. Ownership: js/client/widgets.js only. Acceptance: CI green on the pushed sha; screenshot of the lobby grid shows badges at the top of every tile. Witness: browser lane screenshot after deploy.'\nsession_id: mcp-codemode-3036736-1792921154020-1\nowner: mcp-codemode-3036736-1792921154020-1\nstatus: pending\nnotes:\n- ts: 2026-10-25T09:44:57.232Z\n  session_id: drain-badge-top-10\n  note: 'published c9896529d37d; ci and pages green. Open: screenshot witness left to the browser lane.'\n- ts: 2026-10-25T19:23:23.296Z\n  session_id: hud-lobby-1\n  note: 'hud-lobby-1 blocker: witness needs a mounted lobby. The local dev loop (scratch /config/tmp/hud-lobby at b56fa72f, dev server http://localhost:45591) does not mount #ui-modal on load within 40 s; the witness routes (join, pack buttons, Claim, Fill, Start) are allowed by the owner. Browser lane dispatches 1792955959231-44 and 1792956064072-54: 0 .w-portrait, 0 .w-region, 0 .w-model. Row stays open.'\n"
