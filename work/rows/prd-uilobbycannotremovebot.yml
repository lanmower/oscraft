body: "id: ui-lobby-cannot-remove-bot\nsubject: Host cannot remove a bot or kick a seat once filled\ndescription: 'scenarios/moba/panels.lua:705 release requires s.owner == owner; bot owner is ''bot:N''; lobby_seat (:~960) draws no button for others'' seats. Symptom: Fill with bots is irreversible, a stuck or absent human seat cannot be freed. Acceptance: host-only ''remove'' on a bot/other seat, with not-host refusal for others. Witness: fill, remove one bot, seat shows open.'\nsession_id: survey-ui-8\nowner: survey-ui-8\nstatus: pending\nnotes:\n- ts: 2026-10-25T09:01:08.195Z\n  session_id: drain-ui-panels-9\n  note: 'claimed by drain-ui-panels-9. Pushed ae39ed17: host-only remove call and Remove button. Open pending ci-status green and a browser witness (fill, remove one bot).'\n- ts: 2026-10-25T09:20:52.396Z\n  session_id: drain-panels-10\n  note: claimed by drain-panels-10\n- ts: 2026-10-25T09:42:51.048Z\n  session_id: drain-panels-10\n  note: remove call and button on origin (panels.lua:778,1109); ci green; browser witness remains\n- ts: 2026-10-25T19:23:35.679Z\n  session_id: hud-lobby-1\n  note: 'hud-lobby-1 blocker: witness needs a mounted lobby. The local dev loop (scratch /config/tmp/hud-lobby at b56fa72f, dev server http://localhost:45591) does not mount #ui-modal on load within 40 s; the witness routes (join, pack buttons, Claim, Fill, Start) are allowed by the owner. Browser lane dispatches 1792955959231-44 and 1792956064072-54: 0 .w-portrait, 0 .w-region, 0 .w-model. Row stays open.'\n- ts: 2026-11-01T10:16:22.269Z\n  session_id: gm-drain-1793526214-9\n  note: 'blocked_by: witness-instrument. Acceptance A1 (host-only remove branch) and A2 (not-host refusal) pass on origin/main b8897bf5 (panels.lua:941-943, 1257-1258; dispatches 1793528146807-4091-3cf4c195f6872c86, 1793528165832-4113-1cb932350793e4e8). A3 witness (fill, remove one bot, seat shows open) cannot run: no live gpu-free driver dispatches ui remove (dispatches 1793528108493-4044-c4988611cdcaa4c8, 1793528109741-4047-b916891cfd4e80be). The driver would be a remove case in rust/crates/mod-host/tests/panels_route.rs or lobby_claim.rs; the gm-drain-1793526214-9 worker may not create or edit test files. Row stays pending until that driver lands and the witness runs on a pushed sha.'\nreferences:\n- ts: 2026-10-26T05:23:29.486Z\n  session_id: hud-match-witness\n  note: '{\"url\":\"https://github.com/lanmower/oscraft/blob/main/scenarios/moba/panels.lua\",\"repo\":\"\",\"path\":\"\",\"sha\":\"\",\"why\":\"The lobby remove call and its Remove button, the fix this row witnesses.\",\"license\":\"unknown\"}'\n"
