title: "Game phase: arrow keys always reach the game and game UI is not HTML-selectable or keyboard-focusable"
body: "In body[data-phase=live] an arrow key goes to the hero input (play.js keysDown via game_focus.js capture handler) whatever element has focus, unless the target is a text entry; it never moves focus, scrolls a panel or activates a control. Every game UI root has computed user-select none (play.html); no text selection on click or drag in the game; no focus ring on game controls; every focusable element except the chat input has tabindex -1 so Tab cannot land on it. Witness: a playwriter page on a local live match focuses each HUD control, presses ArrowLeft and ArrowDown, the hero sim position changes and document.activeElement does not; computed user-select of each root is none; the focusable list is only the chat input; node static check of play.html passes."
