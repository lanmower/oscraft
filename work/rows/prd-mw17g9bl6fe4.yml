body: "id: lock-view-to-hero-arrows\nsubject: Lock view on the local hero, arrow keys move the hero\ndescription: 'Add a lock toggle next to Centre on hero (#centre-hero, play.html). While locked the camera target follows the local hero every frame. In locked view the arrow keys move the local hero: the direction is camera-relative and issues a move order that repeats while the key is held. Pan (minimap click, drag-pan, camera_to) releases the lock; yaw, pitch and zoom keep it.'\nacceptance_criteria: The lock button toggles a visible pressed state. While locked, the camera stays on the hero across ticks. Each arrow key sends the local hero a move in the camera-relative direction. Unlocked, arrow keys keep their current meaning.\nwitness_plan: Probe the lock state and the arrow-to-move mapping with a node test on the input module, and read the emitted commands.\nstatus: pending\n"
