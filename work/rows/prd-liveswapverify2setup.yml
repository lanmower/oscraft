id: "prd-liveswapverify2setup"
kind: "prd"
title: "Live two-page swap check blocked: no match starts on the Pages build"
body: "id: live-swap-verify-2-setup\nsubject: 'Live two-page swap check blocked: no match starts on the Pages build'\ndescription: 'Step 1 (setup) failed. Newest main 475445fd: Pages run 39594...-failure, wasm build fails in crates/sim (27 errors, e.g. spell.rs:943 no method is_hero on Sim, spell.rs:1315 no apply_hero_stats), so the site is not redeployed. The live site is still b06cbc98 (run 39594792302, success). On that build the host lobby reads start failed: pack moba: no asset grass, because tiles.js SPLAT_TEXTURES expects top-level keys grass/dirt while manifest.json nests them under assets.textures; 475445fd fixes the key names but is not deployable. Result: the match never starts, so hero dots, tick sync and the data swap steps could not run. Host page: https://lanmower.github.io/oscraft/js/client/play.html?host=1#moba. Screenshot: /tmp/live-swap-host-lobby.png.'\nacceptance_criteria: Pages run for the newest main sha succeeds; host lobby starts the moba match (no start failed); both pages show 5/5 hero dots; swap tick equal on both pages with matching getState hash and unit count.\nwitness_plan: Re-run the live two-tab swap check after the Pages deploy of the newest main sha.\nsession_id: live-swap-verify-2\nowner: live-swap-verify-2\nstatus: pending\nnotes:\n- ts: 2026-10-25T04:06:09.684Z\n  session_id: drain-net-3\n  note: 'Route decision (drain-net-3): the swap is dev-only. Pages serves no /__hmr (fetch dispatch 1792901163071-5025-d226e792370fc878: GitHub Pages 404 for https://lanmower.github.io/oscraft/__hmr); announceSwap and queuePackSwaps are fed only by the oscraft:hmr event (hmr.js:23,89,110), so the live site has no swap trigger. Origin tip 77168a44 is CI success (run 40154918568) and pages success (run 40154918557). The witness runs on a dev origin (scripts/dev/serve.mjs) built from origin tip, once lobby-start-world-ready-never-fires-headful lands (a fresh host cannot start a match). Blocked; no witness.'\n- ts: 2026-11-01T15:56:09.757Z\n  session_id: gm-drain-1793526214-56\n  note: 'blocked_by: toktx-missing-stage-build (gm-drain-1793526214-56). Dev origin stage (SKIP_PACKS=1 scripts/dev/stage.sh) exits 1 on main e56dd0b6: scripts/layout-site.sh runs scripts/assets/build-packs.mjs before its SKIP_PACKS guard; buildAtlas (build-packs.mjs:89) spawns toktx, ENOENT. Live checks: command -v toktx -> NO_TOKTX (dispatch 1793548457279-5177-e5d965fd459c7f93); no toktx under /usr/bin, /opt/ktx/bin, /usr/local/bin, /snap/bin, ~/.local/bin (dispatch 1793548507088-5236-105728ddd699eee5). No serve.mjs origin, no browser run, no witness. Stage log /tmp/drain56-stage.log. Side effect: stage rewrote scenarios/moba/moba.osdt and scenarios/duel-routes/duel-routes.osdt (uncommitted in shared checkout). Clearing action: owner installs KTX-Software toktx on this host (or approves it), or decides build-packs sits behind SKIP_PACKS; then re-run this row from a session other than the resolver. Also friction: gm-skill list mode throws ReferenceError roots; served gm bundle 0.2.380 vs installed 0.2.386 (MCP restart needed).'\n- ts: 2026-11-01T16:00:45.800Z\n  session_id: gm-drain-1793526214-57\n  note: 'Blocked before the swap run (session gm-drain-1793526214-57, dev stage on 9174c60b). SKIP_PACKS=1 scripts/dev/stage.sh exits 0 and serves, but the host page logs ''[play] start failed: sim::load: Range(\"AXTN flags\")'' (sim/src/spell.rs:181). Cause: stage keeps the existing .dev-site wasm (rust/crates/web/site/pkg/web_bg.wasm, mtime 2026-10-30) while moba.osdt is regenerated from current data sources (rust/crates/data/src/format.rs mtime 2026-11-01 04:43Z). Fix needs WASM=1 (wasm-pack rebuild), excluded by this worker''s no-build brief. No swap dispatch was run; no witness id exists.'\n- ts: 2026-11-01T17:14:00.258Z\n  session_id: gm-drain-1793526214-57\n  note: 'Swap witness not run (session gm-drain-1793526214-57). Orchestrator-directed CI artifact route: site-expected of run 41323735240 (cb670a81, built 2026-11-01T15:59Z) downloaded to /tmp/gm-57-site/41323735240 (moba.osdt 941680 bytes, matches regenerated data) and served with serve.mjs --staged-only; the served wasm sha matches the artifact. Blocker: the shared gm browser. The chrome verb binds one tab per session and rebinds to the newest tab created in the shared browser, and other lanes create, navigate and reset tabs in the same browser (tabs navigated to 127.0.0.1:8741 by other lanes, browser pid replaced twice). A two-tab run through one binding could not hold a host and a peer tab. Needs an owner or orchestrator decision: a dedicated browser profile for this row, or a serialized browser window.'\n- ts: 2026-11-01T17:18:46.171Z\n  session_id: gm-drain-1793526214-57\n  note: 'Rerun blocked (session gm-drain-1793526214-57). Per the browser answer: isolated sessions row-live-swap-host and row-live-swap-peer, each with isolated=true, served from the CI artifact 41323735240 (cb670a81) via serve.mjs --staged-only. Both pages load and the host hosts, but neither can start a match: the browser has no WebGL at all (getContext webgl and webgl2 return null in host and peer contexts, renderer null), so the peer logs ''start failed: WebGL2 is required''. Chromium runs with --use-vulkan --ignore-gpu-blocklist and no --enable-unsafe-swiftshader or --use-angle=swiftshader, so the gm browser launcher needs a GL flag before any swap run. No swap dispatch was run, so there is no witness dispatch id.'\n"
status: "open"
fact: "No match starts on the Pages build, so no two-page data swap can run."
trigger: "A match starts on the Pages build."
