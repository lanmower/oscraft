id: "prd-doodadtoproprenameishalfappliedacrosstoolsdataanddocs"
kind: "prd"
title: "doodad-to-prop rename is half applied across tools, data and docs"
body: "id: doodad-to-prop-rename-is-half-applied-across-tools-data-and-docs\nsubject: doodad-to-prop rename is half applied across tools, data and docs\ndescription: |-\n  - Both families exist in `scenarios/moba/tools/`: `place-doodads-688g.mjs`, `doodad-kinds.mjs`, `doodad-roles.mjs`, `doodad-sizes.mjs` beside `place-props-688g.mjs`, `prop-kinds.mjs`, `prop-roles.mjs`, `prop-sizes.mjs`.\n  - `docs/PROP_TYPES_688G.md` says `place-props-688g.mjs` is called by `convert-688g-map.mjs`, but `scenarios/moba/tools/convert-688g-map.mjs:228` execFileSync's `place-doodads-688g.mjs`.\n  - `assets/doodads.json` and `assets/doodad_sizes.json` remain as dead byte-identical twins of `assets/props.json` and `assets/prop_sizes.json` (same byte size, different inode, older mtime); `manifest.json` binds only the props pair, and no reader cites the doodad pair.\n  - An external placement tool therefore has two plausible targets and the wrong one fails silently.\nacceptance_criteria: 'One family remains: every retained doodad-named file has a file:line reader citation, every reference names the live file, and assets/doodads.json plus assets/doodad_sizes.json are deleted or proven read; the moba page and the 688g map conversion both run with no missing-file error.'\nwitness_plan: codesearch each retained name for its reader citation; confirm no doodads.json path is reachable from manifest.json; build/load the moba page plus the 688g conversion with no missing-file error.\nstatus: pending\nsession_id: mcp-codemode-3556962-1793124624616-139\nowner: mcp-codemode-3556962-1793124624616-139\n"
status: "open"
createdAt: "2026-10-27T22:45:02.000Z"
