title: "One hero icon pack loaded at once so the lobby hero grid renders without per-hero requests"
body: "id: hero-icons-one-pack-loaded-at-once\nsubject: One hero icon pack loaded at once so the lobby hero grid renders without per-hero requests\ndescription: Hero icons (127, scenarios/moba/assets/icons/heroes, resolved per hero by the lobby model name in panels.lua) move out of the per-hero character packs into one content-hashed pack heroes-icons.<sha256[:16]>.bin indexed in packs/index.json. Character packs keep sounds and skill icons; their cache keys change (expected). The client fetches the hero icon pack once before the lobby hero grid renders (play.js packImageUrl / pack index read); other packs stay lazy. Measure requests and bytes before the lobby shows heroes from a gm browser load (console on, CDP cache disabled, headful; clicks on pack, Start, Fill and Claim elements and room joins are allowed); screenshot and numbers under .gm/heroicon-pack/.\nacceptance_criteria: scripts/assets/build-packs.mjs emits heroes-icons.<sha256[:16]>.bin containing all 127 hero icons and indexes it in scenarios/moba/assets/packs/index.json; character packs no longer contain hero icons; js/client/play.js waits for the one icon pack before the lobby hero grid, other packs lazy; built-page smoke still finds 127 hero icons; CI green on the full pushed sha; before/after request and byte counts and screenshot recorded under .gm/heroicon-pack/. Commit body states the cache key change.\nwitness_plan: Browser load via gm browser verb (console on, CDP cache disabled, headful) counting requests and bytes before the lobby shows heroes; ci-status on the pushed full sha.\nsession_id: heroicon-pack-1\nowner: heroicon-pack-1\nstatus: pending\nnotes:\n- ts: 2026-10-25T19:09:01.875Z\n  session_id: heroicon-pack-1\n  note: 'Published 337fe996d11fe9653e9887e13a192690442bf90b (atlases: heroes 127 icons, items 321, skills 15; WebP q80 and KTX2 per atlas, content-hashed, index cells). CI green: ci run 40223943776 (built page smoke success, 127-icon check in that step), pages run 40223943768 (deploy and live compare success). Row stays open for the lobby measurement: the live page in this sandbox stalls at ''starting game ... connecting'' before any pack request (305 s: 113 requests, 1248591 bytes, no lobby; earlier 1066 s attempt: 126 requests, no lobby), so before/after lobby counts are design-level only: before 128 requests and 12924453 pack bytes for the hero grid (127 character packs plus index), after 2 requests (heroes WebP 180832 bytes plus index). Clearing fact: a lobby-level live load from a route whose page mounts the lobby. model-order-1 (coordinator) had not landed on origin at publish; its play.js change must keep the heroes atlas prefetch (packIndex then atlasImage(''heroes'')) ahead of the lobby draw.'\n- ts: 2026-11-02T10:12:46.258Z\n  session_id: mcp-codemode-389565-1793614365458-142\n  note: 'Lane scope: docs/client loading; no pack/atlas or CI wiring change in js/client/play.js/packs visible here. Existing publish/note shows pack work was published earlier (337fe996). Row is a performance/pack load measurement with live browser; out of scope for small UI code edit in this pass. Leaving pending.'\n- ts: 2026-11-02T10:13:47.938Z\n  session_id: mcp-codemode-389565-1793614425920-148\n  note: 'Correction after orienting: scripts/assets/build-packs.mjs already puts all roster hero icons in the single heroes atlas (index.atlases.heroes: webp+ktx2, layout.icons) and character packs now carry only voices/<key> plus skills/<key>.json, so the code premise is fixed. What remains is the row''s witness: a headful gm browser load counting requests/bytes before the lobby hero grid, screenshots under .gm/heroicon-pack/, and CI status on the pushed sha. That measurement is the only remaining work; no code edit in this lane.'\n"
