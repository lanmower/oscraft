title: "Ready screen: one 3D podium stage per team, five hero slots, cached models, name plates, swipe on phones"
body: "id: lobby-ready-screen-3d-podium-stages\nsubject: Ready screen: one 3D podium stage per team, five hero slots, cached models, name plates, swipe on phones\ndescription: 'Owner request: the ready screen (Teams ready to fight) shows both teams as 3D podium stages, one stage per side with five hero slots, each hero standing on its own podium drawn by js/client/render3d.js from its model, through the generic model widget (js/client/widgets.js, stage kind by what it shows). Models are cached before the screen needs them: the picked-model preload (play.js preloadPickedModels) loads each seat model during the lobby, and the ready screen only draws cached models and never starts a load. Empty slots show an empty podium. A model still loading shows its portrait, never a blank. Each podium carries a name plate with the hero acronym (LATE.acronym), no full name. Desktop shows both stages side by side on one dark floor, centred; phones show one team at a time with a horizontal swipe and dots, the same grouping as the hero columns. The backdrop stays dark so the models read clearly. Idle animation is not part of this row unless stated in the witness.'\nacceptance_criteria: 'At 1280x720 and 390x844 the DOM shows two stage nodes, each with five slot nodes (ten slots); every picked hero model is cached (its slot draws a canvas, not a portrait) before Start is pressed; after Start the load gate reports zero pending loads (body data-phase reaches live); screenshots of both widths show the podiums with name plates and a dark backdrop; the phone layout shows one team per view with a swipe.'\nwitness_plan: 'Playwriter on a dev server serving the staged js/client tree (own page, closed in finally). DOM counts of .w-stage and .w-stage-slot at both widths; per-slot state data-state cached before Start; body data-phase after Start; swipe by CDP touch at 390x844; read both screenshots.'\nstatus: pending"
