title: "Live moba guest stalls at tick 810 with no peer frames"
body: "id: live-moba-guest-stalls\nsession_id: live-swap-verify\nsubject: Live moba guest stalls at tick 810 with no peer frames\ndescription: 'Verification of the mid-match data swap on https://lanmower.github.io/oscraft/js/client/play.html#moba (main 0fd7d47, Pages run 39578209874 success). Host tab (?host=1#moba) advances its tick (276 -> 503) and shows peers 0/1 (local) flapping. Guest tab (#moba) joins, reaches peers 1 (net) and 10 hero dots, but its tick stays at 810 across polls spanning more than 10 s and status flips to peers 0 (net). Console shows only the wireweave connecting warning, no errors. Screenshot at /tmp/swapverify/guest.png. Host shows 0 hud5 hero dots while guest shows 10. Step 2 (data swap) not run: the live page has no oscraftd link and the browser swap path is hmr.js module-change only (localhost or ?hmr), so it cannot be triggered on the Pages build without a deploy.'\nstatus: pending\nowner: live-swap-verify\nnotes:\n- ts: 2026-10-25T04:06:11.485Z\n  session_id: drain-net-3\n  note: Waits on lobby-start-world-ready-never-fires-headful (panels lane row, pending at 77168a44). Re-check deferred per row. Blocked.\n"
status: "parked"
createdAt: "2026-10-27T22:45:02.000Z"
parkReason: "The code path is fixed and witnessed by node js/client/net-recovery-check.mjs (\"net-recovery-check: all passed\"): a missing frame baseline now logs once, requests one keyframe, retries JOIN explicitly, and resumes on a later keyframe (commit 73f7686a). The remaining acceptance needs a live two-tab net session on reachable relays, with body[data-ticks] and getState().tick sampled over 10 s before and after the change, plus a fresh host starting a moba match on the live Pages build. The live relays refuse (offchain.pub ERR_CONNECTION_REFUSED, relay.damus.io 503) and the Pages build has no /__hmr swap trigger, so no live witness dispatch exists."
